# CI of the frontend: the tests are plain Node scripts without dependencies (test/*.test.js): the polling schedule, the
# admin dialogs, the legal pages, the Arabic wording of server errors, and the syntax of every inline script.
# No secrets, no network. On a push to main the site is published to GitHub Pages by the `deploy` job, and only when the tests
# are green (Settings → Pages → Source must be "GitHub Actions"). Only the files listed in tools/build-site.js are published.
name: CI

on:
  push:
  pull_request:

# never cancel a run on main: a running run (and its deploy) is finished and the next one waits; on other branches and PRs a newer
# run replaces the older one. (This is the whole run: the separate `pages` group of the deploy job cannot protect it.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run test/*.test.js
        run: |
          status=0
          for f in test/*.test.js; do
            echo "=== $f"
            node "$f" || status=1
          done
          exit $status
      # the same build the deploy job runs: a missing file or a broken link shows up in the pull request, not after the merge
      - name: Build the site folder (dry run of the deploy)
        run: node tools/build-site.js _site

      # only on a pull request: the same upload the deploy job does, so a new version of the action is tried before the merge
      # (the deploy steps themselves run on main only); nothing is published, the artifact is kept for one day
      - name: Try the Pages artifact upload (pull requests only, nothing is deployed)
        if: github.event_name == 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # a separate group: a newer deploy waits for the running one instead of cancelling it half way
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the site folder (only the site files, CNAME included)
        run: node tools/build-site.js _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
