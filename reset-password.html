<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password - Biddex</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>
/* before any CSS: theme = saved choice or the OS setting (same rule as index.html) */
(function () {
  var d = document.documentElement, th = null;
  try { th = localStorage.getItem('biddex_theme'); } catch (e) {}
  if (th !== 'dark' && th !== 'light') th = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  d.setAttribute('data-theme', th);
  var m = document.createElement('meta'); m.name = 'theme-color'; m.content = th === 'dark' ? '#141311' : '#FAF7F2'; document.head.appendChild(m);
})();
</script>
<style>
  :root { color-scheme:light; --bg:#FAF7F2; --panel:#FFFFFF; --tx:#1B1A17; --tx2:#6B665E; --line:#ECE6DC; --acc:#0F766E; --on-acc:#FFFFFF; --ok:#0B5A54; --bad:#B42318; --logo-base:#1B1A17; }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#141311; --panel:#1D1B18; --tx:#F3EFE8; --tx2:#A59E92; --line:#2E2A25; --acc:#34B3A2; --on-acc:#0B1F1C; --ok:#8FE0D3; --bad:#F97066; --logo-base:#FAF7F2; }
  body { margin: 0; font-family: "Readex Pro", system-ui, sans-serif; background: var(--bg); color: var(--tx); text-align: center; padding: 60px 20px; -webkit-font-smoothing: antialiased; }
  .box { max-width: 400px; margin: 0 auto; }
  .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand svg { width: 40px; height: 40px; }
  .brand span, h1 { font-family: "Bricolage Grotesque", "Readex Pro", system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; }
  .brand span { font-size: 22px; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  html[dir=rtl] h1, html[dir=rtl] .brand span { letter-spacing: 0; }
  p { color: var(--tx2); }
  .success { color: var(--ok); }
  .error { color: var(--bad); }
  a { color: var(--acc); }
  form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; text-align: start; }
  label { font-size: 13px; color: var(--tx2); }
  input { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--tx); font: inherit; font-size: 16px; }
  button { min-height: 48px; padding: 12px; border: none; border-radius: 16px; background: var(--acc); color: var(--on-acc); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .lang { position: absolute; top: 16px; inset-inline-end: 16px; min-height: 0; background: none; border: 1px solid var(--line); border-radius: 12px; color: var(--tx2); padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
</style>
</head>
<body>
<button id="langBtn" class="lang" type="button"></button>
<div class="box">
  <div class="brand"><svg viewBox="0 0 56 56" role="img" aria-label="Biddex"><rect x="8" y="5" width="11" height="46" rx="3" style="fill:var(--logo-base);"/><path d="M19 5 H31 a11.5 11.5 0 0 1 0 23 H19 Z" fill="#0F766E"/><path d="M19 28 H34 a11.5 11.5 0 0 1 0 23 H19 Z" fill="#E9A23B"/></svg><span>Biddex</span></div>
  <h1 id="status"></h1>
  <p id="message"></p>
  <form id="resetForm">
    <label id="pwLabel" for="newPassword"></label>
    <input id="newPassword" type="password" minlength="8" required autocomplete="new-password">
    <button id="submitBtn" type="submit"></button>
  </form>
  <p><a id="homeLink" href="index.html#/login"></a></p>
</div>

<script src="server-errors.js?v=2"></script>
<script>
const I18N = {
  en: {
    title: 'Reset Password - Biddex', heading: 'Set a new password', newPassword: 'New password',
    placeholder: 'At least 8 characters', submit: 'Reset password', missingToken: 'Missing token',
    done: 'Password reset!', canLogIn: 'You can now log in to Biddex with your new password.',
    failed: 'Reset failed', wentWrong: 'Something went wrong', home: 'Go to Biddex'
  },
  ar: {
    title: 'إعادة تعيين كلمة المرور - بيدكس', heading: 'عيّن كلمة مرور جديدة', newPassword: 'كلمة المرور الجديدة',
    placeholder: '8 أحرف على الأقل', submit: 'إعادة تعيين كلمة المرور', missingToken: 'الرمز مفقود',
    done: 'تمت إعادة تعيين كلمة المرور!', canLogIn: 'يمكنك الآن تسجيل الدخول إلى بيدكس بكلمة المرور الجديدة.',
    failed: 'فشلت إعادة التعيين', wentWrong: 'حدث خطأ ما', home: 'الانتقال إلى بيدكس'
  }
};

// Same key as index.html; fall back to the browser language for people opening the email link elsewhere.
// t() / tpl() as in index.html
function t(key) { return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key; }
function tpl(key, vars) { return t(key).replace(/\{(\w+)\}/g, (m, k) => vars && vars[k] != null ? vars[k] : m); }

let lang;
try { lang = localStorage.getItem('biddex_lang'); } catch(e) {}
if (lang !== 'ar' && lang !== 'en') lang = (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';

// status/message hold translation keys; `raw` is a backend error text, shown translated when server-errors.js knows it.
const view = { status: 'heading', cls: '', message: null, raw: '' };

const form = document.getElementById('resetForm');
const submitBtn = document.getElementById('submitBtn');

function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('title');
  document.getElementById('langBtn').textContent = lang === 'ar' ? 'EN' : 'العربية';
  document.getElementById('homeLink').textContent = t('home');
  document.getElementById('pwLabel').textContent = t('newPassword');
  document.getElementById('newPassword').placeholder = t('placeholder');
  submitBtn.textContent = t('submit');
  document.getElementById('status').textContent = t(view.status);
  document.getElementById('status').className = view.cls;
  document.getElementById('message').textContent = view.message ? t(view.message) : serverError(view.raw, lang);
}
function show(patch) { Object.assign(view, patch); render(); }

document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('biddex_lang', lang); } catch(e) {}
  render();
});

const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const API_URL = 'https://b2b-procurement-backend-production.up.railway.app';

render();
if (!token) {
  show({ status: 'missingToken', cls: 'error' });
  form.style.display = 'none';
} else {
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    submitBtn.disabled = true;
    show({ message: null, raw: '' });
    fetch(API_URL + '/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword })
    })
      .then(res => res.ok
        ? res.json().then(data => ({ ok: !!data.ok, error: data.error || '' }))
        : readServerError(res).then(error => ({ ok: false, error })))
      .then(result => {
        if (result.ok) {
          show({ status: 'done', cls: 'success', message: 'canLogIn' });
          form.style.display = 'none';
        } else {
          show({ status: result.error ? 'failed' : 'wentWrong', cls: 'error', message: null, raw: result.error }); // no readable text (HTML error page, empty body): the generic heading
          submitBtn.disabled = false;
        }
      })
      .catch(() => {
        show({ status: 'wentWrong', cls: 'error' });
        submitBtn.disabled = false;
      });
  });
}
</script>
</body>
</html>
