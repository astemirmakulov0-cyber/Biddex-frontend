<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password - Biddex</title>
<style>
  body { font-family: Arial, sans-serif; background: #1a1a4e; color: white; text-align: center; padding: 60px 20px; }
  .box { max-width: 400px; margin: 0 auto; }
  h1 { font-size: 24px; }
  .success { color: #4ade80; }
  .error { color: #f87171; }
  a { color: #ec4899; }
  form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; text-align: left; }
  label { font-size: 13px; }
  input { padding: 10px; border-radius: 6px; border: 1px solid #444; font-size: 15px; }
  button { padding: 12px; border: none; border-radius: 6px; background: #ec4899; color: white; font-size: 15px; font-weight: bold; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<div class="box">
  <h1 id="status">Set a new password</h1>
  <p id="message"></p>
  <form id="resetForm">
    <label for="newPassword">New password</label>
    <input id="newPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters">
    <button id="submitBtn" type="submit">Reset password</button>
  </form>
  <p><a href="index.html">Go to Biddex</a></p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const API_URL = 'https://b2b-procurement-backend-production.up.railway.app';

const statusEl = document.getElementById('status');
const messageEl = document.getElementById('message');
const form = document.getElementById('resetForm');
const submitBtn = document.getElementById('submitBtn');

if (!token) {
  statusEl.textContent = 'Missing token';
  statusEl.className = 'error';
  form.style.display = 'none';
} else {
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    submitBtn.disabled = true;
    messageEl.textContent = '';
    fetch(API_URL + '/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword })
    })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          statusEl.textContent = 'Password reset!';
          statusEl.className = 'success';
          messageEl.textContent = 'You can now log in to Biddex with your new password.';
          form.style.display = 'none';
        } else {
          statusEl.textContent = 'Reset failed';
          statusEl.className = 'error';
          messageEl.textContent = data.error || '';
          submitBtn.disabled = false;
        }
      })
      .catch(() => {
        statusEl.textContent = 'Something went wrong';
        statusEl.className = 'error';
        submitBtn.disabled = false;
      });
  });
}
</script>
</body>
</html>
