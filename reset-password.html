<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password - Biddex</title>
<style>
  body { font-family: Arial, sans-serif; background: #1a1a4e; color: white; text-align: center; padding: 60px 20px; }
  .box { max-width: 400px; margin: 0 auto; }
  h1 { font-size: 24px; }
  .success { color: #4ade80; }
  .error { color: #f87171; }
  a { color: #ec4899; }
  form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; text-align: start; }
  label { font-size: 13px; }
  input { padding: 10px; border-radius: 6px; border: 1px solid #444; font-size: 15px; }
  button { padding: 12px; border: none; border-radius: 6px; background: #ec4899; color: white; font-size: 15px; font-weight: bold; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .lang { position: absolute; top: 16px; inset-inline-end: 16px; background: none; border: 1px solid #ffffff55; padding: 6px 10px; font-size: 13px; font-weight: normal; }
</style>
</head>
<body>
<button id="langBtn" class="lang" type="button"></button>
<div class="box">
  <h1 id="status"></h1>
  <p id="message"></p>
  <form id="resetForm">
    <label id="pwLabel" for="newPassword"></label>
    <input id="newPassword" type="password" minlength="6" required autocomplete="new-password">
    <button id="submitBtn" type="submit"></button>
  </form>
  <p><a id="homeLink" href="index.html"></a></p>
</div>

<script>
const T = {
  en: {
    title: 'Reset Password - Biddex', heading: 'Set a new password', newPassword: 'New password',
    placeholder: 'At least 6 characters', submit: 'Reset password', missingToken: 'Missing token',
    done: 'Password reset!', canLogIn: 'You can now log in to Biddex with your new password.',
    failed: 'Reset failed', wentWrong: 'Something went wrong', home: 'Go to Biddex'
  },
  ar: {
    title: 'إعادة تعيين كلمة المرور - بيدكس', heading: 'عيّن كلمة مرور جديدة', newPassword: 'كلمة المرور الجديدة',
    placeholder: '6 أحرف على الأقل', submit: 'إعادة تعيين كلمة المرور', missingToken: 'الرمز مفقود',
    done: 'تمت إعادة تعيين كلمة المرور!', canLogIn: 'يمكنك الآن تسجيل الدخول إلى بيدكس بكلمة المرور الجديدة.',
    failed: 'فشلت إعادة التعيين', wentWrong: 'حدث خطأ ما', home: 'الانتقال إلى بيدكس'
  }
};

// Same key as index.html; fall back to the browser language for people opening the email link elsewhere.
let lang;
try { lang = localStorage.getItem('biddex_lang'); } catch(e) {}
if (lang !== 'ar' && lang !== 'en') lang = (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';

// status/message hold translation keys; `raw` is a backend error shown as-is.
const view = { status: 'heading', cls: '', message: null, raw: '' };

const form = document.getElementById('resetForm');
const submitBtn = document.getElementById('submitBtn');

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t.title;
  document.getElementById('langBtn').textContent = lang === 'ar' ? 'EN' : 'العربية';
  document.getElementById('homeLink').textContent = t.home;
  document.getElementById('pwLabel').textContent = t.newPassword;
  document.getElementById('newPassword').placeholder = t.placeholder;
  submitBtn.textContent = t.submit;
  document.getElementById('status').textContent = t[view.status];
  document.getElementById('status').className = view.cls;
  document.getElementById('message').textContent = view.message ? t[view.message] : view.raw;
}
function show(patch) { Object.assign(view, patch); render(); }

document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('biddex_lang', lang); } catch(e) {}
  render();
});

const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const API_URL = 'https://b2b-procurement-backend-production.up.railway.app';

render();
if (!token) {
  show({ status: 'missingToken', cls: 'error' });
  form.style.display = 'none';
} else {
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    submitBtn.disabled = true;
    show({ message: null, raw: '' });
    fetch(API_URL + '/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword })
    })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          show({ status: 'done', cls: 'success', message: 'canLogIn' });
          form.style.display = 'none';
        } else {
          show({ status: 'failed', cls: 'error', message: null, raw: data.error || '' });
          submitBtn.disabled = false;
        }
      })
      .catch(() => {
        show({ status: 'wentWrong', cls: 'error' });
        submitBtn.disabled = false;
      });
  });
}
</script>
</body>
</html>
