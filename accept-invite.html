<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Join your team - Biddex</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>
/* The invitation carries its token in the address fragment (#t=...). Read it first and remove it from the address at
   once, so it does not stay in the address bar, history or a copied URL. It lives only in this variable. */
var INVITE_TOKEN = null;
(function () {
  var m = /(?:^#|&)t=([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash);
  if (m) INVITE_TOKEN = m[1];
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
})();
/* before any CSS: theme = saved choice or the OS setting (same rule as index.html) */
(function () {
  var d = document.documentElement, th = null;
  try { th = localStorage.getItem('biddex_theme'); } catch (e) {}
  if (th !== 'dark' && th !== 'light') th = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  d.setAttribute('data-theme', th);
  var m = document.createElement('meta'); m.name = 'theme-color'; m.content = th === 'dark' ? '#141311' : '#FAF7F2'; document.head.appendChild(m);
})();
</script>
<style>
  :root { color-scheme:light; --bg:#FAF7F2; --panel:#FFFFFF; --tx:#1B1A17; --tx2:#6B665E; --line:#ECE6DC; --acc:#0F766E; --acc-soft:#E3F2EF; --acc-ink:#0B5A54; --on-acc:#FFFFFF; --bad:#B42318; --bad-soft:#FDECEA; --ok-bg:#E3F2EF; --ok-tx:#0B5A54; --logo-base:#1B1A17; }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#141311; --panel:#1D1B18; --tx:#F3EFE8; --tx2:#A59E92; --line:#2E2A25; --acc:#34B3A2; --acc-soft:#16312D; --acc-ink:#8FE0D3; --on-acc:#0B1F1C; --bad:#F97066; --bad-soft:#3A1A17; --ok-bg:#16312D; --ok-tx:#8FE0D3; --logo-base:#FAF7F2; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Readex Pro", system-ui, sans-serif; background: var(--bg); color: var(--tx); padding: 56px 16px 40px; -webkit-font-smoothing: antialiased; line-height: 1.5; }
  .box { max-width: 460px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .brand svg { width: 36px; height: 36px; }
  .brand span, h1 { font-family: "Bricolage Grotesque", "Readex Pro", system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; }
  .brand span { font-size: 21px; }
  h1 { font-size: 24px; margin: 0 0 8px; line-height: 1.25; }
  html[dir=rtl] h1, html[dir=rtl] .brand span { letter-spacing: 0; }
  p { margin: 0 0 10px; }
  .muted { color: var(--tx2); font-size: 14px; }
  .chip { display: inline-block; background: var(--acc-soft); color: var(--acc-ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--tx2); margin-bottom: 16px; }
  input[type=text], input[type=password], input[type=email] { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--tx); font: inherit; font-size: 16px; width: 100%; }
  input:focus { outline: 2px solid var(--acc); outline-offset: 1px; }
  input[disabled] { opacity: .7; }
  .check { flex-direction: row; align-items: flex-start; gap: 10px; font-weight: 400; color: var(--tx); font-size: 14px; }
  .check input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--acc); }
  button.primary { width: 100%; min-height: 48px; padding: 12px; border: none; border-radius: 16px; background: var(--acc); color: var(--on-acc); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  a.primary { display: block; text-align: center; text-decoration: none; min-height: 48px; padding: 12px; border-radius: 16px; background: var(--acc); color: var(--on-acc); font-size: 15px; font-weight: 700; }
  .ok { background: var(--ok-bg); color: var(--ok-tx); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; font-weight: 600; font-size: 14px; }
  .err { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; font-size: 14px; }
  .center { text-align: center; padding-top: 40px; }
  .lang { position: absolute; top: 14px; inset-inline-end: 14px; background: none; border: 1px solid var(--line); border-radius: 12px; color: var(--tx2); padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  a { color: var(--acc-ink); }
</style>
</head>
<body>
<button id="langBtn" class="lang" type="button"></button>
<div class="box">
  <div class="brand"><svg viewBox="0 0 56 56" role="img" aria-label="Biddex"><rect x="8" y="5" width="11" height="46" rx="3" style="fill:var(--logo-base);"/><path d="M19 5 H31 a11.5 11.5 0 0 1 0 23 H19 Z" fill="#0F766E"/><path d="M19 28 H33 a11.5 11.5 0 0 1 0 23 H19 Z" fill="#E8A33D"/></svg><span>Biddex</span></div>
  <div id="view"></div>
</div>

<script src="config.js?v=1"></script>
<script src="server-errors.js?v=4"></script>
<script>
const API_URL = window.BIDDEX_API; // config.js: production API on the real domains, the local backend on localhost

const I18N = {
  en: {
    title: 'Join your team - Biddex', loading: 'Opening your invitation…',
    invalidTitle: 'This invitation can’t be used', invalidBody: 'The link is not valid, has expired, was already used or was cancelled. Ask the person who invited you to send a new invitation.',
    noToken: 'Open the link from your invitation email again. It is not kept in the address of this page.',
    inUseTitle: 'This email already has a Biddex account', inUseBody: 'Each person belongs to one company, so this invitation can’t be accepted with {email}. Ask to be invited with another email address.',
    joinTitle: 'Join {company}', joinBody: '{inviter} invited you to work in the {company} account on Biddex as {role}.', joinBodyNoName: 'You were invited to work in the {company} account on Biddex as {role}.',
    role_MANAGER: 'a Manager', role_STAFF: 'Staff', role_OWNER: 'an Owner',
    roleHelp_MANAGER: 'You can publish requests, choose the supplier, record payments, write reviews and see spending.',
    roleHelp_STAFF: 'You can prepare draft requests, confirm receipt, open disputes and use chat, documents and stock.',
    roleHelp_OWNER: 'You can do everything, including managing people and company data.',
    email: 'Email', fullName: 'Your full name', password: 'Choose a password', passwordHint: 'At least 8 characters.',
    consentText: 'I accept the {terms} and the {privacy}.', terms: 'Terms of Service', privacy: 'Privacy Policy',
    accept: 'Create my account and join', accepting: 'Joining…', until: 'This invitation works until {date}.',
    doneTitle: 'You joined {company}', doneBody: 'Your account is ready. Log in with {email} and the password you chose.', login: 'Log in',
    nameRequired: 'Enter your full name.', passwordShort: 'The password must be at least 8 characters.', consentRequired: 'Please accept the Terms and the Privacy Policy.',
    errGeneric: 'Something went wrong. Please try again.'
  },
  ar: {
    title: 'الانضمام إلى فريقك - Biddex', loading: 'جارٍ فتح الدعوة…',
    invalidTitle: 'لا يمكن استخدام هذه الدعوة', invalidBody: 'الرابط غير صالح أو انتهت مدته أو سبق استخدامه أو أُلغيت الدعوة. اطلب ممن دعاك إرسال دعوة جديدة.',
    noToken: 'افتح الرابط من رسالة الدعوة في بريدك مرة أخرى. فهو لا يُحفظ في عنوان هذه الصفحة.',
    inUseTitle: 'هذا البريد الإلكتروني لديه حساب في Biddex بالفعل', inUseBody: 'كل شخص ينتمي إلى شركة واحدة، لذا لا يمكن قبول هذه الدعوة بالبريد {email}. اطلب أن تُدعى ببريد إلكتروني آخر.',
    joinTitle: 'الانضمام إلى {company}', joinBody: 'دعاك {inviter} للعمل في حساب {company} على Biddex بدور {role}.', joinBodyNoName: 'تمت دعوتك للعمل في حساب {company} على Biddex بدور {role}.',
    role_MANAGER: 'مدير', role_STAFF: 'موظف', role_OWNER: 'مالك',
    roleHelp_MANAGER: 'يمكنك نشر الطلبات واختيار المورّد وتسجيل المدفوعات وكتابة التقييمات ورؤية الإنفاق.',
    roleHelp_STAFF: 'يمكنك إعداد مسودات الطلبات وتأكيد الاستلام وفتح النزاعات واستخدام المحادثة والمستندات والمخزون.',
    roleHelp_OWNER: 'يمكنك فعل كل شيء، بما في ذلك إدارة الأشخاص وبيانات الشركة.',
    email: 'البريد الإلكتروني', fullName: 'اسمك الكامل', password: 'اختر كلمة مرور', passwordHint: '8 أحرف على الأقل.',
    consentText: 'أوافق على {terms} و{privacy}.', terms: 'شروط الخدمة', privacy: 'سياسة الخصوصية',
    accept: 'إنشاء حسابي والانضمام', accepting: 'جارٍ الانضمام…', until: 'تعمل هذه الدعوة حتى {date}.',
    doneTitle: 'انضممت إلى {company}', doneBody: 'حسابك جاهز. سجّل الدخول بالبريد {email} وكلمة المرور التي اخترتها.', login: 'تسجيل الدخول',
    nameRequired: 'أدخل اسمك الكامل.', passwordShort: 'يجب ألا تقل كلمة المرور عن 8 أحرف.', consentRequired: 'يرجى الموافقة على الشروط وسياسة الخصوصية.',
    errGeneric: 'حدث خطأ ما. حاول مرة أخرى.'
  }
};

let lang;
try { lang = localStorage.getItem('biddex_lang'); } catch (e) {}
if (lang !== 'ar' && lang !== 'en') lang = (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';
function t(key) { return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key; }
function tpl(key, vars) { return t(key).replace(/\{(\w+)\}/g, (m, k) => vars && vars[k] != null ? vars[k] : m); }
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dateLocale = () => lang === 'ar' ? 'ar-BH-u-nu-latn' : undefined;
const fmtDateTime = (d) => new Date(d).toLocaleString(dateLocale(), { dateStyle: 'medium', timeStyle: 'short' });
const legalUrl = (page) => (lang === 'ar' ? 'ar/' : '') + page + '.html';

// view state: phase = loading | invalid | noToken | inUse | ready | done; data = the GET answer
const view = { phase: 'loading', data: null, busy: false, error: '', name: '', password: '', consent: false };

async function api(method, path, body) {
  const res = await fetch(API_URL + '/api' + path, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Invite ' + INVITE_TOKEN }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => null);
  return { status: res.status, data };
}

async function load() {
  if (!INVITE_TOKEN) { view.phase = 'noToken'; return render(); }
  let r;
  try { r = await api('GET', '/public/invite'); } catch (e) { r = { status: 0, data: null }; }
  if (r.status === 200) { view.data = r.data; view.phase = r.data.emailInUse ? 'inUse' : 'ready'; }
  else view.phase = r.status === 0 ? 'error' : 'invalid';
  render();
}

function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('title');
  document.getElementById('langBtn').textContent = lang === 'ar' ? 'EN' : 'العربية';
  const el = document.getElementById('view');
  const d = view.data;
  if (view.phase === 'loading') { el.innerHTML = '<p class="muted center">' + esc(t('loading')) + '</p>'; return; }
  if (view.phase === 'error') { el.innerHTML = '<div class="card center"><p class="muted">' + esc(t('errGeneric')) + '</p></div>'; return; }
  if (view.phase === 'invalid' || view.phase === 'noToken') {
    el.innerHTML = '<div class="card center"><h1>' + esc(t('invalidTitle')) + '</h1><p class="muted">' + esc(t(view.phase === 'noToken' ? 'noToken' : 'invalidBody')) + '</p></div>';
    return;
  }
  if (view.phase === 'inUse') {
    el.innerHTML = '<div class="card center"><h1>' + esc(t('inUseTitle')) + '</h1><p class="muted">' + tpl('inUseBody', { email: '<bdi dir="ltr">' + esc(d.email) + '</bdi>' }) + '</p></div>';
    return;
  }
  if (view.phase === 'done') {
    el.innerHTML = '<div class="card center"><h1>' + tpl('doneTitle', { company: esc(d.companyName) }) + '</h1><p class="muted">' + tpl('doneBody', { email: '<bdi dir="ltr">' + esc(d.email) + '</bdi>' }) + '</p>' +
      '<a class="primary" href="./?lang=' + lang + '#/login">' + esc(t('login')) + '</a></div>';
    return;
  }
  const role = tpl('role_' + d.role, {});
  const intro = d.invitedBy ? tpl('joinBody', { inviter: esc(d.invitedBy), company: esc(d.companyName), role: esc(role) }) : tpl('joinBodyNoName', { company: esc(d.companyName), role: esc(role) });
  const links = { terms: '<a href="' + legalUrl('terms') + '" target="_blank" rel="noopener">' + esc(t('terms')) + '</a>', privacy: '<a href="' + legalUrl('privacy') + '" target="_blank" rel="noopener">' + esc(t('privacy')) + '</a>' };
  el.innerHTML =
    '<h1>' + tpl('joinTitle', { company: esc(d.companyName) }) + '</h1>' +
    '<p class="muted">' + intro + ' ' + esc(t('roleHelp_' + d.role)) + '</p>' +
    (view.error ? '<div class="err" role="alert">' + esc(view.error) + '</div>' : '') +
    '<form class="card" onsubmit="return submitAccept(event)" novalidate>' +
      '<label>' + esc(t('email')) + '<input type="email" dir="ltr" value="' + esc(d.email) + '" disabled></label>' +
      '<label>' + esc(t('fullName')) + '<input id="fName" type="text" maxlength="100" autocomplete="name" value="' + esc(view.name) + '" oninput="onField()"></label>' +
      '<label>' + esc(t('password')) + '<input id="fPassword" type="password" autocomplete="new-password" value="' + esc(view.password) + '" oninput="onField()"><span style="font-weight:400">' + esc(t('passwordHint')) + '</span></label>' +
      '<label class="check"><input id="fConsent" type="checkbox"' + (view.consent ? ' checked' : '') + ' onchange="onField()"><span>' + tpl('consentText', links) + '</span></label>' +
      '<button class="primary" type="submit"' + (view.busy ? ' disabled' : '') + '>' + esc(view.busy ? t('accepting') : t('accept')) + '</button></form>' +
    '<p class="muted">' + tpl('until', { date: esc(fmtDateTime(d.expiresAt)) }) + '</p>';
}

function readForm() {
  const n = document.getElementById('fName'), p = document.getElementById('fPassword'), c = document.getElementById('fConsent');
  if (n) view.name = n.value; if (p) view.password = p.value; if (c) view.consent = c.checked;
}
function onField() { readForm(); }

async function submitAccept(e) {
  e.preventDefault();
  readForm();
  const fail = (key) => { view.error = t(key); render(); return false; };
  if (!view.name.trim()) return fail('nameRequired');
  if (view.password.length < 8) return fail('passwordShort');
  if (!view.consent) return fail('consentRequired');
  view.busy = true; view.error = ''; render();
  let r;
  try { r = await api('POST', '/public/invite/accept', { fullName: view.name.trim(), password: view.password, consent: true }); } catch (err) { r = { status: 0, data: null }; }
  view.busy = false;
  if (r.status === 200 || r.status === 201) {
    view.password = ''; view.phase = 'done';
  } else if (r.status === 404) {
    view.phase = 'invalid';
  } else if (r.status === 409 && r.data && /already belongs to another Biddex account/.test(r.data.error || '')) {
    view.phase = 'inUse';
  } else {
    view.error = (r.data && r.data.error) ? serverError(r.data.error, lang) : t('errGeneric');
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  return false;
}

document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('biddex_lang', lang); } catch (e) {}
  readForm(); render();
});

render();
load();
</script>
</body>
</html>
