// ---- price history ----
function bidStatusPill(status){
  const map = {
    AWARDED: ['background:var(--pend-soft); color:var(--pend);', t('stAwarded')],
    REJECTED: ['background:var(--bad-soft); color:var(--bad);', t('stRejected')],
    WITHDRAWN: ['background:var(--line); color:var(--tx2);', t('stWithdrawn')],
    SHORTLISTED: ['background:var(--info-soft); color:var(--info);', t('stShortlisted')],
    SUBMITTED: ['background:var(--line); color:var(--tx2);', t('prSubmitted')],
  };
  const m = map[status] || ['background:var(--line); color:var(--tx2);', esc(status)];
  return '<span class="rounded-full px-2 py-0.5 text-[10.5px] font-semibold" style="' + m[0] + '">' + m[1] + '</span>';
}
function priceChart(series){
  const pts = series.filter(s => s.chosen != null || s.cheapest != null);
  if (pts.length < 2) return '';
  const vals = pts.flatMap(s => [s.chosen, s.cheapest]).filter(v => v != null).map(Number);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const W = Math.max(300, pts.length * 56), H = 130, padX = 24, top = 14, bottom = 22;
  const x = (i) => padX + (pts.length === 1 ? 0 : (i * (W - 2 * padX)) / (pts.length - 1));
  const y = (v) => top + (H - ((Number(v) - lo) / span) * H);
  const line = (key, color, dash) => {
    const p = pts.map((s, i) => s[key] != null ? [x(i), y(s[key])] : null).filter(Boolean);
    return (p.length > 1 ? '<polyline fill="none" stroke="' + color + '" stroke-width="2"' + (dash ? ' stroke-dasharray="5 4"' : '') + ' points="' + p.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') + '"/>' : '') +
      p.map((q, i) => '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3.5" fill="' + color + '"/>').join('');
  };
  const svg = '<svg viewBox="0 0 ' + W + ' ' + (H + top + bottom) + '" width="' + W + '" height="' + (H + top + bottom) + '" role="img" aria-label="' + esc(t('prChartTitle')) + '" style="display:block; direction:ltr; margin-right:auto;">' +
    line('cheapest', 'var(--tx3)', true) + line('chosen', 'var(--acc)', false) +
    pts.map((s, i) => '<text x="' + x(i).toFixed(1) + '" y="' + (top + H + 16) + '" text-anchor="middle" font-size="10" fill="var(--tx3)">' + esc(spendDayLabel(s.day, spLocale()).replace(/\/20(\d\d)$/, '/$1')) + '</text>' +
      (s.chosen != null ? '<title>' + esc(spendDayLabel(s.day, spLocale()) + ': ' + spendMoney(s.chosen)) + '</title>' : '')).join('') + '</svg>';
  return '<div class="mb-4 overflow-x-auto" style="direction:rtl;">' + svg + '</div>' +
    '<div class="mb-4 flex flex-wrap gap-4 text-[12px]" style="color:var(--tx3);"><span><span style="display:inline-block; width:18px; border-top:2px solid var(--acc); vertical-align:middle;"></span> ' + t('prChosenLine') + '</span>' +
    '<span><span style="display:inline-block; width:18px; border-top:2px dashed var(--tx3); vertical-align:middle;"></span> ' + t('prLowestLine') + '</span></div>';
}

function openStockAdd(){

}
function openStockEdit(id){
  const it = (state.stock || []).find(s => s.id === id);
  if (!it) return;
  setState({ showStockAdd:true, editStockId:id, stockForm:{ name: it.name, brand: it.brand||'', unit: it.unit, quantity: String(Number(it.quantity)), threshold: String(Number(it.threshold)) } });
}
function closeStockAdd(){ setState({ showStockAdd:false, editStockId:null }); }
function onStockField(field, e){ state.stockForm[field] = e.target.value; }

async function saveStockItem(){
  const f = state.stockForm;
  if (!f.name.trim()) { showToast(t('stockNameRequired')); return; }
  setState({ stockBusy:true });
  try {
    if (state.editStockId) {
      await api('/api/stock/' + state.editStockId, { method:'PATCH', body: JSON.stringify({ name: f.name, brand: f.brand || null, unit: f.unit, threshold: parseMoneyInput(f.threshold) || 0 }) });
      showToast(t('toastStockUpdated'));
    } else {
      await api('/api/stock', { method:'POST', body: JSON.stringify({ name: f.name, brand: f.brand || null, unit: f.unit, quantity: parseMoneyInput(f.quantity) || 0, threshold: parseMoneyInput(f.threshold) || 0 }) });
      showToast(t('toastStockAdded'));
    }
    setState({ showStockAdd:false, editStockId:null, stockBusy:false });
    refreshStock();
  } catch(e) { setState({ stockBusy:false }); showToast(e.message); }
}

async function deleteStockItemUi(id){
  if (!confirm(t('confirmRemoveStock'))) return;
  try { await api('/api/stock/' + id, { method:'DELETE' }); showToast(t('toastStockRemoved')); refreshStock(); }
  catch(e) { showToast(e.message); }
}

function openStockCount(id){ setState({ showStockCount:id, stockCountValue: String(Number((state.stock||[]).find(s=>s.id===id)?.quantity || 0)) }); }
function closeStockCount(){ setState({ showStockCount:null }); }
function onStockCountField(e){ state.stockCountValue = e.target.value; }
async function submitStockCount(){
  const id = state.showStockCount;
  const qty = parseMoneyInput(state.stockCountValue);
  if (qty == null || qty < 0) { showToast(t('stockNumberHint')); return; }
  setState({ stockBusy:true });
  try {
    await api('/api/stock/' + id + '/count', { method:'POST', body: JSON.stringify({ quantity: qty }) });
    setState({ showStockCount:null, stockBusy:false });
    showToast(t('toastStockCounted'));
    refreshStock();
  } catch(e) { setState({ stockBusy:false }); showToast(e.message); }
}

// Opens "Post an RFQ" prefilled from a known product (a stock item or a past order) — the buyer still
// reviews and publishes normally, nothing is submitted on their behalf.
function openReorder({ title, unit, brand, category, quantity, productId }){
  resetProductSearch();
  setState({ showPostRfq:true, editRfqId:null, rfqMore:null, rfqDatePick:false, newRfq:{
    title: title || '', quantity: quantity != null ? String(quantity) : '', unit: unit || 'pcs',
    deadline: '', category: ACTIVE_CATEGORIES.includes(category) ? category : defaultRfqCategory(), budget: '',
    specifications: '', brand: brand || '', exactBrandOnly: false, productId: productId || undefined, productImageUrl: null
  } });
}
function reorderFromStock(id){
  const it = (state.stock || []).find(s => s.id === id);
  if (!it) return;
  openReorder({ title: it.name, unit: it.unit, brand: it.brand, quantity: it.quantity, productId: it.catalogItemId });
}
function reorderFromOrder(orderId){
  const o = (state.orders || []).find(x => x.id === orderId);
  const rfq = o && o.lpo && o.lpo.rfq;
  if (!rfq) return;
  openReorder({ title: rfq.title, unit: rfq.unit, brand: rfq.brand, quantity: rfq.quantity, productId: rfq.productId, category: categoryLabel(rfq.category) });
}

// ---------- "?" hints ----------
// hint('rfq') renders a small "?" button; its text is t('hint_rfq'). Hover/focus on devices with a mouse, tap
// elsewhere. The bubble is one fixed-position element on <body> (never clipped by a modal's overflow) that is
// rebuilt on every open, so it always matches the current language.
function hint(key){
  return '<button type="button" class="bx-hint" data-hint="' + key + '" aria-label="' + esc(t('hintLabel')) + '">?</button>';
}
let hintBtn = null;
const hintCanHover = !!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
function hintClose(){
  const p = document.getElementById('bx-hint-pop');
  if (p) p.remove();
  hintBtn = null;
}
function hintOpen(btn){
  hintClose();
  const pop = document.createElement('div');
  pop.id = 'bx-hint-pop'; pop.className = 'bx-hint-pop'; pop.setAttribute('role', 'tooltip');
  pop.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  pop.textContent = t('hint_' + btn.getAttribute('data-hint'));
  document.body.appendChild(pop);
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight, vw = document.documentElement.clientWidth;
  const left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, vw - w - 8));
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 8 && r.top - h - 8 > 8) top = r.top - h - 8;
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  hintBtn = btn;
}
// capture phase: a "?" inside a label/modal header must not trigger the parent's click (focus, close, ...)
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('[data-hint]');
  if (b) { e.preventDefault(); e.stopPropagation(); if (hintBtn === b && !hintCanHover) hintClose(); else hintOpen(b); return; }
  if (hintBtn) hintClose();
}, true);
document.addEventListener('mouseover', (e) => { if (!hintCanHover) return; const b = e.target.closest && e.target.closest('[data-hint]'); if (b && b !== hintBtn) hintOpen(b); });
document.addEventListener('mouseout', (e) => { if (!hintCanHover || !hintBtn) return; if (!(e.relatedTarget && hintBtn.contains(e.relatedTarget)) && e.target.closest && e.target.closest('[data-hint]') === hintBtn) hintClose(); });
document.addEventListener('focusin', (e) => { if (!hintCanHover) return; const b = e.target.closest && e.target.closest('[data-hint]'); if (b) hintOpen(b); });
document.addEventListener('focusout', (e) => { if (hintCanHover && hintBtn && e.target === hintBtn) hintClose(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hintClose(); });
window.addEventListener('scroll', hintClose, true);
window.addEventListener('resize', hintClose);

// ---------- First-steps checklist (home page card) ----------
// Steps come from GET /api/onboarding (derived from real data on the server, so they tick by themselves).
async function refreshOnboarding(){
  if (!state.token || !state.company || state.view === 'admin') return;
  try { const data = await api('/api/onboarding'); setIfChanged('onboarding', data); }
  catch(e) { /* a nicety: if it fails the card just stays as it was */ }
}
const OB_GO = {
  profile: () => setSection('profile'),
  verification: () => openVerifyModal(),
  firstRfq: () => openPostRfq(),
  award: () => setSection('rfqs'),
  receipt: () => setSection('lpos'),
  stock: () => { setSection('stock'); openStockAdd(); },
  catalog: () => setSection('catalog'),
  firstBid: () => setSection('rfqs'),
  acceptLpo: () => setSection('lpos'),
};
function obGo(key){ if (OB_GO[key]) OB_GO[key](); }
async function setOnboardingHidden(hidden){
  try {
    await api('/api/onboarding', { method:'PATCH', body: JSON.stringify({ hidden }) });
    if (hidden) setState({ onboarding: { ...state.onboarding, visible:false, state:'hidden', dismissed:true } });
    else { await refreshOnboarding(); showToast(t('obShownToast')); }
  } catch(e) { showToast(e.message); }
}
function onboardingCard(){
  const ob = state.onboarding;
  if (!ob || !ob.visible) return '';
  const hideBtn = '<button type="button" onclick="setOnboardingHidden(true)" class="shrink-0 rounded-lg px-2 py-1 text-[12px] font-semibold" style="color:var(--tx4);">' + t('obHide') + '</button>';
  if (ob.state === 'done') {
    return '<div class="mb-6 flex items-center justify-between gap-3 rounded-xl border px-4 py-2.5" style="border-color:var(--ok); background:var(--ok-soft);">' +
      '<span class="min-w-0 text-[13px] font-semibold" style="color:var(--ok);">✓ ' + t('obDoneChip') + '</span>' + hideBtn + '</div>';
  }
  const firstOpen = ob.steps.findIndex(x => !x.done && !x.optional);
  const rows = ob.steps.map((x, i) => {
    const current = i === firstOpen;
    const review = x.key === 'verification' && x.status === 'IN_REVIEW';
    const dot = x.done
      ? '<span class="grid h-6 w-6 shrink-0 place-items-center rounded-full text-[12px] font-bold text-white" style="background:var(--ok);">✓</span>'
      : '<span class="mono grid h-6 w-6 shrink-0 place-items-center rounded-full border text-[11px] font-bold" style="' + (current ? 'border-color:var(--acc); color:var(--acc);' : 'border-color:var(--bd2); color:var(--tx4);') + '">' + (i + 1) + '</span>';
    const action = x.done ? ''
      : review ? '<span class="shrink-0 rounded-full px-2.5 py-1 text-[11px] font-semibold" style="background:var(--info-soft); color:var(--info);">' + t('obInReview') + '</span>'
      : '<button type="button" onclick="obGo(\'' + x.key + '\')" class="shrink-0 rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="' + (current ? 'background:var(--acc); border-color:var(--acc); color:#fff;' : 'border-color:var(--bd2); color:var(--tx2);') + '">' + t('obGo') + '</button>';
    return '<div class="flex items-center gap-3 py-2.5' + (i ? ' border-t' : '') + '" style="border-color:var(--bd);">' + dot +
      '<div class="min-w-0 flex-1"><div class="text-[13.5px] font-semibold" style="color:' + (x.done ? 'var(--tx4)' : 'var(--tx)') + ';">' + t('ob_' + x.key) +
        (x.optional ? ' <span class="text-[11px] font-normal" style="color:var(--tx4);">(' + t('obOptional') + ')</span>' : '') + '</div>' +
      (x.done ? '' : '<div class="text-[12px]" style="color:var(--tx4);">' + t('obd_' + x.key) + '</div>') + '</div>' + action + '</div>';
  }).join('');
  const pct = ob.total ? Math.round(100 * ob.doneCount / ob.total) : 0;
  return '<div class="mb-6 rounded-xl border p-4 sm:p-5" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="flex items-start justify-between gap-3"><div class="min-w-0"><div class="text-[15px] font-bold" style="color:var(--tx);">' + t('obTitle') + '</div>' +
    '<div class="mt-0.5 text-[12px]" style="color:var(--tx4);">' + t('obProgress').replace('{n}', ob.doneCount).replace('{m}', ob.total) + '</div></div>' + hideBtn + '</div>' +
    '<div class="mt-3 h-1.5 overflow-hidden rounded-full" style="background:var(--sunken);"><div class="h-full rounded-full" style="width:' + pct + '%; background:var(--ok);"></div></div>' +
    '<div class="mt-2">' + rows + '</div></div>';
}

// the server's reference text is English ("Admin credit", "Refund: RFQ cancelled (RFQ …)"): known kinds are
// labelled from the type, and only a custom top-up/adjustment note is shown as written
function walletTxLabel(tx){
  if (tx.type === 'BID_DEBIT') return t('walletTxBidFee');
  if (tx.type === 'REFUND') return t('walletTxRefund');
  if (tx.type === 'TOPUP') return !tx.reference || tx.reference === 'Admin credit' ? t('walletTxTopup') : tx.reference;
  return tx.reference || t('walletTxAdjust');
}

  if (!state.showWalletModal) return '';
  const bal = state.wallet ? Number(state.wallet.balance) : 0;
  const txs = (state.wallet && state.wallet.transactions) || [];

        }).join('') + '</div>') +

// ---------- Order detail ----------

function renderOrderDetail(){
  if (state.orderDetailLoading) return '<div class="py-16 text-center text-[13px]" style="color:var(--tx4);">' + t('cmpLoading') + '</div>';
  const d = state.orderDetail;
  if (!d || !d.order) return emptyState(t('odNotFound'), t('odGoBack'));
  const order = d.order, rfq = d.rfq;
  const lpo = order.lpo || {};
  const delivery = order.delivery || {};
  const invoice = order.invoice || {};
  const isSupplier = state.company && state.company.type === 'SUPPLIER';

  let deliveryAction = '';
  if (isSupplier) {
    const st = delivery.status;
    const busy = state.ordersBusyId === order.id;
    const btns = [];
    if (st === 'PENDING' || st === 'DISPATCHED') btns.push(actionBtn(t('odMarkShipped'), "updateDelivery('" + order.id + "','IN_TRANSIT')", busy));
    if (st === 'DISPATCHED' || st === 'IN_TRANSIT') btns.push(actionBtn(t('odMarkDelivered'), "updateDelivery('" + order.id + "','DELIVERED')", busy));
    if (st === 'FAILED') btns.push(actionBtn(t('odSendAgain'), "updateDelivery('" + order.id + "','IN_TRANSIT')", busy));
    if (st === 'DISPATCHED' || st === 'IN_TRANSIT') {
      btns.push('<button onclick="' + (busy ? '' : "openDeliveryFailModal('" + order.id + "')") + '" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bad); color:var(--bad);">' + t('odDeliveryFailed') + '</button>');
    }
    deliveryAction = btns.join('');
  }
  const totals = invoiceTotals(invoice);
  const awaitingReceipt = ['SHIPPED', 'DELIVERED'].includes(order.status) && !order.receivedAt;
  let payAction = '';
  if (!isSupplier && can('payment.record') && invoice.id && ['ISSUED', 'PARTIALLY_PAID', 'OVERDUE'].includes(invoice.status) && order.status !== 'CANCELLED') {
    payAction = !order.receivedAt
      ? '<span class="rounded-lg px-3 py-1.5 text-[12px] font-semibold" style="background:var(--line); color:var(--tx2);">' + t('odPayableAfter') + '</span>'
      : totals.outstanding > 0
      ? actionBtn(tpl('odPay', { amount: fmt(totals.outstanding) }), 'openPayModal(\'' + invoice.id + '\',' + totals.outstanding + ')', false)
      : '<span class="rounded-lg px-3 py-1.5 text-[12px] font-semibold" style="background:var(--line); color:var(--tx2);">' + t('odAwaitingSupplierConfirm') + '</span>';
  }

  // once shipped, the buyer confirms receipt (or reports a problem, which opens a dispute)
  const receiptAction = !isSupplier && awaitingReceipt
    ? actionBtn(t('odConfirmReceipt'), "openReceiptModal('" + order.id + "')", false)
    : isSupplier && awaitingReceipt
      ? '<span class="rounded-lg px-3 py-1.5 text-[12px] font-semibold" style="background:var(--line); color:var(--tx2);">' + t('odAwaitingBuyerReceipt') + '</span>'
      : '';
  // the buyer can dispute an order that is still open and not yet received; an admin then resumes or cancels it
  const disputeAction = !isSupplier && !order.receivedAt && ['CONFIRMED', 'IN_PROGRESS', 'SHIPPED', 'DELIVERED'].includes(order.status)
    ? '<button onclick="openDisputeModal(\'' + order.id + '\')" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bad); color:var(--bad);">' + t('odOpenDispute') + '</button>'
    : '';
  const disputeNote = order.status === 'DISPUTED'
    ? '<div class="mb-4 rounded-xl border px-4 py-3 text-[13px]" style="border-color:var(--warn); background:var(--warn-soft); color:var(--warn);">' + t('odDisputedNote') + '</div>'
    : '';

  return '<button onclick="closeOrderDetail()" class="mb-4 text-[12px] font-semibold" style="color:var(--tx4);">' + t('odBack') + '</button>' +
  '<div class="eyebrow mb-1.5">' + tpl('odEyebrow', { status: esc(orderStatusLabel(order.status)) }) + '</div>' +
  '<h1 class="mb-4 text-[22px] font-extrabold" style="color:var(--tx);">' + esc(rfq ? rfq.title : t('lpoOrderFallback')) + '</h1>' + disputeNote +
  '<div class="rounded-xl border p-4 mb-6" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="flex flex-wrap items-end justify-between gap-3">' +
      '<div class="flex-1 min-w-[220px]">' + orderProgressHtml(order, 'mt-2 text-[12.5px] font-semibold') + '</div>' +
      '<div class="flex flex-wrap gap-2">' + deliveryAction + receiptAction + payAction + disputeAction + '</div>' +
    '</div>' +
  '</div>' +
  '<div class="grid gap-4 sm:grid-cols-2">' +
    detailCard(t('cardRequest'), [
      [t('rowQuantity'), rfq ? (rfq.quantity || '—') + ' ' + unitLabel(rfq.unit || '') : '—'],
      [t('rowNeededBy'), rfq && rfq.deadline ? fmtDate(rfq.deadline) : '—'],
      [t('rowDescription'), rfq ? rfq.description : '—']
    ]) +
    detailCard(t('cardPo'), [
      [t('rowLpo'), 'LPO-' + String(lpo.id || '').slice(-4).toUpperCase()],
      [t(isSupplier ? 'rowBuyer' : 'rowSupplier'), (isSupplier ? lpo.buyerCompany : lpo.supplierCompany)?.name || '—'],
      [t('rowAmount'), fmt(lpo.totalAmount)],
      [t('rowTerms'), lpo.terms === 'Standard terms' ? t('standardTerms') : (lpo.terms || '—')],
      [t('rowPaymentTerms'), tpl('rowPaymentTermsVal', { n: lpo.paymentTermsDays != null ? lpo.paymentTermsDays : 30 })],
      // the LPO document stays ACCEPTED once taken; how the deal went is the order's status
      [t('rowStatus'), lpo.status ? tpl('rowStatusWithLpo', { status: orderStatusLabel(order.status), lpo: enumLabel(LPO_STATUS_KEYS, lpo.status) }) : orderStatusLabel(order.status)]
    ]) +
    detailCard(t('cardDelivery'), [
      [t('rowStatus'), enumLabel(DELIVERY_STATUS_KEYS, delivery.status)],
      [t('rowTracking'), delivery.trackingInfo || '—'],
      [t('rowDispatched'), delivery.dispatchedAt ? fmtDateTime(delivery.dispatchedAt) : '—'],
      [t('rowDelivered'), delivery.deliveredAt ? fmtDateTime(delivery.deliveredAt) : '—'],
      [t('rowReceiptConfirmed'), order.receivedAt ? fmtDateTime(order.receivedAt) : '—']
    ]) +
    detailCard(t('cardInvoice'), [
      [t('rowAmount'), invoice.amount ? fmt(invoice.amount) : '—'],
      [t('rowStatus'), enumLabel(INVOICE_STATUS_KEYS, invoice.status) + (invoice.status === 'OVERDUE' ? ' · ' + overdueDaysLabel(invoice.dueDate) : '')],
      [t('rowDueDate'), invoice.dueDate ? fmtDate(invoice.dueDate) : '—'],
      [t('rowConfirmed'), fmt(totals.paid)],
      [t('rowAwaitingConfirmation'), fmt(totals.pending)],
      [t('rowOutstanding'), fmt(totals.outstanding)]
    ]) +
  '</div>' +
  renderPaymentsPanel(invoice, isSupplier) +
  renderReviewPanel(order, isSupplier) +
  renderDocumentsPanel({ order, isSupplier, canUpload: true }) +
  renderChatPanel();
}

function renderPaymentsPanel(invoice, isSupplier){
  const list = (invoice.payments || []).slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  if (!invoice.id) return '';
  const label = { PENDING: [t('payPending'),'background:var(--warn-soft); color:var(--warn);'], COMPLETED: [t('payCompleted'),'background:var(--ok-soft); color:var(--ok);'], FAILED: [t('payFailed'),'background:var(--bad-soft); color:var(--bad);'], REFUNDED: [t('payRefunded'),'background:var(--line); color:var(--tx2);'] };
  return '<div class="mt-6 rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="mb-3 text-[13px] font-bold" style="color:var(--tx);">' + t('payTitle') + '</div>' +
    (list.length === 0 ? '<div class="text-[12px]" style="color:var(--tx4);">' + t('payNone') + '</div>' :
      '<div class="flex flex-col gap-2">' + list.map(p => {
        const [txt, style] = label[p.status] || [p.status, ''];
        const actions = isSupplier && p.status === 'PENDING'
          ? '<div class="flex gap-2 shrink-0">' +
              '<button onclick="' + (state.ordersBusyId === p.id ? '' : "decidePayment('" + p.id + "','reject')") + '" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bd2); color:var(--bad);">' + t('payReject') + '</button>' +
              actionBtn(t('payConfirmReceived'), "decidePayment('" + p.id + "','confirm')", state.ordersBusyId === p.id) +
            '</div>'
          : '';
        return '<div class="flex flex-wrap items-center justify-between gap-3 rounded-lg border px-3 py-2.5 text-[12.5px]" style="border-color:var(--bd);">' +
          '<div class="min-w-0">' +
            '<div class="font-semibold mono" style="color:var(--tx);">' + fmt(p.amount) + ' <span class="font-normal" style="color:var(--tx3);">&middot; ' + esc(paymentMethodLabel(p.method)) + (p.reference ? ' &middot; ' + tpl('payRef', { ref: esc(p.reference) }) : '') + '</span></div>' +
            '<div class="text-[11px] mt-0.5" style="color:var(--tx4);">' + tpl('payReported', { date: fmtDateTime(p.createdAt) }) + (p.status === 'FAILED' && p.rejectReason ? ' &middot; ' + esc(p.rejectReason) : '') + '</div>' +
          '</div>' +
          '<div class="flex items-center gap-2"><span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="' + style + '">' + txt + '</span>' + actions + '</div>' +
        '</div>';
      }).join('') + '</div>') +
  '</div>';
}

function renderChatPanel(){
  const msgs = state.chatMessages || [];
  const myCompanyId = state.company ? state.company.id : null;
  return '<div class="mt-6 rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="mb-3 text-[13px] font-bold" style="color:var(--tx);">' + t('chatTitle') + '</div>' +
    '<div class="mb-3 flex max-h-[280px] flex-col gap-2 overflow-y-auto bx-scroll pr-1">' +
    (msgs.length === 0 ? '<div class="py-6 text-center text-[12px]" style="color:var(--tx4);">' + t('chatEmpty') + '</div>' :
      msgs.map(m => chatMessageHtml(m, myCompanyId)).join('')) +
    '</div>' +
    '<div class="flex gap-2">' +
      '<input data-chat="draft" type="text" value="' + esc(state.chatDraft) + '" placeholder="' + esc(t('chatPlaceholder')) + '" class="flex-1 rounded-lg border px-3 py-2 text-sm outline-none" style="border-color:var(--bd); background:var(--inset); color:var(--tx);" />' +
      '<button onclick="sendChatMessage()" ' + (state.chatBusy?'disabled':'') + ' class="rounded-lg px-4 py-2 text-[12px] font-bold text-white" style="background:var(--acc); opacity:' + (state.chatBusy?'0.6':'1') + ';">' + t('chatSend') + '</button>' +
    '</div>' +
  '</div>';
}

// A message without a sender company is a Biddex admin comment (e.g. a dispute decision): shown centred
function chatMessageHtml(m, myCompanyId){
  if (!m.senderCompanyId) {
    return '<div class="flex justify-center">' +
      '<div class="max-w-[90%] rounded-xl border px-3 py-2 text-[13px]" style="border-color:var(--warn); background:var(--warn-soft); color:var(--warn);">' +
        '<div class="mb-0.5 text-[10px] font-bold">' + t('chatAdmin') + '</div>' + esc(m.body) +
      '</div></div>';
  }
  const mine = !!myCompanyId && m.senderCompanyId === myCompanyId;
  return '<div class="flex ' + (mine ? 'justify-end' : 'justify-start') + '">' +
    '<div class="max-w-[75%] rounded-xl px-3 py-2 text-[13px]" style="' + (mine ? 'background:var(--acc); color:white;' : 'background:var(--inset); color:var(--tx2);') + '">' +
      (!mine ? '<div class="mb-0.5 text-[10px] font-semibold opacity-70">' + companyLabel(m.senderCompany) + '</div>' : '') +
      esc(m.body) +
    '</div></div>';
}

function detailCard(title, rows){
  return '<div class="rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="mb-3 text-[13px] font-bold" style="color:var(--tx);">' + title + '</div>' +
    '<div class="flex flex-col gap-2">' + rows.map(([k,v]) => '<div class="flex items-center justify-between gap-3 text-[12px]"><span style="color:var(--tx4);">' + k + '</span><span class="mono text-right" style="color:var(--tx2); max-width:65%;">' + esc(v) + '</span></div>').join('') + '</div>' +
  '</div>';
}

// ---------- Notifications, verification ----------

function openNotifRfq(rfqId, notifId){
  setState({ showNotifDropdown: false });
  api('/api/notifications/' + encodeURIComponent(notifId) + '/read', { method: 'PATCH' }).then(() => refreshNotifications()).catch(() => {});
  openRfqLink(rfqId);
}

function notifBell(){
  const list = state.notifications || [];
  return '<div class="relative" data-dropdown="notif">' +
    '<button onclick="toggleNotifDropdown()" class="relative rounded-lg border px-2.5 py-1.5 text-[13px]" style="border-color:var(--bd2); color:var(--tx2);">🔔' +
      (state.notifUnread > 0 ? '<span class="absolute -right-1.5 -top-1.5 grid h-4 min-w-[16px] place-items-center rounded-full px-1 text-[10px] font-bold text-white" style="background:var(--acc);">' + state.notifUnread + '</span>' : '') +
    '</button>' +
    (state.showNotifDropdown ?
      // mobile (<640px): fixed, full width under the sticky header, own scroll, own left/right margins;
      // sm and up: the original small panel anchored under the bell
      '<div class="fixed left-3 right-3 top-16 sm:absolute sm:left-auto sm:right-0 sm:top-11 z-40 w-auto sm:w-80 max-h-[70vh] sm:max-h-96 overflow-y-auto rounded-xl border shadow-xl bx-scroll" style="border-color:var(--bd); background:var(--panel);">' +
        '<div class="flex items-center justify-between border-b px-3.5 py-2.5" style="border-color:var(--bd);"><span class="text-[13px] font-bold" style="color:var(--tx);">' + t('notifTitle') + '</span>' +
        (state.notifUnread > 0 ? '<button onclick="markAllNotifRead()" class="text-[11px] font-semibold" style="color:var(--acc);">' + t('notifMarkAll') + '</button>' : '') +
        '</div>' +
        (list.length === 0 ? '<div class="px-3.5 py-8 text-center text-[12px]" style="color:var(--tx4);">' + t('notifEmpty') + '</div>' :
          list.map(n => '<div class="border-b px-3.5 py-2.5 text-[12px]" style="border-color:var(--bd); ' + (n.read?'':'background:var(--acc-soft2);') + (n.relatedRfqId ? ' cursor:pointer;" onclick="openNotifRfq(\'' + esc(n.relatedRfqId) + '\',\'' + esc(n.id) + '\')' : (n.relatedOrderId && /^(RATE_SUPPLIER|REVIEW_)/.test(n.type) ? ' cursor:pointer;" onclick="openNotifOrder(\'' + esc(n.relatedOrderId) + '\',\'' + esc(n.id) + '\')' : '')) + '">' +
            '<div class="font-semibold" style="color:var(--tx);">' + esc(n.title) + '</div>' +
            (n.body ? '<div class="mt-0.5" style="color:var(--tx3);">' + esc(n.body) + '</div>' : '') +
            (n.type === 'STOCK_RECEIPT_UNMATCHED' && n.relatedOrderId ? '<button onclick="createStockFromNotification(\'' + n.relatedOrderId + '\')" class="mt-1.5 rounded-lg px-2.5 py-1 text-[11px] font-bold text-white" style="background:var(--acc);">' + t('addToStock') + '</button>' : '') +
            (n.relatedRfqId ? '<div class="mt-1 text-[11px] font-semibold" style="color:var(--acc);">' + t('notifOpenRfq') + '</div>' : (n.relatedOrderId && /^(RATE_SUPPLIER|REVIEW_)/.test(n.type) ? '<div class="mt-1 text-[11px] font-semibold" style="color:var(--acc);">' + t('notifOpenOrder') + '</div>' : '')) +
            '<div class="mono mt-1 text-[10px]" style="color:var(--tx4);">' + fmtDateTime(n.createdAt) + '</div>' +
          '</div>').join('')) +
      '</div>' : '') +
  '</div>';
}

// Mobile-only "more" menu (<640px): collects header controls that don't fit next to the bell
// (company name, wallet, language, theme, sign out) instead of letting the header overflow the
// screen. Hidden entirely at sm: and up, where those controls render inline as before.
function toggleHeaderMenu(){ setState({ showHeaderMenu: !state.showHeaderMenu }); }
function menuItemBtn(onclick, label){
  return '<button onclick="' + onclick + '; setState({showHeaderMenu:false})" class="w-full rounded-lg px-3 py-2.5 text-left text-[13px] font-semibold" style="color:var(--tx2);">' + label + '</button>';
}
function headerMenu(itemsHtml){
  return '<div class="relative sm:hidden" data-dropdown="headerMenu">' +
    '<button onclick="toggleHeaderMenu()" class="rounded-lg border px-2.5 py-1.5 text-[15px] font-bold leading-none" style="border-color:var(--bd2); color:var(--tx2);" aria-label="' + t('moreLabel') + '">⋯</button>' +
    (state.showHeaderMenu ?
      '<div class="absolute right-0 top-11 z-40 w-56 rounded-xl border p-1.5 shadow-xl flex flex-col" style="border-color:var(--bd); background:var(--panel);">' + itemsHtml + '</div>'
      : '') +
  '</div>';
}

function verificationBadge(){
  const st = state.company ? state.company.verificationStatus : null;
  if (!st) return '';
  const styles = {
    PENDING: 'background:var(--warn-soft); color:var(--warn);',
    IN_REVIEW: 'background:var(--info-soft); color:var(--info);',
    VERIFIED: 'background:var(--ok-soft); color:var(--ok);',
    REJECTED: 'background:var(--bad-soft); color:var(--bad);'
  };
  const labels = { PENDING:t('verNotVerified'), IN_REVIEW:t('verInReview'), VERIFIED:t('verVerified'), REJECTED:t('verRejected') };
  return '<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="' + (styles[st]||'') + '">' + (labels[st]||st) + '</span>';
}

function verificationBanner(){
  const st = state.company ? state.company.verificationStatus : null;
  if (!st || st === 'VERIFIED' || st === 'IN_REVIEW') return '';
  return '<div class="mb-6 flex items-center justify-between gap-3 rounded-xl border p-4" style="border-color:var(--bd); background:var(--acc-soft2);">' +
    '<div class="text-[13px] font-semibold" style="color:var(--tx);">' + t(st === 'REJECTED' ? 'verifyBannerRejected' : 'verifyBannerGet') + hint('verification') + '</div>' +
    (can('company.edit') ? '<button onclick="openVerifyModal()" class="rounded-lg px-3.5 py-2 text-[12px] font-bold text-white shrink-0" style="background:var(--acc);">' + t('verifySubmitDoc') + '</button>' : '') +
  '</div>';
}

// ---------- Admin ----------

function renderAdmin(){
  const header = '<header class="bx-noprint sticky top-0 z-30 border-b backdrop-blur-xl" style="border-color:var(--bd); background:color-mix(in srgb, var(--bg) 90%, transparent);">' +
    '<div class="mx-auto flex max-w-[1220px] items-center justify-between gap-2 sm:gap-4 px-4 sm:px-5 py-3 sm:py-3.5">' + logo('ADMIN CONSOLE') +
    '<div class="relative flex items-center gap-1.5 sm:gap-3">' +
      '<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="background:var(--line); color:var(--tx2);">Admin</span>' +
      '<span class="hidden sm:contents">' + langToggleBtn() + themeToggleBtn() +
        '<button onclick="logout()" class="rounded-lg px-3 py-1.5 text-[12px] font-semibold border" style="border-color:var(--bd2); color:var(--tx3);">' + t('signOut') + '</button>' +
      '</span>' +
      headerMenu(
        menuItemBtn('toggleLang()', state.lang === 'ar' ? 'EN' : 'العربية') +
        menuItemBtn('toggleTheme()', t(isDarkNow() ? 'themeLight' : 'themeDark')) +
        menuItemBtn('logout()', t('signOut'))
      ) +
    '</div></div></header>';

  const filters = ['ALL','PENDING','IN_REVIEW','VERIFIED','REJECTED','DELETED'];
  const onDeletedTab = state.adminFilter === 'DELETED';
  const list = (state.adminCompanies || []).filter(c => onDeletedTab ? !!c.deleted : (!c.deleted && (state.adminFilter === 'ALL' || c.verificationStatus === state.adminFilter)));

  const disputes = state.adminDisputes || [];
  const tabs = '<div class="flex flex-wrap gap-2 mb-6">' +
    '<button onclick="setAdminTab(\'companies\')" class="chip' + (state.adminTab === 'companies' ? ' active' : '') + '">Companies</button>' +
    '<button onclick="setAdminTab(\'disputes\')" class="chip' + (state.adminTab === 'disputes' ? ' active' : '') + '">Disputes' + (disputes.length ? ' (' + disputes.length + ')' : '') + '</button>' +
    '<button onclick="setAdminTab(\'rfqs\')" class="chip' + (state.adminTab === 'rfqs' ? ' active' : '') + '">All RFQs</button>' +
    '<button onclick="setAdminTab(\'orders\')" class="chip' + (state.adminTab === 'orders' ? ' active' : '') + '">All orders</button>' +
    '<button onclick="setAdminTab(\'reviews\')" class="chip' + (state.adminTab === 'reviews' ? ' active' : '') + '">Reviews</button>' +
    '<button onclick="setAdminTab(\'audit\')" class="chip' + (state.adminTab === 'audit' ? ' active' : '') + '">Audit log</button>' +
    '<button onclick="setAdminTab(\'analytics\')" class="chip' + (state.adminTab === 'analytics' ? ' active' : '') + '">Analytics</button>' +
  '</div>';

  const body =
    state.adminTab === 'disputes' ? renderAdminDisputes() :
    state.adminTab === 'rfqs' ? renderAdminRfqs() :
    state.adminTab === 'orders' ? renderAdminOrdersAll() :
    state.adminTab === 'reviews' ? renderAdminReviews() :
    state.adminTab === 'audit' ? renderAdminAudit() :
    state.adminTab === 'analytics' ? renderAdminAnalyticsPage() :
    '<div class="eyebrow mb-1.5">VERIFICATION QUEUE</div>' +
  '<div class="flex items-center justify-between mb-5">' +
    '<h1 class="text-[22px] font-extrabold" style="color:var(--tx);">Company verification</h1>' +
    (onDeletedTab ? '' : actionBtn('+ Add credits', 'openCreditModal()', false)) +
  '</div>' +
  '<div class="flex flex-wrap gap-2 mb-5">' + filters.map(f =>
    '<button onclick="setAdminFilter(\'' + f + '\')" class="chip' + (state.adminFilter===f?' active':'') + '">' + f + '</button>'
  ).join('') + '</div>' +
  (list.length === 0 ? emptyState('No companies here', 'Nothing matches this filter yet.') :
    '<div class="flex flex-col gap-3">' + list.map(c => c.deleted ? deletedCompanyCardHtml(c) :
      '<div data-company="' + esc(c.id) + '" class="flex flex-wrap items-center justify-between gap-3 rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
        '<div class="flex min-w-[220px] flex-1 items-center gap-3">' + avatarHtml(c.name, 36) +
        '<div><div class="font-semibold" style="color:var(--tx);">' + esc(c.name) +
          (c.isActive === false ? ' <span class="ml-1 rounded-full px-2 py-0.5 text-[10.5px] font-semibold" style="background:var(--bad-soft); color:var(--bad);">Deactivated</span>' :
           c.suspendedAt ? ' <span class="ml-1 rounded-full px-2 py-0.5 text-[10.5px] font-semibold" style="background:var(--bad-soft); color:var(--bad);" title="' + esc(c.suspensionReason || '') + '">Suspended</span>' : '') + '</div>' +
        '<div class="mono mt-0.5 text-[12px]" style="color:var(--tx3);">' + esc(c.type) + ' &middot; CR: ' + esc(c.registrationNumber || '—') + ' &middot; ' + (c.documents ? c.documents.length : 0) + ' document(s) &middot; ' + esc(c.user ? c.user.email : '') +
          (c.type === 'SUPPLIER' && c.wallet ? ' &middot; ' + Number(c.wallet.balance).toFixed(3) + ' credits' : '') + '</div>' +
          lastSuspensionReasonHtml(c) + '</div></div>' +
        '<div class="flex flex-wrap items-center justify-end gap-2">' +
          '<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="' + ({PENDING:'background:var(--warn-soft); color:var(--warn);', IN_REVIEW:'background:var(--info-soft); color:var(--info);', VERIFIED:'background:var(--ok-soft); color:var(--ok);', REJECTED:'background:var(--bad-soft); color:var(--bad);'}[c.verificationStatus]||'') + '">' + c.verificationStatus + '</span>' +
          (c.verificationStatus !== 'VERIFIED' ? actionBtn('Verify', "setCompanyVerification('" + c.id + "','VERIFIED')", state.adminBusyId===c.id) : '') +
          (c.verificationStatus !== 'REJECTED' ? '<button onclick="setCompanyVerification(\'' + c.id + '\',\'REJECTED\')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold border" style="border-color:var(--bd2); color:var(--tx3);">Reject</button>' : '') +
          ((c.documents || []).length ? '<button onclick="openDocsModal(\'' + c.id + '\')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold border" style="border-color:var(--bd2); color:var(--tx);">Documents (' + c.documents.length + ')</button>' : '') +
          (c.type === 'SUPPLIER' ? '<button onclick="openCreditModal(\'' + c.id + '\')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold border" style="border-color:var(--bd2); color:var(--tx3);">Add credits</button>' : '') +
          '<button onclick="openResetModal(\'' + c.id + '\')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold border" style="border-color:var(--bd2); color:var(--tx3);">Reset password</button>' +
          (c.suspendedAt
            ? actionBtn('Reactivate', "reactivateCompany('" + c.id + "')", state.reactivateBusyId === c.id)
            : '<button onclick="openDeactivateModal(\'' + c.id + '\',' + jsAttr(c.name) + ')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold border" style="border-color:var(--bad); color:var(--bad);">Deactivate</button>') +
          '<button onclick="openDeleteModal(\'' + c.id + '\',' + jsAttr(c.name) + ')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold border" style="border-color:var(--bad); color:var(--bad);">Delete</button>' +
        '</div>' +
      '</div>').join('') + '</div>');

  return '<div>' + header + '<div class="mx-auto max-w-[1220px] px-5 py-8">' + syncBanner() + tabs + body + '</div></div>' + renderResetModal() + renderDeleteModal() + renderDeactivateModal() + renderCreditModal() + renderDocsModal() + renderAdminDisputeModal() + renderAdminOrderModal() + renderBidLinkModal() + toastHtml();
}

// A deleted company is shown for reference only: no actions (the server refuses them too). Credits left on it
// (an admin deletion keeps the wallet) are shown so they are not lost sight of; they cannot be used.
function deletedCompanyCardHtml(c){
  const credits = c.wallet ? Number(c.wallet.balance) : 0;
  return '<div data-company="' + esc(c.id) + '" class="rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel); opacity:.8;">' +
    '<div class="flex flex-wrap items-center gap-3">' + avatarHtml(c.name, 36) +
    '<div class="min-w-[220px] flex-1"><div class="font-semibold" style="color:var(--tx);">' + esc(c.name) + ' <span class="ml-1 rounded-full px-2 py-0.5 text-[10.5px] font-semibold" style="background:var(--line); color:var(--tx2);">Deleted</span></div>' +
    '<div class="mono mt-0.5 text-[12px]" style="color:var(--tx3);">' + esc(c.type) + ' &middot; ' + esc(c.user ? c.user.email : '—') + (c.deletedAt ? ' &middot; deleted ' + esc(fmtDateTime(c.deletedAt)) : '') +
      (c.registrationNumber ? ' &middot; CR: ' + esc(c.registrationNumber) : '') + (credits > 0 ? ' &middot; ' + credits.toFixed(3) + ' credits left (cannot be used)' : '') + '</div></div></div></div>';
}

function renderAdminDisputes(){
  const list = state.adminDisputes || [];
  return '<div class="eyebrow mb-1.5">ORDER DISPUTES</div>' +
  '<h1 class="mb-5 text-[22px] font-extrabold" style="color:var(--tx);">Disputes</h1>' +
  (list.length === 0 ? emptyState('No open disputes', 'Orders disputed by buyers appear here for review.') :
    '<div class="flex flex-col gap-3">' + list.map(o => {
      const lpo = o.lpo || {};
      return '<div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
        '<div class="min-w-[240px] flex-1">' +

// Small "Page X of Y (N total)" + Prev/Next control, shared by the admin list tabs.
function pagerHtml(page, pageSize, total, onPageFn){
  const pages = Math.max(1, Math.ceil(total / pageSize));
  return '<div class="mt-4 flex items-center justify-between gap-3 text-[12px]" style="color:var(--tx3);">' +
    '<span>' + total + ' total &middot; page ' + page + ' of ' + pages + '</span>' +
    '<div class="flex gap-2">' +
      '<button ' + (page<=1?'disabled':'') + ' onclick="' + onPageFn + '(' + (page-1) + ')" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bd2); color:var(--tx3); opacity:' + (page<=1?'0.5':'1') + ';">Prev</button>' +
      '<button ' + (page>=pages?'disabled':'') + ' onclick="' + onPageFn + '(' + (page+1) + ')" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bd2); color:var(--tx3); opacity:' + (page>=pages?'0.5':'1') + ';">Next</button>' +
    '</div></div>';
}

// Admin opening an order from the "All orders" list: a read-only card (the server lets ADMIN read any
// order and its chat, but not post to it — only resolving a dispute writes to the chat as admin).
async function openAdminOrder(orderId){
  setState({ adminOrderId: orderId, adminOrderDetail: null, adminOrderChat: [], orderDocs: [] });
  try {
    const [order, chat] = await Promise.all([
      api('/api/orders/' + orderId),
      api('/api/orders/' + orderId + '/messages'),
    ]);
    if (state.adminOrderId === orderId) setState({ adminOrderDetail: order, adminOrderChat: chat });
    refreshOrderDocs(orderId);
  } catch(e) { showToast(e.message); setState({ adminOrderId: null }); }
}
function closeAdminOrder(){ setState({ adminOrderId: null, adminOrderDetail: null, adminOrderChat: [], orderDocs: [] }); }

// ---------- Modals (post RFQ, compare, submit quote, catalog add, verify doc) ----------

function renderModals(){
  let html = '';
  if (state.showPostRfq) {
    const r = state.newRfq;
    const editing = !!state.editRfqId;
    const label = (txt) => '<span class="text-[11px] font-semibold uppercase tracking-[0.08em]" style="color:var(--tx4);">' + txt + '</span>';
    const boxStyle = 'border-color:var(--bd); background:var(--inset); color:var(--tx);';
    const tomorrow = addDaysBahrain(1), inWeek = addDaysBahrain(7);
    const customDate = !!state.rfqDatePick || !!(r.deadline && r.deadline !== tomorrow && r.deadline !== inWeek);
    const chip = (text, on, click) => '<button type="button" onclick="' + click + '" class="min-w-0 flex-1 rounded-lg border px-2 py-2.5 text-[12.5px] font-bold" style="' +
      (on ? 'background:var(--acc); color:#fff; border-color:var(--acc);' : 'border-color:var(--bd2); color:var(--tx2);') + '">' + text + '</button>';
    const more = rfqMoreOpen();
    const units = CATALOG_UNITS.concat(r.unit && !CATALOG_UNITS.includes(r.unit) ? [r.unit] : []);
    const feeOn = bidFeePercent() > 0;
    html += modalWrap(t(editing ? 'rfqModalEdit' : 'rfqModalPost') + hint('rfq'), 'closePostRfq()',
      // 1. what
      '<div class="flex flex-col gap-1.5"><label class="flex flex-col gap-1.5">' + label(t('rfqWhatNeed')) +
        '<input data-field="title" type="text" autocomplete="off" value="' + esc(r.title) + '" placeholder="' + t('rfqWhatNeedPh') + '" class="w-full rounded-lg border px-3 py-2.5 text-sm outline-none" style="' + boxStyle + '" /></label>' +
        '<div id="rfq-product-area" class="flex flex-col gap-1.5">' + renderRfqProductArea() + '</div></div>' +
      // 2. quantity + unit
      '<div class="grid grid-cols-2 gap-3">' +
        '<label class="flex min-w-0 flex-col gap-1.5">' + label(t('rfqQuantity')) +
          '<input data-field="quantity" type="text" inputmode="numeric" value="' + esc(r.quantity) + '" placeholder="' + t('rfqQuantityPh') + '" class="w-full rounded-lg border px-3 py-2.5 text-sm outline-none" style="' + boxStyle + '" /></label>' +
        '<label class="flex min-w-0 flex-col gap-1.5">' + label(t('rfqUnit')) +
          '<select data-select="unit" class="w-full rounded-lg border px-3 py-2.5 text-sm outline-none" style="' + boxStyle + '">' +
            units.map(u => '<option value="' + esc(u) + '"' + (r.unit === u ? ' selected' : '') + '>' + esc(unitLabel(u)) + '</option>').join('') +
          '</select></label>' +
      '</div>' +
      // 3. when
      '<div class="flex flex-col gap-1.5">' + label(t('rfqWhen')) +
        '<div class="flex gap-2">' +
          chip(t('rfqTomorrow'), !customDate && r.deadline === tomorrow, "setRfqDeadline('tomorrow')") +
          chip(t('rfqWithinWeek'), !customDate && r.deadline === inWeek, "setRfqDeadline('week')") +
          chip(t('rfqPickDate'), customDate, "setRfqDeadline('custom')") +
        '</div>' +
        (customDate ? '<input data-field="deadline" type="date" min="' + addDaysBahrain(0) + '" value="' + esc(r.deadline) + '" class="w-full rounded-lg border px-3 py-2.5 text-sm outline-none" style="' + boxStyle + '" />' : '') +
      '</div>' +
      // more details (collapsed unless something in it is filled in)
      '<div class="flex flex-col gap-4">' +
        '<button type="button" onclick="toggleRfqMore()" aria-expanded="' + more + '" class="flex w-full items-center justify-between gap-3 rounded-lg border px-3 py-2.5 text-start" style="border-color:var(--bd2); color:var(--tx2);">' +
          '<span class="min-w-0"><span class="block text-[13px] font-bold">' + t(more ? 'rfqLessDetails' : 'rfqMoreDetails') + '</span>' +
          (more ? '' : '<span class="block truncate text-[11px] font-normal" style="color:var(--tx4);">' + t('rfqMoreHint') + '</span>') + '</span>' +
          '<span class="shrink-0 text-[12px]" aria-hidden="true">' + (more ? '▲' : '▼') + '</span></button>' +
        (more ?
          field('brand', t('rfqBrand'), r.brand, t('rfqBrandPh')) +
          '<div id="brand-toggle-container" class="flex gap-2" style="display:' + ((r.brand || '').trim() ? 'flex' : 'none') + ';">' +
            '<button type="button" onclick="setExactBrandOnly(false)" class="flex-1 rounded-lg border px-3 py-2 text-[12px] font-bold" style="' + (!r.exactBrandOnly ? 'background:var(--acc); color:#fff; border-color:var(--acc);' : 'border-color:var(--bd2); color:var(--tx2);') + '">' + t('rfqEquivalent') + '</button>' +

const EYE_ON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';

function decoratePasswordFields(){
  document.querySelectorAll('input[type=password]').forEach(inp => {
    if (inp.parentElement && inp.parentElement.classList.contains('bx-pw')) return;
    const wrap = document.createElement('span');
    wrap.className = 'bx-pw';
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'bx-pw-eye';
    const paint = () => { const shown = inp.type === 'text'; btn.innerHTML = shown ? EYE_OFF : EYE_ON; btn.setAttribute('aria-label', t(shown ? 'hidePassword' : 'showPassword')); };
    btn.addEventListener('click', () => { inp.type = inp.type === 'password' ? 'text' : 'password'; paint(); inp.focus(); });
    paint();
    wrap.appendChild(btn);
  });
}

// Same whitelist as the API: PDF and raster images only (no SVG, which can carry script)
const DOC_DATA_URL_RE = /^data:(application\/pdf|image\/(?:png|jpeg|webp|gif));base64,([A-Za-z0-9+/]+={0,2})$/;
// what the document viewer shows inline (iframe for PDF, img for images); anything else is refused
const VIEWABLE_DOC_TYPES = ['application/pdf', 'image/png', 'image/jpeg', 'image/webp', 'image/gif'];
const DOC_TYPE_LABELS = { TRADE_LICENSE:'Trade license', CR_CERTIFICATE:'Commercial registration', OTHER:'Other' };

function openDocsModal(companyId){ closeDocViewer(); setState({ showDocsModal: companyId }); }
function closeDocsModal(){ closeDocViewer(); setState({ showDocsModal: null }); }
function closeDocViewer(){
  if (state.docViewer && !state.docViewer.remote) { try { URL.revokeObjectURL(state.docViewer.url); } catch(e) {} }
  state.docViewer = null;
}

async function viewDocument(companyId, docId){
  setState({ docBusyId: docId });
  try {
    const doc = await api('/api/admin/companies/' + companyId + '/documents/' + docId);
    if (doc.url) {
      // stored in the bucket: a 120-second link that shows the file inline — only for types a browser
      // never executes (the server checks the content on upload; this is the second line of defence)
      if (!VIEWABLE_DOC_TYPES.includes(doc.contentType)) throw new Error('This file type can’t be shown safely.');
      closeDocViewer();
      setState({ docBusyId: null, docViewer: { id: docId, mime: doc.contentType, url: doc.url, remote: true } });
      return;
    }
    // not yet moved to the bucket: the file comes inline as a data: URL
    if (!doc.fileUrl) throw new Error('This document can’t be opened in this version of the page. Reload the page and try again.');
    const m = DOC_DATA_URL_RE.exec(doc.fileUrl);
    if (!m) throw new Error('This file type can’t be shown safely.');
    // decode to a Blob: blob: URLs render PDFs in the browser viewer, which data: URLs often don't
    const bin = atob(m[2]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    closeDocViewer();
    setState({ docBusyId: null, docViewer: { id: docId, mime: m[1], url: URL.createObjectURL(new Blob([bytes], { type: m[1] })) } });
  } catch(e) { setState({ docBusyId: null }); showToast(e.message); }
}

async function onVerifyFileChange(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast(t('verifyFileTooBig')); e.target.value = ''; return; }
  if (!['application/pdf', 'image/png', 'image/jpeg', 'image/webp', 'image/gif'].includes(file.type)) {
    showToast(t('verifyFileBadType')); e.target.value = ''; return;
  }
  setState({ verifyFileBusy: true });
  const reader = new FileReader();
  reader.onload = () => {
    state.verifyForm.fileUrl = reader.result;
    setState({ verifyFileName: file.name, verifyFileBusy: false });
  };
  reader.onerror = () => { setState({ verifyFileBusy: false }); showToast(t('fileReadFail')); };
  reader.readAsDataURL(file);
}

];
const ROUTE_NAMES = { '': 'main', rfqs: 'rfqs', opportunities: 'rfqs', orders: 'lpos', stock: 'stock', spending: 'spending', suppliers: 'catalog', catalog: 'catalog', settings: 'profile' };
let histDepth = 0, histBusy = false, histPopExpected = false, histDirty = false, histAdopt = false, histTimer = null, pendingRoute = null;

function isDashboardView(){ return state.view === 'buyer' || state.view === 'supplier'; }
function screenDepth(){
  if (state.view === 'auth') return 1;
  if (!isDashboardView()) return 0;
  if (state.section === 'orderDetail') return 2;
  return state.section === 'main' ? 0 : 1;
}
function topOverlay(){ const o = OVERLAYS.find(x => x[1](state)); return o ? o[0] : null; }
function currentDepth(){ return screenDepth() + (topOverlay() ? 1 : 0); }
function sectionHash(sec){
  const supplier = state.view === 'supplier';
  return ({ main: '#/', rfqs: supplier ? '#/opportunities' : '#/rfqs', lpos: '#/orders', stock: '#/stock', spending: '#/spending', catalog: supplier ? '#/catalog' : '#/suppliers', profile: '#/settings' })[sec] || '#/';
}
// URL of the history entry at depth k while the app is showing the current screen
function entryHash(k){
  if (state.view === 'auth') return state.authMode === 'register' ? '#/register?role=' + (state.authRole === 'SUPPLIER' ? 'supplier' : 'buyer') : '#/login';
  if (!isDashboardView()) return '#/';
  // the bids / bid form of one RFQ has its own link
  if (k === currentDepth() && (topOverlay() === 'compare' || topOverlay() === 'submitQuote')) return '#/rfq/' + encodeURIComponent(state.compareRfqId || state.submitQuoteRfqId);
  if (state.section === 'orderDetail') return k >= 2 ? '#/order/' + encodeURIComponent(state.selectedOrderId || '') : '#/orders';
  return sectionHash(state.section);
}
function safeDecode(v){ try { return decodeURIComponent(v); } catch(e) { return v; } }
function parseHash(h){
  const str = String(h || '');
  const m = str.match(/^#\/?([\w-]*)(?:\/([^/?#]+))?/);
  if (!m) return { section: 'main' };
  if (m[1] === 'login') return { section: 'main', auth: 'login' };
  if (m[1] === 'register') return { section: 'main', auth: 'register', role: new URLSearchParams(str.split('?')[1] || '').get('role') === 'supplier' ? 'SUPPLIER' : 'BUYER' };
  if (m[1] === 'rfq' && m[2]) return { section: 'rfqLink', rfqId: safeDecode(m[2]) };
  if (m[1] === 'order' && m[2]) return { section: 'orderDetail', orderId: safeDecode(m[2]) };
  const am = str.match(/^#\/admin\/company\/([^/?#]+)/);
  if (am) return { section: 'adminCompany', companyId: safeDecode(am[1]) }; // from the admin's registration e-mail
  return { section: ROUTE_NAMES[m[1]] || 'main' };
}
function isKnownRoute(h){ if (h === '#') return false; const m = String(h || '').match(/^#\/?([\w-]*)(?:\/[^/?#]+)?(?:\?[^#]*)?$/); return !!m && (['order', 'rfq', 'login', 'register'].includes(m[1]) || Object.prototype.hasOwnProperty.call(ROUTE_NAMES, m[1])); }
function applyRoute(r){
  if (!isDashboardView()) return;
  const supplier = state.view === 'supplier';
  if (r.section === 'rfqLink' && r.rfqId) { openRfqLink(r.rfqId); return; }
  if (r.section === 'orderDetail' && r.orderId) { openOrderDetail(r.orderId, true); return; }
  if ((r.section === 'stock' || r.section === 'spending') && supplier) r = { section: 'main' };
  if (r.section === 'spending' && !can('analytics.view')) r = { section: 'main' };
  setSection(r.section);
}
// A route from the address bar / a link. Sign-in and registration links only mean something signed out (signed in:
// Home). Order and RFQ links from e-mails wait in pendingRoute until sign-in and take the user to the login screen.
function applyDeepRoute(r){
  if (state.view === 'admin') { if (r.section === 'adminCompany') openAdminCompany(r.companyId); return; }
  if (r.section === 'adminCompany') { if (isDashboardView()) setSection('main'); else { pendingRoute = r; openAuth('BUYER', 'login'); } return; } // only an admin can use it
  if (r.auth) { if (!state.token) openAuth(r.role || 'BUYER', r.auth); else if (isDashboardView()) setSection('main'); return; }
  if (isDashboardView()) { applyRoute(r); return; }
  pendingRoute = r;
  if (r.section === 'orderDetail' || r.section === 'rfqLink') openAuth('BUYER', 'login');
}
function applyPendingRoute(){
  if (pendingRoute && state.view === 'admin') { const r = pendingRoute; pendingRoute = null; if (r.section === 'adminCompany') openAdminCompany(r.companyId); return; }
  if (pendingRoute && pendingRoute.section === 'adminCompany') { pendingRoute = null; return; }
  if (pendingRoute && isDashboardView()) { const r = pendingRoute; pendingRoute = null; applyRoute(r); } }

function scheduleHistorySync(){ if (state.view === 'admin') return; clearTimeout(histTimer); histTimer = setTimeout(syncHistory, 0); }
function syncHistory(){
  if (histBusy) { histDirty = true; return; }
  if (histAdopt) { histAdopt = false; histDepth = currentDepth(); history.replaceState({ bx: 1, depth: histDepth }, '', entryHash(histDepth)); return; }
  const want = currentDepth();
  if (want > histDepth) {
    for (let k = histDepth + 1; k <= want; k++) history.pushState({ bx: 1, depth: k }, '', entryHash(k));
    histDepth = want;
  } else if (want < histDepth) {
    const n = histDepth - want;
    histDepth = want; histBusy = true; histPopExpected = true;
    history.go(-n);
    setTimeout(() => { if (histBusy) { histBusy = false; histPopExpected = false; scheduleHistorySync(); } }, 500); // no popstate came (nothing to go back to)
    return;
  }
  const want_h = entryHash(want);
  const cur_h = location.hash || '#/';
  if (cur_h !== want_h) history.replaceState({ bx: 1, depth: want }, '', want_h);
  else if (!history.state || history.state.depth !== want) history.replaceState({ bx: 1, depth: want }, '', want_h);
}
// something typed into the request form that would be lost on close
function rfqFormDirty(){
  const r = state.newRfq || {}, filled = (v) => !!String(v == null ? '' : v).trim();
  if (!state.editRfqId) return filled(r.title) || filled(r.quantity) || filled(r.budget) || filled(r.specifications) || filled(r.brand);
  const src = (state.rfqs || []).find(x => x.id === state.editRfqId);
  if (!src) return false;
  const same = (a, b) => String(a == null ? '' : a).trim() === String(b == null ? '' : b).trim();
  return !(same(r.title, src.title) && same(r.quantity, src.quantity) && same(r.budget, src.budget != null ? Number(src.budget) : '') && same(r.specifications, src.specifications) && same(r.brand, src.brand));
}
window.addEventListener('popstate', (e) => {
  if (state.view === 'admin') return;
  if (histPopExpected) { histPopExpected = false; histBusy = false; histDirty = false; scheduleHistorySync(); return; }
  const st = e.state;
  if (!st || !st.bx) { // an entry we did not create (a typed or pasted address): follow its route
    applyDeepRoute(parseHash(location.hash));
    histAdopt = true; scheduleHistorySync(); return;
  }
  const target = st.depth;
  let cur = currentDepth();
  if (target > cur) { histBusy = true; histPopExpected = true; history.go(-(target - cur)); setTimeout(() => { histBusy = false; histPopExpected = false; scheduleHistorySync(); }, 500); return; } // "forward" onto a layer that cannot be restored
  for (let guard = 0; cur > target && guard < 8; guard++) {
    const ov = topOverlay();
    if (ov) {
      if (ov === 'postRfq' && rfqFormDirty() && !confirm(t('rfqDiscardConfirm'))) { history.pushState({ bx: 1, depth: cur }, '', location.hash || '#/'); return; }
      OVERLAYS.find(x => x[0] === ov)[2]();
    } else if (state.view === 'auth') goLanding();
    else if (state.section === 'orderDetail') closeOrderDetail();
    else setSection('main');
    cur = currentDepth();
  }
  histDepth = currentDepth();
  scheduleHistorySync();
});
// a plain "#" or an unknown in-page anchor must not add history entries or change the screen
document.addEventListener('click', (e) => {
  const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
  if (a && !isKnownRoute(a.getAttribute('href'))) e.preventDefault();
});
function initRouter(){
  const st = history.state;
  const route = parseHash(location.hash);
  const deep = route.section !== 'main' || !!route.auth;
  if (st && st.bx) histDepth = st.depth;
  else { histDepth = 0; if (deep) history.replaceState({ bx: 1, depth: 0 }, '', '#/'); } // a shared link: Home sits below it
  if (deep) applyDeepRoute(route);
  scheduleHistorySync();
}

// ---------- Init ----------
initTheme();
initLang();
loadSession();
render();
initRouter();
refreshConfig(); // public: also covers the login/register screens and admins
if (state.token) { if (state.view === 'admin') refreshAdmin(); else refreshAll(); }

// Tick countdown timers every second WITHOUT re-rendering the whole page (avoids flicker):
// only the text/color of elements carrying a deadline is updated in place.
function tickCountdowns(){
  document.querySelectorAll('[data-deadline]').forEach(el => {
    const tl = timeLeftLabel(el.getAttribute('data-deadline'));
    el.textContent = tl.label;
    el.style.color = tl.urgent ? 'var(--acc)' : (el.getAttribute('data-basecolor') || '');
  });
}
setInterval(tickCountdowns, 1000);

// Keep RFQs / orders / notifications / chat fresh without requiring a relogin.
// A visible tab polls every 30 s; a hidden one only every 5 minutes (it still notices a new notification or an
// ended session, but a pile of background tabs no longer eats the API's per-user request budget). Coming back
// to the tab refreshes at once: a light poll after 30 s away, everything after 5 minutes.
/* poll-plan:start */
const POLL_VISIBLE_MS = 30000, POLL_HIDDEN_MS = 300000, POLL_SLACK_MS = 1000;
function pollDue(now, last, hidden){ return now - last >= (hidden ? POLL_HIDDEN_MS : POLL_VISIBLE_MS) - POLL_SLACK_MS; }
function returnAction(now, last){ const away = now - last; return away >= POLL_HIDDEN_MS ? 'full' : away >= POLL_VISIBLE_MS ? 'poll' : 'none'; }
/* poll-plan:end */
function pollNow(){
  lastPollAt = Date.now();
  if (state.view === 'buyer' || state.view === 'supplier') {
    refreshRfqs();
    refreshOrders();
    refreshLpos();
    refreshNotifications();
    refreshOnboarding();
    if (state.section === 'orderDetail' && state.selectedOrderId) { refreshChat(state.selectedOrderId); refreshOrderDocs(state.selectedOrderId); }
  } else if (state.view === 'admin') {
    refreshAdmin();
  }
}
setInterval(() => {
  if (!state.token) return;
  if (pollDue(Date.now(), lastPollAt, document.hidden)) pollNow();
}, POLL_VISIBLE_MS);

checkForNewVersion();
setInterval(checkForNewVersion, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForNewVersion(); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden || !state.token) return;
  const action = returnAction(Date.now(), lastPollAt);
  if (action === 'none') return;
  if (action === 'full' && (state.view === 'buyer' || state.view === 'supplier')) refreshAll();
  else pollNow();
});

// Tapping/clicking outside an open header dropdown (notifications, the mobile "more" menu) closes it.
// The toggle buttons live inside the same [data-dropdown] wrapper, so opening one isn't undone by this.
document.addEventListener('click', (e) => {
  let changed = false;
  if (state.showNotifDropdown && !e.target.closest('[data-dropdown="notif"]')) { state.showNotifDropdown = false; changed = true; }
  if (state.showHeaderMenu && !e.target.closest('[data-dropdown="headerMenu"]')) { state.showHeaderMenu = false; changed = true; }
  if (changed) render();
});
</script>
</body>
</html>
