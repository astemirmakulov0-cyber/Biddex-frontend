// ---------- Order detail ----------

function renderOrderDetail(){
  if (state.orderDetailLoading) return '<div class="py-16 text-center text-[13px]" style="color:var(--tx4);">' + t('cmpLoading') + '</div>';
  const d = state.orderDetail;
  if (!d || !d.order) return emptyState(t('odNotFound'), t('odGoBack'));
  const order = d.order, rfq = d.rfq;
  const lpo = order.lpo || {};
  const delivery = order.delivery || {};
  const invoice = order.invoice || {};
  const isSupplier = state.company && state.company.type === 'SUPPLIER';

  let deliveryAction = '';
  if (isSupplier) {
    const st = delivery.status;
    const busy = state.ordersBusyId === order.id;
    const btns = [];
    if (st === 'PENDING' || st === 'DISPATCHED') btns.push(actionBtn(t('odMarkShipped'), "updateDelivery('" + order.id + "','IN_TRANSIT')", busy));
    if (st === 'DISPATCHED' || st === 'IN_TRANSIT') btns.push(actionBtn(t('odMarkDelivered'), "updateDelivery('" + order.id + "','DELIVERED')", busy));
    if (st === 'FAILED') btns.push(actionBtn(t('odSendAgain'), "updateDelivery('" + order.id + "','IN_TRANSIT')", busy));
    if (st === 'DISPATCHED' || st === 'IN_TRANSIT') {
      btns.push('<button onclick="' + (busy ? '' : "openDeliveryFailModal('" + order.id + "')") + '" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bad); color:var(--bad);">' + t('odDeliveryFailed') + '</button>');
    }
    deliveryAction = btns.join('');
  }
  const totals = invoiceTotals(invoice);
  const awaitingReceipt = ['SHIPPED', 'DELIVERED'].includes(order.status) && !order.receivedAt;
  let payAction = '';
  if (!isSupplier && invoice.id && ['ISSUED', 'PARTIALLY_PAID', 'OVERDUE'].includes(invoice.status) && order.status !== 'CANCELLED') {
    payAction = !order.receivedAt
      ? '<span class="rounded-lg px-3 py-1.5 text-[12px] font-semibold" style="background:var(--sunken); color:var(--tx3);">' + t('odPayableAfter') + '</span>'
      : totals.outstanding > 0
      ? actionBtn(tpl('odPay', { amount: fmt(totals.outstanding) }), 'openPayModal(\'' + invoice.id + '\',' + totals.outstanding + ')', false)
      : '<span class="rounded-lg px-3 py-1.5 text-[12px] font-semibold" style="background:var(--sunken); color:var(--tx3);">' + t('odAwaitingSupplierConfirm') + '</span>';
  }

  // once shipped, the buyer confirms receipt (or reports a problem, which opens a dispute)
  const receiptAction = !isSupplier && awaitingReceipt
    ? actionBtn(t('odConfirmReceipt'), "openReceiptModal('" + order.id + "')", false)
    : isSupplier && awaitingReceipt
      ? '<span class="rounded-lg px-3 py-1.5 text-[12px] font-semibold" style="background:var(--sunken); color:var(--tx3);">' + t('odAwaitingBuyerReceipt') + '</span>'
      : '';
  // the buyer can dispute an order that is still open and not yet received; an admin then resumes or cancels it
  const disputeAction = !isSupplier && !order.receivedAt && ['CONFIRMED', 'IN_PROGRESS', 'SHIPPED', 'DELIVERED'].includes(order.status)
    ? '<button onclick="openDisputeModal(\'' + order.id + '\')" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bad); color:var(--bad);">' + t('odOpenDispute') + '</button>'
    : '';
  const disputeNote = order.status === 'DISPUTED'
    ? '<div class="mb-4 rounded-xl border px-4 py-3 text-[13px]" style="border-color:var(--warn); background:var(--warn-soft); color:var(--warn);">' + t('odDisputedNote') + '</div>'
    : '';

  return '<button onclick="closeOrderDetail()" class="mb-4 text-[12px] font-semibold" style="color:var(--tx4);">' + t('odBack') + '</button>' +
  '<div class="eyebrow mb-1.5">' + tpl('odEyebrow', { status: esc(orderStatusLabel(order.status)) }) + '</div>' +
  '<h1 class="mb-4 text-[22px] font-extrabold" style="color:var(--tx);">' + esc(rfq ? rfq.title : t('lpoOrderFallback')) + '</h1>' + disputeNote +
  '<div class="rounded-xl border p-4 mb-6" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="flex flex-wrap items-end justify-between gap-3">' +
      '<div class="flex-1 min-w-[220px]">' + orderProgressHtml(order, 'mt-2 text-[12.5px] font-semibold') + '</div>' +
      '<div class="flex flex-wrap gap-2">' + deliveryAction + receiptAction + payAction + disputeAction + '</div>' +
    '</div>' +
  '</div>' +
  '<div class="grid gap-4 sm:grid-cols-2">' +
    detailCard(t('cardRequest'), [
      [t('rowQuantity'), rfq ? (rfq.quantity || '—') + ' ' + unitLabel(rfq.unit || '') : '—'],
      [t('rowNeededBy'), rfq && rfq.deadline ? fmtDate(rfq.deadline) : '—'],
      [t('rowDescription'), rfq ? rfq.description : '—']
    ]) +
    detailCard(t('cardPo'), [
      [t('rowLpo'), 'LPO-' + String(lpo.id || '').slice(-4).toUpperCase()],
      [t(isSupplier ? 'rowBuyer' : 'rowSupplier'), (isSupplier ? lpo.buyerCompany : lpo.supplierCompany)?.name || '—'],
      [t('rowAmount'), fmt(lpo.totalAmount)],
      [t('rowTerms'), lpo.terms === 'Standard terms' ? t('standardTerms') : (lpo.terms || '—')],
      [t('rowPaymentTerms'), tpl('rowPaymentTermsVal', { n: lpo.paymentTermsDays != null ? lpo.paymentTermsDays : 30 })],
      // the LPO document stays ACCEPTED once taken; how the deal went is the order's status
      [t('rowStatus'), lpo.status ? tpl('rowStatusWithLpo', { status: orderStatusLabel(order.status), lpo: enumLabel(LPO_STATUS_KEYS, lpo.status) }) : orderStatusLabel(order.status)]
    ]) +
    detailCard(t('cardDelivery'), [
      [t('rowStatus'), enumLabel(DELIVERY_STATUS_KEYS, delivery.status)],
      [t('rowTracking'), delivery.trackingInfo || '—'],
      [t('rowDispatched'), delivery.dispatchedAt ? fmtDateTime(delivery.dispatchedAt) : '—'],
      [t('rowDelivered'), delivery.deliveredAt ? fmtDateTime(delivery.deliveredAt) : '—'],
      [t('rowReceiptConfirmed'), order.receivedAt ? fmtDateTime(order.receivedAt) : '—']
    ]) +
    detailCard(t('cardInvoice'), [
      [t('rowAmount'), invoice.amount ? fmt(invoice.amount) : '—'],
      [t('rowStatus'), enumLabel(INVOICE_STATUS_KEYS, invoice.status) + (invoice.status === 'OVERDUE' ? ' · ' + overdueDaysLabel(invoice.dueDate) : '')],
      [t('rowDueDate'), invoice.dueDate ? fmtDate(invoice.dueDate) : '—'],
      [t('rowConfirmed'), fmt(totals.paid)],
      [t('rowAwaitingConfirmation'), fmt(totals.pending)],
      [t('rowOutstanding'), fmt(totals.outstanding)]
    ]) +
  '</div>' +
  renderPaymentsPanel(invoice, isSupplier) +
  renderDocumentsPanel({ order, isSupplier, canUpload: true }) +
  renderChatPanel();
}

function renderPaymentsPanel(invoice, isSupplier){
  const list = (invoice.payments || []).slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  if (!invoice.id) return '';
  const label = { PENDING: [t('payPending'),'background:var(--warn-soft); color:var(--warn);'], COMPLETED: [t('payCompleted'),'background:var(--ok-soft); color:var(--ok);'], FAILED: [t('payFailed'),'background:var(--bad-soft); color:var(--bad);'], REFUNDED: [t('payRefunded'),'background:var(--sunken); color:var(--tx3);'] };
  return '<div class="mt-6 rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="mb-3 text-[13px] font-bold" style="color:var(--tx);">' + t('payTitle') + '</div>' +
    (list.length === 0 ? '<div class="text-[12px]" style="color:var(--tx4);">' + t('payNone') + '</div>' :
      '<div class="flex flex-col gap-2">' + list.map(p => {
        const [txt, style] = label[p.status] || [p.status, ''];
        const actions = isSupplier && p.status === 'PENDING'
          ? '<div class="flex gap-2 shrink-0">' +
              '<button onclick="' + (state.ordersBusyId === p.id ? '' : "decidePayment('" + p.id + "','reject')") + '" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bd2); color:var(--bad);">' + t('payReject') + '</button>' +
              actionBtn(t('payConfirmReceived'), "decidePayment('" + p.id + "','confirm')", state.ordersBusyId === p.id) +
            '</div>'
          : '';
        return '<div class="flex flex-wrap items-center justify-between gap-3 rounded-lg border px-3 py-2.5 text-[12.5px]" style="border-color:var(--bd);">' +
          '<div class="min-w-0">' +
            '<div class="font-semibold mono" style="color:var(--tx);">' + fmt(p.amount) + ' <span class="font-normal" style="color:var(--tx3);">&middot; ' + esc(paymentMethodLabel(p.method)) + (p.reference ? ' &middot; ' + tpl('payRef', { ref: esc(p.reference) }) : '') + '</span></div>' +
            '<div class="text-[11px] mt-0.5" style="color:var(--tx4);">' + tpl('payReported', { date: fmtDateTime(p.createdAt) }) + (p.status === 'FAILED' && p.rejectReason ? ' &middot; ' + esc(p.rejectReason) : '') + '</div>' +
          '</div>' +
          '<div class="flex items-center gap-2"><span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="' + style + '">' + txt + '</span>' + actions + '</div>' +
        '</div>';
      }).join('') + '</div>') +
  '</div>';
}

function renderChatPanel(){
  const msgs = state.chatMessages || [];
  const myCompanyId = state.company ? state.company.id : null;
  return '<div class="mt-6 rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="mb-3 text-[13px] font-bold" style="color:var(--tx);">' + t('chatTitle') + '</div>' +
    '<div class="mb-3 flex max-h-[280px] flex-col gap-2 overflow-y-auto bx-scroll pr-1">' +
    (msgs.length === 0 ? '<div class="py-6 text-center text-[12px]" style="color:var(--tx4);">' + t('chatEmpty') + '</div>' :
      msgs.map(m => chatMessageHtml(m, myCompanyId)).join('')) +
    '</div>' +
    '<div class="flex gap-2">' +
      '<input data-chat="draft" type="text" value="' + esc(state.chatDraft) + '" placeholder="' + esc(t('chatPlaceholder')) + '" class="flex-1 rounded-lg border px-3 py-2 text-sm outline-none" style="border-color:var(--bd); background:var(--inset); color:var(--tx);" />' +
      '<button onclick="sendChatMessage()" ' + (state.chatBusy?'disabled':'') + ' class="rounded-lg px-4 py-2 text-[12px] font-bold text-white" style="background:var(--acc); opacity:' + (state.chatBusy?'0.6':'1') + ';">' + t('chatSend') + '</button>' +
    '</div>' +
  '</div>';
}

// A message without a sender company is a Biddex admin comment (e.g. a dispute decision): shown centred
function chatMessageHtml(m, myCompanyId){
  if (!m.senderCompanyId) {
    return '<div class="flex justify-center">' +
      '<div class="max-w-[90%] rounded-xl border px-3 py-2 text-[13px]" style="border-color:var(--warn); background:var(--warn-soft); color:var(--warn);">' +
        '<div class="mb-0.5 text-[10px] font-bold">' + t('chatAdmin') + '</div>' + esc(m.body) +
      '</div></div>';
  }
  const mine = !!myCompanyId && m.senderCompanyId === myCompanyId;
  return '<div class="flex ' + (mine ? 'justify-end' : 'justify-start') + '">' +
    '<div class="max-w-[75%] rounded-xl px-3 py-2 text-[13px]" style="' + (mine ? 'background:var(--acc); color:white;' : 'background:var(--inset); color:var(--tx2);') + '">' +
      (!mine ? '<div class="mb-0.5 text-[10px] font-semibold opacity-70">' + companyLabel(m.senderCompany) + '</div>' : '') +
      esc(m.body) +
    '</div></div>';
}

function detailCard(title, rows){
  return '<div class="rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="mb-3 text-[13px] font-bold" style="color:var(--tx);">' + title + '</div>' +
    '<div class="flex flex-col gap-2">' + rows.map(([k,v]) => '<div class="flex items-center justify-between gap-3 text-[12px]"><span style="color:var(--tx4);">' + k + '</span><span class="mono text-right" style="color:var(--tx2); max-width:65%;">' + esc(v) + '</span></div>').join('') + '</div>' +
  '</div>';
}

        '<div class="flex items-center justify-between border-b px-3.5 py-2.5" style="border-color:var(--bd);"><span class="text-[13px] font-bold" style="color:var(--tx);">' + t('notifTitle') + '</span>' +
        (state.notifUnread > 0 ? '<button onclick="markAllNotifRead()" class="text-[11px] font-semibold" style="color:var(--acc);">' + t('notifMarkAll') + '</button>' : '') +

        (list.length === 0 ? '<div class="px-3.5 py-8 text-center text-[12px]" style="color:var(--tx4);">' + t('notifEmpty') + '</div>' :
          list.map(n => '<div class="border-b px-3.5 py-2.5 text-[12px]" style="border-color:var(--bd); ' + (n.read?'':'background:var(--acc-soft2);') + '">' +
            '<div class="font-semibold" style="color:var(--tx);">' + esc(n.title) + '</div>' +

            '<div class="mono mt-1 text-[10px]" style="color:var(--tx4);">' + fmtDateTime(n.createdAt) + '</div>' +
          '</div>').join('')) +
      '</div>' : '') +
  '</div>';

// Mobile-only "more" menu (<640px): collects header controls that don't fit next to the bell
// (company name, wallet, language, theme, sign out) instead of letting the header overflow the

function menuItemBtn(onclick, label){

}
function headerMenu(itemsHtml){
  return '<div class="relative sm:hidden" data-dropdown="headerMenu">' +
    '<button onclick="toggleHeaderMenu()" class="rounded-lg border px-2.5 py-1.5 text-[15px] font-bold leading-none" style="border-color:var(--bd2); color:var(--tx2);" aria-label="' + t('moreLabel') + '">⋯</button>' +
    (state.showHeaderMenu ?
      '<div class="absolute right-0 top-11 z-40 w-56 rounded-xl border p-1.5 shadow-xl flex flex-col" style="border-color:var(--bd); background:var(--panel);">' + itemsHtml + '</div>'
      : '') +

function verificationBadge(){
  const st = state.company ? state.company.verificationStatus : null;
  if (!st) return '';
  const styles = {
    PENDING: 'background:var(--warn-soft); color:var(--warn);',
    IN_REVIEW: 'background:var(--info-soft); color:var(--info);',
    VERIFIED: 'background:var(--ok-soft); color:var(--ok);',
    REJECTED: 'background:var(--bad-soft); color:var(--bad);'
  };
  const labels = { PENDING:t('verNotVerified'), IN_REVIEW:t('verInReview'), VERIFIED:t('verVerified'), REJECTED:t('verRejected') };

function verificationBanner(){
  const st = state.company ? state.company.verificationStatus : null;
  if (!st || st === 'VERIFIED' || st === 'IN_REVIEW') return '';
  return '<div class="mb-6 flex items-center justify-between gap-3 rounded-xl border p-4" style="border-color:var(--bd); background:var(--acc-soft2);">' +
    '<div class="text-[13px] font-semibold" style="color:var(--tx);">' + t(st === 'REJECTED' ? 'verifyBannerRejected' : 'verifyBannerGet') + hint('verification') + '</div>' +
    '<button onclick="openVerifyModal()" class="rounded-lg px-3.5 py-2 text-[12px] font-bold text-white shrink-0" style="background:var(--acc);">' + t('verifySubmitDoc') + '</button>' +
  '</div>';
}

// ---------- Admin ----------

function renderAdmin(){
  const header = '<header class="sticky top-0 z-30 border-b backdrop-blur-xl" style="border-color:var(--bd); background:color-mix(in srgb, var(--bg) 90%, transparent);">' +
    '<div class="mx-auto flex max-w-[1220px] items-center justify-between gap-2 sm:gap-4 px-4 sm:px-5 py-3 sm:py-3.5">' + logo('ADMIN CONSOLE') +
    '<div class="relative flex items-center gap-1.5 sm:gap-3">' +
      '<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="background:var(--sunken); color:var(--tx3);">Admin</span>' +
      '<span class="hidden sm:contents">' + langToggleBtn() + themeToggleBtn() +
        '<button onclick="logout()" class="rounded-lg px-3 py-1.5 text-[12px] font-semibold border" style="border-color:var(--bd2); color:var(--tx3);">' + t('signOut') + '</button>' +
      '</span>' +
      headerMenu(
        menuItemBtn('toggleLang()', state.lang === 'ar' ? 'EN' : 'العربية') +
        menuItemBtn('toggleTheme()', t(isDarkNow() ? 'themeLight' : 'themeDark')) +
        menuItemBtn('logout()', t('signOut'))
      ) +
    '</div></div></header>';

  const filters = ['ALL','PENDING','IN_REVIEW','VERIFIED','REJECTED'];
  const list = (state.adminCompanies || []).filter(c => state.adminFilter === 'ALL' || c.verificationStatus === state.adminFilter);

  const disputes = state.adminDisputes || [];
  const tabs = '<div class="flex flex-wrap gap-2 mb-6">' +
    '<button onclick="setAdminTab(\'companies\')" class="chip' + (state.adminTab === 'companies' ? ' active' : '') + '">Companies</button>' +
    '<button onclick="setAdminTab(\'disputes\')" class="chip' + (state.adminTab === 'disputes' ? ' active' : '') + '">Disputes' + (disputes.length ? ' (' + disputes.length + ')' : '') + '</button>' +
    '<button onclick="setAdminTab(\'rfqs\')" class="chip' + (state.adminTab === 'rfqs' ? ' active' : '') + '">All RFQs</button>' +
    '<button onclick="setAdminTab(\'orders\')" class="chip' + (state.adminTab === 'orders' ? ' active' : '') + '">All orders</button>' +
    '<button onclick="setAdminTab(\'analytics\')" class="chip' + (state.adminTab === 'analytics' ? ' active' : '') + '">Analytics</button>' +
  '</div>';

  const body =
    state.adminTab === 'disputes' ? renderAdminDisputes() :
    state.adminTab === 'rfqs' ? renderAdminRfqs() :
    state.adminTab === 'orders' ? renderAdminOrdersAll() :
    state.adminTab === 'analytics' ? renderAdminAnalyticsPage() :
    '<div class="eyebrow mb-1.5">VERIFICATION QUEUE</div>' +
  '<div class="flex items-center justify-between mb-5">' +
    '<h1 class="text-[22px] font-extrabold" style="color:var(--tx);">Company verification</h1>' +
    actionBtn('+ Add credits', 'openCreditModal()', false) +
  '</div>' +
  '<div class="flex flex-wrap gap-2 mb-5">' + filters.map(f =>
    '<button onclick="setAdminFilter(\'' + f + '\')" class="chip' + (state.adminFilter===f?' active':'') + '">' + f + '</button>'
  ).join('') + '</div>' +
  (list.length === 0 ? emptyState('No companies here', 'Nothing matches this filter yet.') :
    '<div class="flex flex-col gap-3">' + list.map(c =>
      '<div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +

// Small "Page X of Y (N total)" + Prev/Next control, shared by the admin list tabs.
function pagerHtml(page, pageSize, total, onPageFn){
  const pages = Math.max(1, Math.ceil(total / pageSize));
  return '<div class="mt-4 flex items-center justify-between gap-3 text-[12px]" style="color:var(--tx3);">' +
    '<span>' + total + ' total &middot; page ' + page + ' of ' + pages + '</span>' +
    '<div class="flex gap-2">' +
      '<button ' + (page<=1?'disabled':'') + ' onclick="' + onPageFn + '(' + (page-1) + ')" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bd2); color:var(--tx3); opacity:' + (page<=1?'0.5':'1') + ';">Prev</button>' +
      '<button ' + (page>=pages?'disabled':'') + ' onclick="' + onPageFn + '(' + (page+1) + ')" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bd2); color:var(--tx3); opacity:' + (page>=pages?'0.5':'1') + ';">Next</button>' +

}

// Admin opening an order from the "All orders" list: a read-only card (the server lets ADMIN read any
// order and its chat, but not post to it — only resolving a dispute writes to the chat as admin).
async function openAdminOrder(orderId){
  setState({ adminOrderId: orderId, adminOrderDetail: null, adminOrderChat: [], orderDocs: [] });
  try {
    const [order, chat] = await Promise.all([
      api('/api/orders/' + orderId),
      api('/api/orders/' + orderId + '/messages'),
    ]);
    if (state.adminOrderId === orderId) setState({ adminOrderDetail: order, adminOrderChat: chat });
    refreshOrderDocs(orderId);
  } catch(e) { showToast(e.message); setState({ adminOrderId: null }); }
}
function closeAdminOrder(){ setState({ adminOrderId: null, adminOrderDetail: null, adminOrderChat: [], orderDocs: [] }); }

    const tomorrow = addDaysBahrain(1), inWeek = addDaysBahrain(7);
    const customDate = !!state.rfqDatePick || !!(r.deadline && r.deadline !== tomorrow && r.deadline !== inWeek);
    const chip = (text, on, click) => '<button type="button" onclick="' + click + '" class="min-w-0 flex-1 rounded-lg border px-2 py-2.5 text-[12.5px] font-bold" style="' +
      (on ? 'background:var(--acc); color:#fff; border-color:var(--acc);' : 'border-color:var(--bd2); color:var(--tx2);') + '">' + text + '</button>';
    const more = rfqMoreOpen();
    const units = CATALOG_UNITS.concat(r.unit && !CATALOG_UNITS.includes(r.unit) ? [r.unit] : []);
    const feeOn = bidFeePercent() > 0;
    html += modalWrap(t(editing ? 'rfqModalEdit' : 'rfqModalPost') + hint('rfq'), 'closePostRfq()',
      // 1. what
      '<div class="flex flex-col gap-1.5"><label class="flex flex-col gap-1.5">' + label(t('rfqWhatNeed')) +

        '<div id="rfq-product-area" class="flex flex-col gap-1.5">' + renderRfqProductArea() + '</div></div>' +
      // 2. quantity + unit

// stickySubmit pins the button to the bottom of the (scrolling) dialog, so a long form on a phone never hides it
function modalWrap(title, onClose, fieldsHtml, onSubmit, submitLabel, busy, stickySubmit){
  return '<div class="bx-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">' +
    '<div class="bx-rise bx-modal bx-scroll w-full max-w-sm rounded-2xl border p-6 shadow-2xl" style="border-color:var(--bd); background:var(--panel);">' +
      '<div class="flex items-center justify-between"><h3 class="text-lg font-bold" style="color:var(--tx);">' + title + '</h3>' +
      '<button onclick="' + onClose + '" class="text-[13px] font-semibold" style="color:var(--tx4);">' + t('close') + '</button></div>' +
      '<div class="mt-4 flex flex-col gap-4">' + fieldsHtml + '</div>' +
      (stickySubmit ? '<div class="sticky bottom-0 -mx-6 mt-4 px-6 pb-1 pt-3" style="background:var(--panel);">' : '') +
      '<button onclick="' + onSubmit + '" ' + (busy?'disabled':'') + ' class="' + (stickySubmit ? '' : 'mt-6 ') + 'w-full rounded-xl px-4 py-3 text-sm font-bold text-white" style="background:var(--acc); opacity:' + (busy?'0.6':'1') + ';">' + submitLabel + '</button>' +
      (stickySubmit ? '</div>' : '') +
    '</div></div>';
}

function bindEvents(){
  document.querySelectorAll('[data-field]').forEach(el => {

      const f = el.getAttribute('data-field');
      if (state.view === 'auth') { if (f === 'consent') state.authForm.consent = e.target.checked; else state.authForm[f] = e.target.value; }
      else if (state.showPostRfq && f === 'title') onRfqTitleInput(e);
      else if (state.showPostRfq && ['quantity','deadline','budget','specifications'].includes(f)) {
        state.newRfq[f] = e.target.value;
        if (f === 'specifications') { const c = document.getElementById('spec-count'); if (c) c.textContent = e.target.value.length + ' / ' + MAX_SPECIFICATIONS; }
      }
      else if (state.showPostRfq && f === 'brand') { state.newRfq.brand = e.target.value; updateBrandToggleVisibility(); }
      else if (state.submitQuoteRfqId && ['price','days','paymentTerms'].includes(f)) { state.quoteForm[f] = e.target.value; if (f === 'price') updateQuoteTotal(); }
      else if (state.showCatalogAdd && ['name','brand','price'].includes(f)) state.newProduct[f] = e.target.value;
      else if (state.showVerifyModal && f === 'fileUrl') state.verifyForm.fileUrl = e.target.value;
      else if (state.showStockAdd && ['name','brand','quantity','threshold'].includes(f)) state.stockForm[f] = e.target.value;
    });
  });
  const stockCountInput = document.querySelector('[data-stockcount]');
  if (stockCountInput) stockCountInput.addEventListener('input', onStockCountField);
  document.querySelectorAll('[data-profile]').forEach(el => {
    el.addEventListener('input', (e) => { state.profileForm[el.getAttribute('data-profile')] = e.target.value; });
  });
  document.querySelectorAll('[data-select]').forEach(el => {
    el.addEventListener('change', (e) => {
      const f = el.getAttribute('data-select');
      if (state.showVerifyModal && f === 'docType') state.verifyForm.docType = e.target.value;
      else if (state.showPostRfq && f === 'category') state.newRfq.category = e.target.value;
      else if (state.showPostRfq && f === 'unit') state.newRfq.unit = e.target.value;
      else if (state.showCatalogAdd && f === 'unit') state.newProduct.unit = e.target.value;
      else if (state.showStockAdd && f === 'stockUnit') state.stockForm.unit = e.target.value;
    });

  const catalogPhotoInput = document.querySelector('[data-catalog-photo]');
  if (catalogPhotoInput) catalogPhotoInput.addEventListener('change', onCatalogPhotoChange);
  const bulkImportInput = document.querySelector('[data-bulk-import-file]');

  const bulkPhotoInput = document.querySelector('[data-bulk-photo-files]');
  if (bulkPhotoInput) bulkPhotoInput.addEventListener('change', onBulkPhotoFilesChange);
  document.querySelectorAll('[data-chat]').forEach(el => {
    el.addEventListener('input', (e) => { state.chatDraft = e.target.value; });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !state.chatBusy) sendChatMessage(); });
  });
  const quoteFilesInput = document.querySelector('[data-quotefiles]');
  if (quoteFilesInput) quoteFilesInput.addEventListener('change', onQuoteFilesChange);
  const attFile = document.querySelector('[data-attfile]');
  if (attFile) attFile.addEventListener('change', onAttFileChange);
  const docFile = document.querySelector('[data-docfile]');
  if (docFile) docFile.addEventListener('change', onDocFileChange);
  document.querySelectorAll('[data-decline]').forEach(el => {
    el.addEventListener('input', (e) => { state.declineReason = e.target.value; });
  });
  document.querySelectorAll('[data-receipt]').forEach(el => {
    el.addEventListener('input', (e) => { state.receiptComment = e.target.value; });
  });
  document.querySelectorAll('[data-dispute]').forEach(el => {
    el.addEventListener('input', (e) => { state.disputeReason = e.target.value; });
  });
  document.querySelectorAll('[data-resolve]').forEach(el => {
    el.addEventListener('input', (e) => { state.resolveComment = e.target.value; });
  });
  document.querySelectorAll('[data-deactivate]').forEach(el => {
    el.addEventListener('input', (e) => { state.deactivateReason = e.target.value; });
  });
  document.querySelectorAll('[data-deliveryfail]').forEach(el => {
    el.addEventListener('input', (e) => { state.deliveryFailReason = e.target.value; });
  });
  document.querySelectorAll('[data-pay]').forEach(el => {
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', (e) => { state.payForm[el.getAttribute('data-pay')] = e.target.value; });
  });
  document.querySelectorAll('[data-credit]').forEach(el => {
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', (e) => { state.creditForm[el.getAttribute('data-credit')] = e.target.value; });

  document.querySelectorAll('[data-changepw]').forEach(el => {
    el.addEventListener('input', (e) => { state.changePwForm[el.getAttribute('data-changepw')] = e.target.value; });

  if (forgotInput) {
    forgotInput.addEventListener('input', (e) => { state.forgotEmail = e.target.value; });

  const fileInput = document.querySelector('[data-verify-file]');
  if (fileInput) fileInput.addEventListener('change', onVerifyFileChange);
  // keep the active nav tab in view when the strip scrolls horizontally (mobile)
  const activeTab = document.querySelector('[data-navtab-active]');
  if (activeTab) activeTab.scrollIntoView({ block: 'nearest', inline: 'nearest' });

// ---------- Admin: review verification documents ----------

// Same whitelist as the API: PDF and raster images only (no SVG, which can carry script)
const DOC_DATA_URL_RE = /^data:(application\/pdf|image\/(?:png|jpeg|webp|gif));base64,([A-Za-z0-9+/]+={0,2})$/;
// what the document viewer shows inline (iframe for PDF, img for images); anything else is refused
const VIEWABLE_DOC_TYPES = ['application/pdf', 'image/png', 'image/jpeg', 'image/webp', 'image/gif'];
const DOC_TYPE_LABELS = { TRADE_LICENSE:'Trade license', CR_CERTIFICATE:'Commercial registration', OTHER:'Other' };

function openDocsModal(companyId){ closeDocViewer(); setState({ showDocsModal: companyId }); }
function closeDocsModal(){ closeDocViewer(); setState({ showDocsModal: null }); }
function closeDocViewer(){
  if (state.docViewer && !state.docViewer.remote) { try { URL.revokeObjectURL(state.docViewer.url); } catch(e) {} }
  state.docViewer = null;
}

async function viewDocument(companyId, docId){
  setState({ docBusyId: docId });
  try {
    const doc = await api('/api/admin/companies/' + companyId + '/documents/' + docId);
    if (doc.url) {
      // stored in the bucket: a 120-second link that shows the file inline — only for types a browser
      // never executes (the server checks the content on upload; this is the second line of defence)
      if (!VIEWABLE_DOC_TYPES.includes(doc.contentType)) throw new Error('This file type can’t be shown safely.');
      closeDocViewer();
      setState({ docBusyId: null, docViewer: { id: docId, mime: doc.contentType, url: doc.url, remote: true } });
      return;
    }
    // not yet moved to the bucket: the file comes inline as a data: URL
    if (!doc.fileUrl) throw new Error('This document can’t be opened in this version of the page. Reload the page and try again.');
    const m = DOC_DATA_URL_RE.exec(doc.fileUrl);
    if (!m) throw new Error('This file type can’t be shown safely.');
    // decode to a Blob: blob: URLs render PDFs in the browser viewer, which data: URLs often don't
    const bin = atob(m[2]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    closeDocViewer();
    setState({ docBusyId: null, docViewer: { id: docId, mime: m[1], url: URL.createObjectURL(new Blob([bytes], { type: m[1] })) } });
  } catch(e) { setState({ docBusyId: null }); showToast(e.message); }
}

function renderDocsModal(){
  if (!state.showDocsModal) return '';
  const c = (state.adminCompanies || []).find(x => x.id === state.showDocsModal);
  if (!c) return '';
  const docs = c.documents || [];
  const v = state.docViewer;
  const viewer = !v ? '<div class="rounded-lg border border-dashed p-8 text-center text-[12.5px]" style="border-color:var(--bd2); color:var(--tx4);">Choose a document to view it here.</div>'
    : (v.mime === 'application/pdf'
        ? '<iframe src="' + esc(v.url) + '" title="Document" class="w-full rounded-lg border" style="height:60vh; border-color:var(--bd); background:white;"></iframe>'
        : '<img src="' + esc(v.url) + '" alt="Document" class="mx-auto max-h-[60vh] rounded-lg border object-contain" style="border-color:var(--bd);" />') +
      '<div class="mt-2 text-right"><a href="' + esc(v.url) + '" target="_blank" rel="noopener" class="text-[12px] font-semibold" style="color:var(--acc);">Open in new tab</a></div>';
  return '<div class="bx-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">' +
    '<div class="bx-rise bx-modal bx-scroll w-full max-w-3xl rounded-2xl border p-6 shadow-2xl" style="border-color:var(--bd); background:var(--panel);">' +
      '<div class="flex items-center justify-between"><h3 class="text-lg font-bold" style="color:var(--tx);">Documents · ' + esc(c.name) + '</h3>' +
      '<button onclick="closeDocsModal()" class="text-[13px] font-semibold" style="color:var(--tx4);">Close</button></div>' +
      '<div class="mono mt-1 text-[12px]" style="color:var(--tx3);">CR: ' + esc(c.registrationNumber || '—') + ' &middot; ' + esc(c.verificationStatus) + '</div>' +
      '<div class="mt-4 flex flex-col gap-2">' + docs.map(d =>
        '<div class="flex items-center justify-between gap-3 rounded-lg border px-3 py-2 text-[12.5px]" style="border-color:' + (v && v.id === d.id ? 'var(--acc)' : 'var(--bd)') + ';">' +
          '<div><span class="font-semibold" style="color:var(--tx);">' + esc(DOC_TYPE_LABELS[d.docType] || d.docType) + '</span>' +
          ' <span class="mono" style="color:var(--tx4);">&middot; ' + fmtDateTime(d.uploadedAt) + '</span></div>' +
          actionBtn('View', "viewDocument('" + c.id + "','" + d.id + "')", state.docBusyId === d.id) +
        '</div>').join('') + '</div>' +
      '<div class="mt-4">' + viewer + '</div>' +
      '<div class="mt-5 flex justify-end gap-2">' +
        (c.verificationStatus !== 'REJECTED' ? '<button onclick="setCompanyVerification(\'' + c.id + '\',\'REJECTED\')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold border" style="border-color:var(--bd2); color:var(--tx3);">Reject</button>' : '') +
        (c.verificationStatus !== 'VERIFIED' ? actionBtn('Verify', "setCompanyVerification('" + c.id + "','VERIFIED')", state.adminBusyId === c.id) : '') +
      '</div>' +
    '</div></div>';
}

async function onVerifyFileChange(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast(t('verifyFileTooBig')); e.target.value = ''; return; }
  if (!['application/pdf', 'image/png', 'image/jpeg', 'image/webp', 'image/gif'].includes(file.type)) {
    showToast(t('verifyFileBadType')); e.target.value = ''; return;
  }
  setState({ verifyFileBusy: true });
  const reader = new FileReader();
  reader.onload = () => {
    state.verifyForm.fileUrl = reader.result;
    setState({ verifyFileName: file.name, verifyFileBusy: false });
  };
  reader.onerror = () => { setState({ verifyFileBusy: false }); showToast(t('fileReadFail')); };
  reader.readAsDataURL(file);
}

// Tick countdown timers every second WITHOUT re-rendering the whole page (avoids flicker):
// only the text/color of elements carrying a deadline is updated in place.
function tickCountdowns(){
  document.querySelectorAll('[data-deadline]').forEach(el => {
    const tl = timeLeftLabel(el.getAttribute('data-deadline'));
    el.textContent = tl.label;
    el.style.color = tl.urgent ? 'var(--acc)' : (el.getAttribute('data-basecolor') || '');
  });
}
setInterval(tickCountdowns, 1000);

// Keep RFQs / orders / notifications / chat fresh without requiring a relogin
setInterval(() => {
  if (!state.token) return;
  if (state.view === 'buyer' || state.view === 'supplier') {
    refreshRfqs();
    refreshOrders();
    refreshLpos();
    refreshNotifications();
    refreshOnboarding();
    if (state.section === 'orderDetail' && state.selectedOrderId) { refreshChat(state.selectedOrderId); refreshOrderDocs(state.selectedOrderId); }
  } else if (state.view === 'admin') {
    refreshAdmin();
  }
}, 30000);

checkForNewVersion();
setInterval(checkForNewVersion, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForNewVersion(); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden || !state.token) return;
  if (state.view === 'buyer' || state.view === 'supplier') refreshAll();
  else if (state.view === 'admin') refreshAdmin();
});

// Tapping/clicking outside an open header dropdown (notifications, the mobile "more" menu) closes it.
// The toggle buttons live inside the same [data-dropdown] wrapper, so opening one isn't undone by this.
document.addEventListener('click', (e) => {
  let changed = false;
  if (state.showNotifDropdown && !e.target.closest('[data-dropdown="notif"]')) { state.showNotifDropdown = false; changed = true; }
  if (state.showHeaderMenu && !e.target.closest('[data-dropdown="headerMenu"]')) { state.showHeaderMenu = false; changed = true; }
  if (changed) render();
});
