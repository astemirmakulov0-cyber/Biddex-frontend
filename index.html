function t(key){ return (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key; }

function initTheme(){
  try {
    const th = localStorage.getItem('biddex_theme');
    if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th);
  } catch(e) {}
}
function isDarkNow(){
  const cur = document.documentElement.getAttribute('data-theme');
  return cur === 'dark' || (!cur && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function toggleTheme(){
  const next = isDarkNow() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('biddex_theme', next); } catch(e) {}
  render();
}
function themeToggleBtn(){
  return '<button onclick="toggleTheme()" class="rounded-lg border px-2.5 py-1.5 text-[13px]" style="border-color:var(--bd2); color:var(--tx2);" title="Toggle dark mode">' + (isDarkNow() ? '☀️' : '🌙') + '</button>';
}

function initLang(){
  try {
    const l = localStorage.getItem('biddex_lang');
    if (l === 'ar' || l === 'en') applyLangAttrs(l);
  } catch(e) {}
}
function applyLangAttrs(l){
  state.lang = l;
  document.documentElement.setAttribute('lang', l);
  document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
}
function toggleLang(){
  applyLangAttrs(state.lang === 'ar' ? 'en' : 'ar');
  try { localStorage.setItem('biddex_lang', state.lang); } catch(e) {}
  render();
}

function setState(patch){ Object.assign(state, patch); render(); }
function setIfChanged(key, data){
  if (JSON.stringify(state[key]) !== JSON.stringify(data)) setState({ [key]: data });
}
function fmt(n){ return (Number(n)||0).toFixed(3) + ' BHD'; }
function showToast(msg){ setState({ toast: msg }); setTimeout(()=>{ if(state.toast===msg) setState({toast:''}); }, 3200); }

async function api(path, opts={}) {
  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...opts, headers });
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
  return data;
}

function loadSession(){
  try {
    const raw = localStorage.getItem('biddex_session');
    if (raw) {
      const s = JSON.parse(raw);
      state.token = s.token; state.user = s.user; state.company = s.company;
      state.view = s.user && s.user.role === 'ADMIN' ? 'admin' : (s.company && s.company.type === 'SUPPLIER' ? 'supplier' : 'buyer');
    }
  } catch(e) {}
}
function saveSession(){
  try { localStorage.setItem('biddex_session', JSON.stringify({ token: state.token, user: state.user, company: state.company })); } catch(e) {}
}
function clearSession(){ try { localStorage.removeItem('biddex_session'); } catch(e) {} }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jsAttr(s){ return "'" + String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/</g,'&lt;') + "'"; }

function initials(name){
  const s = String(name||'??').trim();
  const parts = s.split(/\s+/).filter(Boolean);
  const two = parts.length >= 2 ? (parts[0][0]+parts[1][0]) : s.slice(0,2);
  return two.toUpperCase();
}
function avatarColor(name){
  let h = 0; const s = String(name||'');
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % AVATAR_PALETTE.length;
  return AVATAR_PALETTE[Math.abs(h)];
}
function avatarHtml(name, size){
  const c = avatarColor(name);
  const sz = size || 38;
  return '<div class="avatar2" style="width:' + sz + 'px; height:' + sz + 'px; background:' + c.bg + '; color:' + c.fg + '; font-size:' + Math.round(sz*0.34) + 'px;">' + esc(initials(name)) + '</div>';
}

function timeLeft(dateStr){
  if (!dateStr) return null;
  const end = new Date(dateStr).getTime();
  const diff = end - Date.now();
  return diff;
}
function timeLeftLabel(dateStr){
  const diff = timeLeft(dateStr);
  if (diff == null) return { label:'—', urgent:false, past:false };
  if (diff <= 0) return { label:'Closed', urgent:false, past:true };
  const s = Math.floor(diff/1000);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60;
  const urgent = diff < 24*3600*1000;
  let label;
  if (d > 0) label = d + 'd ' + h + 'h ' + m + 'm';
  else if (urgent) label = String(h).padStart(2,'0') + 'h ' + String(m).padStart(2,'0') + 'm ' + String(sec).padStart(2,'0') + 's';
  else label = h + 'h ' + m + 'm';
  return { label, urgent, past:false };
}

function onAuthField(field, e){ state.authForm[field] = e.target.value; }

async function submitAuth(){
  const f = state.authForm;
  if (!f.email || !f.password || (state.authMode === 'register' && (!f.companyName || !f.registrationNumber))) {
    setState({ authError: 'Please fill in all required fields.' }); return;
  }
  // Capture the mode now — if the user switches the Login/Register tab while
  // this request is in flight, state.authMode could change before the
  // response arrives. Reading state.authMode again after the await would then
  // misinterpret a register response as a login response (and vice versa),
  // crashing on data.user.role since a register response has no `user` field.
  const mode = state.authMode;
  setState({ authBusy: true, authError: '' });
  try {
    let data;
    if (mode === 'register') {
      data = await api('/api/auth/register', { method:'POST', body: JSON.stringify({
        email: f.email, password: f.password, role: state.authRole,
        companyName: f.companyName, country: f.country || undefined,
        registrationNumber: f.registrationNumber, consent: !!f.consent
      })});
    } else {
      data = await api('/api/auth/login', { method:'POST', body: JSON.stringify({ email: f.email, password: f.password }) });
    }
    if (mode === 'register') {
  setState({ authBusy: false, authError: '' });
  alert(data.message || 'Registration successful. Please check your email to verify your account.');
  state.authMode = 'login';
  render();
  return;
}
    state.token = data.token; state.user = data.user; state.company = data.company;
    saveSession();
    const dest = data.user.role === 'ADMIN' ? 'admin' : (data.company && data.company.type === 'SUPPLIER' ? 'supplier' : 'buyer');
    setState({ view: dest, authBusy:false, section:'main' });
    if (dest === 'admin') refreshAdminCompanies(); else refreshAll();
  } catch (e) {
    setState({ authBusy:false, authError: e.message });
  }
}

function logout(){
  clearSession();
  setState({ token:null, user:null, company:null, wallet:null, rfqs:[], catalog:[], myCatalog:[], lpos:[], orders:[], adminCompanies:[], notifications:[], notifUnread:0, chatMessages:[], view:'landing', section:'main', orderDetail:null, selectedOrderId:null });
}

async function refreshAll(){
  await Promise.all([ refreshRfqs(), refreshWallet(), refreshCatalog(), refreshMyCatalog(), refreshLpos(), refreshOrders(), refreshCompanyInfo(), refreshNotifications() ]);
}

async function refreshCompanyInfo(){
  if (!state.token || !state.company) return;
  try { const data = await api('/api/companies/me'); setIfChanged('company', { ...state.company, ...data }); }
  catch(e) {}
}

function openVerifyModal(){ setState({ showVerifyModal:true, verifyForm:{ fileUrl:'', docType:'TRADE_LICENSE' }, verifyFileName:'' }); }
function closeVerifyModal(){ setState({ showVerifyModal:false }); }

async function submitVerifyDoc(){
  const f = state.verifyForm;
  if (!f.fileUrl) return;
  setState({ verifyBusy:true });
  try {
    await api('/api/companies/me/documents', { method:'POST', body: JSON.stringify({ fileUrl: f.fileUrl, docType: f.docType }) });
    setState({ showVerifyModal:false, verifyBusy:false });
    showToast('Document submitted for review.');
    refreshCompanyInfo();
  } catch(e) { setState({ verifyBusy:false }); showToast(e.message); }
}

async function refreshAdminCompanies(){
  if (!state.token) return;
  try { const data = await api('/api/admin/companies'); setIfChanged('adminCompanies', data); }
  catch(e) { showToast(e.message); }
}

async function setCompanyVerification(companyId, status){
  setState({ adminBusyId: companyId });
  try {
    await api('/api/admin/companies/' + companyId + '/verify', { method:'PATCH', body: JSON.stringify({ status }) });
    showToast(status === 'VERIFIED' ? 'Company verified.' : 'Company rejected.');
    setState({ adminBusyId:null });
    refreshAdminCompanies();
  } catch(e) { setState({ adminBusyId:null }); showToast(e.message); }
}
function setAdminFilter(f){ setState({ adminFilter: f }); }

function setSection(sec){
  if (sec === 'profile') {
    const c = state.company || {};
    state.profileForm = { name: c.name||'', country: c.country||'', phone: c.phone||'', registrationNumber: c.registrationNumber||'' };
  }
  setState({ section: sec });
}

async function saveProfile(){
  const f = state.profileForm;
  setState({ profileBusy:true });
  try {
    await api('/api/companies/me', { method:'PATCH', body: JSON.stringify({ name: f.name, country: f.country, phone: f.phone, registrationNumber: f.registrationNumber }) });
    setState({ profileBusy:false });
    showToast('Profile updated.');
    refreshCompanyInfo();
  } catch(e) { setState({ profileBusy:false }); showToast(e.message); }
}

async function openOrderDetail(orderId){
  setState({ section:'orderDetail', selectedOrderId: orderId, orderDetail:null, orderDetailLoading:true, chatMessages:[] });
  try {
    const order = await api('/api/orders/' + orderId);
    let rfq = null;
    if (order.lpo && order.lpo.rfqId) {
      try { rfq = await api('/api/rfqs/' + order.lpo.rfqId); } catch(e) {}
    }
    setState({ orderDetail: { order, rfq }, orderDetailLoading:false });
    refreshChat(orderId);

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read image.'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Could not read file.'));
    reader.readAsDataURL(file);
  });
}

const STAGES = ['LPO issued','Accepted','Delivery note sent','Invoice pending','Payment confirmed','Completed'];

function orderStageIndex(o){
  const delivery = o.delivery || {}, invoice = o.invoice || {};
  if (o.status === 'COMPLETED') return 6;
  if (invoice.status === 'PAID') return 5;
  if (delivery.status === 'DELIVERED') return 4;
  if (delivery.status === 'DISPATCHED') return 3;
  return 2; // accepted, delivery pending
}
function stageTrackerHtml(currentIndex){
  return '<div class="flex items-center gap-1.5">' + STAGES.map((s,i) => {
    const n = i+1;
    const cls = n < currentIndex ? 'done' : (n === currentIndex ? 'current' : '');
    return '<div class="stage-seg ' + cls + '"><span></span></div>';
  }).join('') + '</div>';
}

        '<div class="mono text-[11.5px] mt-0.5" style="color:var(--tx4);">' + esc(r.cat) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="mt-3.5 flex items-center justify-between border-t pt-3" style="border-color:var(--bd);">' +
      '<div><div class="eyebrow" style="color:var(--tx4);">BUDGET</div><div class="mono text-[13px] font-bold" style="color:var(--tx);">BHD ' + r.budget + '</div></div>' +
      '<div><div class="eyebrow" style="color:var(--tx4);">CLOSES IN</div><div class="mono text-[13px] font-bold" style="color:var(--acc);">' + r.closes + '</div></div>' +
      '<button onclick="openAuth(\'SUPPLIER\',\'login\')" class="rounded-lg px-3.5 py-2 text-[12px] font-bold text-white" style="background:var(--acc);">' + t('bidOnRfq') + '</button>' +
    '</div>' +
  '</div>';
}

// ---------- Auth ----------

function renderAuth(){
  const f = state.authForm;
  const isReg = state.authMode === 'register';
  return '<div class="min-h-screen flex items-center justify-center p-4">' +
  '<div class="bx-rise w-full max-w-sm rounded-2xl border p-6 shadow-2xl" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="flex items-center justify-between mb-4">' +
      '<button onclick="goLanding()" class="text-[12px] font-semibold" style="color:var(--tx4);">&larr; ' + t('back') + '</button>' +
      '<div class="flex items-center gap-2">' + langToggleBtn() + themeToggleBtn() + '</div>' +
    '</div>' +
    logo() +
    '<h2 class="mt-4 text-[18px] font-bold" style="color:var(--tx);">' + (isReg ? (state.authRole==='BUYER'?t('createBuyerAcct'):t('createSupplierAcct')) : t('logIn')) + '</h2>' +
    '<div class="mt-4 flex rounded-lg p-1" style="background:var(--inset);">' +
      tab('login',t('logIn')) + tab('register',t('register')) +
    '</div>' +
    (isReg ? roleTabs() : '') +
    '<div class="mt-4 flex flex-col gap-3">' +
      (isReg ? field('companyName',t('companyName'), f.companyName, 'e.g. Gulf Traders WLL') : '') +
      (isReg ? field('registrationNumber',t('crNumber'), f.registrationNumber, 'e.g. 123456-1') : '') +
      (isReg ? field('country',t('country'), f.country, 'Bahrain') : '') +
      field('email',t('email'), f.email, 'you@company.com') +
      field('password',t('password'), f.password, '••••••••', 'password') +
      (isReg ? '<label class="flex items-start gap-2 mt-1"><input type="checkbox" data-field="consent" ' + (f.consent?'checked':'') + ' style="margin-top:3px;" /><span class="text-[12px]" style="color:var(--tx4);">I agree to the <a href="terms.html" target="_blank" style="color:var(--acc);text-decoration:underline;">Terms of Service</a> and <a href="privacy.html" target="_blank" style="color:var(--acc);text-decoration:underline;">Privacy Policy</a></span></label>' : '') +
    '</div>' +
    (state.authError ? '<div class="mt-3 rounded-lg px-3 py-2 text-[12px] font-semibold" style="background:var(--acc-soft); color:var(--acc);">' + esc(state.authError) + '</div>' : '') +
    '<button onclick="submitAuth()" ' + (state.authBusy?'disabled':'') + ' class="mt-5 w-full rounded-xl px-4 py-3 text-sm font-bold text-white" style="background:var(--acc); opacity:' + (state.authBusy?'0.6':'1') + ';">' + (state.authBusy ? t('pleaseWait') : (isReg ? t('createAccount') : t('logIn'))) + '</button>' +
  '</div></div>' + toastHtml();
}

function tab(mode, label){
  const active = state.authMode === mode;
  return '<button onclick="setAuthMode(\'' + mode + '\')" class="flex-1 rounded-md px-3 py-1.5 text-[12px] font-semibold" style="' + (active ? 'background:var(--panel); color:var(--tx); box-shadow:0 1px 2px rgba(0,0,0,.08);' : 'color:var(--tx4);') + '">' + label + '</button>';
}

function roleTabs(){
  return '<div class="mt-3 flex rounded-lg p-1" style="background:var(--inset);">' +
    '<button onclick="setAuthRole(\'BUYER\')" class="flex-1 rounded-md px-3 py-1.5 text-[12px] font-semibold" style="' + (state.authRole==='BUYER' ? 'background:var(--panel); color:var(--tx); box-shadow:0 1px 2px rgba(0,0,0,.08);' : 'color:var(--tx4);') + '">Buyer</button>' +
    '<button onclick="setAuthRole(\'SUPPLIER\')" class="flex-1 rounded-md px-3 py-1.5 text-[12px] font-semibold" style="' + (state.authRole==='SUPPLIER' ? 'background:var(--panel); color:var(--tx); box-shadow:0 1px 2px rgba(0,0,0,.08);' : 'color:var(--tx4);') + '">Supplier</button>' +
  '</div>';
}
function setAuthRole(role){ setState({ authRole: role }); }

function field(name, label, value, placeholder, type){
  return '<label class="flex flex-col gap-1.5">' +
    '<span class="text-[11px] font-semibold uppercase tracking-[0.08em]" style="color:var(--tx4);">' + label + '</span>' +
    '<input data-field="' + name + '" type="' + (type||'text') + '" value="' + esc(value) + '" placeholder="' + placeholder + '" class="w-full rounded-lg border px-3 py-2.5 text-sm outline-none" style="border-color:var(--bd); background:var(--inset); color:var(--tx);" />' +
  '</label>';
}

// ---------- Dashboard shell ----------

function renderDashboard(role){
  const isBuyer = role === 'buyer';
  const header = '<header class="sticky top-0 z-30 border-b backdrop-blur-xl" style="border-color:var(--bd); background:color-mix(in srgb, var(--bg) 90%, transparent);">' +
    '<div class="mx-auto flex max-w-[1220px] items-center justify-between gap-4 px-5 py-3.5">' + logo(isBuyer ? 'BUYER ACCOUNT' : 'SUPPLIER ACCOUNT') +
    '<div class="relative flex items-center gap-2.5">' +
      '<div class="hidden sm:block text-[13px] font-semibold mr-1" style="color:var(--tx3);">' + esc(state.company ? state.company.name : '') + '</div>' +
      verificationBadge() +
      (!isBuyer ? '<button onclick="openWalletModal()" class="mono rounded-lg border px-2.5 py-1.5 text-[12px] font-bold" style="border-color:var(--bd2); color:var(--acc);">' + (state.wallet ? Number(state.wallet.balance).toFixed(0) : '—') + ' credits</button>' : '') +
      notifBell() + langToggleBtn() + themeToggleBtn() +
      '<button onclick="logout()" class="rounded-lg px-3 py-1.5 text-[12px] font-semibold border" style="border-color:var(--bd2); color:var(--tx3);">' + t('signOut') + '</button>' +
    '</div></div></header>' +
    navBar(role);

  const body = state.section === 'profile' ? renderSettings()
    : state.section === 'orderDetail' ? renderOrderDetail()
    : state.section === 'catalog' ? (isBuyer ? renderNetwork() : renderSupplierCatalogPage())
    : state.section === 'rfqs' ? (isBuyer ? renderBuyerRfqsPage() : renderOpportunityFeedPage())
    : state.section === 'lpos' ? renderLpoManagement(isBuyer)
    : (isBuyer ? renderBuyerHub() : renderSupplierHub());

  return '<div>' + header + '<div class="mx-auto max-w-[1220px] px-5 py-8">' + (state.section === 'main' ? verificationBanner() : '') + body + '</div></div>' +
    renderModals() + renderWalletModal() + renderLightbox() + toastHtml();
}

function navBar(role){
  const isBuyer = role === 'buyer';
  const tabs = isBuyer
    ? [ ['main',t('navBuyerHub')], ['rfqs',t('navRfqs')], ['lpos',t('navLpo')], ['catalog',t('navNetwork')], ['profile',t('navSettings')] ]
    : [ ['main',t('navSupplierHub')], ['rfqs',t('navOpportunities')], ['catalog',t('navCatalog')], ['lpos',t('navOrdersLpos')], ['profile',t('navSettings')] ];
  const activeKey = state.section === 'orderDetail' ? 'lpos' : state.section;
  return '<div class="border-b" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="mx-auto flex max-w-[1220px] gap-1 px-5 overflow-x-auto">' +
      tabs.map(([key,label]) => '<button onclick="setSection(\'' + key + '\')" class="border-b-2 px-4 py-3 text-[13px] font-semibold whitespace-nowrap" style="' + (activeKey === key ? 'border-color:var(--acc); color:var(--tx);' : 'border-color:transparent; color:var(--tx4);') + '">' + label + '</button>').join('') +
    '</div></div>';
}

function statsBar(pairs){
  return '<div class="mb-6 grid grid-cols-2 sm:grid-cols-' + pairs.length + ' gap-3">' + pairs.map(([label,val,sub]) =>
    '<div class="rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
      '<div class="eyebrow" style="color:var(--tx4);">' + label + '</div>' +
      '<div class="mono mt-1.5 text-[22px] font-bold" style="color:var(--tx);">' + val + '</div>' +
      (sub ? '<div class="mt-0.5 text-[11.5px]" style="color:var(--tx4);">' + sub + '</div>' : '') +
    '</div>'
  ).join('') + '</div>';
}

// ---------- Buyer: Hub (overview) ----------

function renderBuyerHub(){
  const rfqs = state.rfqs || [];
  const active = rfqs.filter(r => r.status === 'PUBLISHED').length;
  const totalQuotes = rfqs.reduce((a,r) => a + (r._count ? r._count.quotes : 0), 0);
  const awarded = rfqs.filter(r => r.status === 'AWARDED').length;
  const openOrders = (state.orders||[]).filter(o => o.status !== 'COMPLETED').length;

  return '<div class="eyebrow mb-2">ZONE A · COMMAND HEADER</div>' +
  '<div class="flex flex-wrap items-start justify-between gap-4 mb-6">' +
    '<div><h1 class="text-[26px] font-extrabold" style="color:var(--tx); letter-spacing:-0.01em;">' + t('dashTitleBuyer') + '</h1>' +
    '<p class="mt-1 text-[13.5px] max-w-[520px]" style="color:var(--tx3);">' + t('dashSubBuyer') + '</p></div>' +
    '<button onclick="openPostRfq()" class="rounded-xl px-4 py-2.5 text-[13px] font-bold text-white shrink-0" style="background:var(--acc);">' + t('createRfq') + '</button>' +
  '</div>' +
  statsBar([[t('statActiveRfqs'), active], [t('statTotalQuotes'), totalQuotes], [t('statAwarded'), awarded], [t('statOpenOrders'), openOrders]]) +
  '<div class="flex items-center justify-between mb-4"><h2 class="text-[15px] font-bold" style="color:var(--tx);">' + t('recentRfqs') + '</h2><button onclick="setSection(\'rfqs\')" class="text-[12px] font-semibold" style="color:var(--acc);">' + t('viewAll') + '</button></div>' +
  (rfqs.length === 0 ? emptyState('No RFQs yet', 'Post your first request and suppliers will start quoting.') : rfqTable(rfqs.slice(0,5))) +
  '<div class="flex items-center justify-between mb-4 mt-8"><h2 class="text-[15px] font-bold" style="color:var(--tx);">' + t('recentOrders') + '</h2><button onclick="setSection(\'lpos\')" class="text-[12px] font-semibold" style="color:var(--acc);">' + t('viewAll') + '</button></div>' +
  renderOrdersList(false, 3);
}

function rfqTable(rfqs){
  return '<div class="overflow-x-auto rounded-xl border" style="border-color:var(--bd);"><table class="dtable" style="background:var(--panel);">' +
    '<thead><tr><th>RFQ title &amp; ID</th><th>Category</th><th>Bids received</th><th>Closing in</th><th>Status</th><th></th></tr></thead><tbody>' +
    rfqs.map(r => {
      const tl = timeLeftLabel(r.deadline);
      return '<tr>' +
        '<td><div class="flex items-center gap-2.5">' + avatarHtml(r.title, 30) + '<div><div class="font-semibold" style="color:var(--tx);">' + esc(r.title) + '</div><div class="mono text-[11px]" style="color:var(--tx4);">RFQ-' + esc(String(r.id).slice(-4).toUpperCase()) + '</div></div></div></td>' +
        '<td style="color:var(--tx3);">' + esc(r.category || 'General') + '</td>' +
        '<td><span class="mono font-semibold" style="color:var(--tx);">' + (r._count ? r._count.quotes : 0) + '</span></td>' +
        '<td class="mono" data-deadline="' + esc(r.deadline) + '" data-basecolor="var(--tx3)" style="color:' + (tl.urgent?'var(--acc)':'var(--tx3)') + ';">' + tl.label + '</td>' +
        '<td>' + statusPill(r.status) + '</td>' +
        '<td class="text-right"><button onclick="openCompare(\'' + r.id + '\')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold text-white" style="background:var(--acc);">Compare bids</button></td>' +
      '</tr>';
    }).join('') +
  '</tbody></table></div>';
}

function statusPill(status){
  const map = {
    PUBLISHED: ['background:var(--info-soft); color:var(--info);','Live'],
    DRAFT: ['background:var(--sunken); color:var(--tx3);','Draft'],
    AWARDED: ['background:var(--ok-soft); color:var(--ok);','Awarded'],
    CLOSED: ['background:var(--sunken); color:var(--tx4);','Closed']
  };
  const [style,label] = map[status] || ['background:var(--sunken); color:var(--tx3);', status];
  return '<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="' + style + '">' + label + '</span>';
}

function renderBuyerRfqsPage(){
  const rfqs = state.rfqs || [];
  return '<div class="flex items-center justify-between mb-6">' +
    '<div><div class="eyebrow mb-1.5">ALL REQUESTS</div><h1 class="text-[22px] font-extrabold" style="color:var(--tx);">Your RFQs</h1></div>' +
    '<button onclick="openPostRfq()" class="rounded-xl px-4 py-2.5 text-[13px] font-bold text-white" style="background:var(--acc);">+ Create new RFQ</button>' +
  '</div>' +
  (rfqs.length === 0 ? emptyState('No RFQs yet', 'Post your first request and suppliers will start quoting.') : rfqTable(rfqs));
}

// ---------- LPO Management (shared buyer/supplier, 6-stage tracker) ----------

function renderLpoManagement(isBuyer){
  const pending = (state.lpos || []).filter(l => l.status === 'ISSUED' && !isBuyer);
  const orders = state.orders || [];
  const liveCount = orders.filter(o => o.status !== 'COMPLETED').length + pending.length;
  return '<div class="eyebrow mb-1.5">CLOSED-LOOP TRACKER</div>' +
  '<h1 class="text-[24px] font-extrabold mb-2" style="color:var(--tx); letter-spacing:-0.01em;">LPO management</h1>' +
  '<p class="mb-5 text-[13.5px] max-w-[620px]" style="color:var(--tx3);">One pipeline shared by both sides of the deal — from digital LPO to payment confirmation, with a full message trail per order.</p>' +
  '<div class="inline-block mb-6 rounded-lg border px-3.5 py-2 mono text-[12px]" style="border-color:var(--bd); background:var(--inset); color:var(--tx3);">' + liveCount + ' live order(s)</div>' +
  '<div class="mb-6 flex flex-wrap gap-2">' + STAGES.map((s,i) => '<span class="chip" style="cursor:default;">' + (i+1) + ' &nbsp;' + s + '</span>').join('') + '</div>' +
  (!isBuyer ? renderAwaitingLpos() : '') +
  (orders.length === 0 && pending.length === 0 ? emptyState('No orders yet', isBuyer ? 'Orders are created once you award a supplier.' : 'Accepted purchase orders will appear here.') :
    '<div class="flex flex-col gap-3">' + orders.map(o => lpoTrackerRow(o, isBuyer)).join('') + '</div>');
}

function lpoTrackerRow(o, isBuyer){
  const title = o.lpo && o.lpo.rfq ? o.lpo.rfq.title : 'Order';
  const idLabel = 'LPO-' + esc(String(o.lpo ? o.lpo.id : o.id).slice(-4).toUpperCase());
  const counterparty = isBuyer ? (o.lpo && o.lpo.supplierCompany ? o.lpo.supplierCompany.name : '') : (o.lpo && o.lpo.buyerCompany ? o.lpo.buyerCompany.name : '');
  const idx = orderStageIndex(o);
  return '<div class="rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="flex flex-wrap items-center justify-between gap-3">' +
      '<div class="min-w-[220px]"><div class="font-bold" style="color:var(--tx);">' + esc(title) + '</div>' +
        '<div class="mono text-[11.5px] mt-0.5" style="color:var(--tx4);">' + idLabel + (counterparty ? ' · ' + esc(counterparty) : '') + '</div></div>' +
      '<div class="flex-1 min-w-[180px]">' + stageTrackerHtml(idx) + '<div class="mt-1.5 text-[11.5px] font-semibold" style="color:var(--tx3);">' + STAGES[idx-1] + ' &middot; Stage ' + idx + ' / 6</div></div>' +
      '<div class="mono font-bold text-[14px]" style="color:var(--tx);">' + fmt(o.lpo ? o.lpo.totalAmount : 0) + '</div>' +
      '<button onclick="openOrderDetail(\'' + o.id + '\')" class="rounded-lg px-3.5 py-2 text-[12px] font-bold text-white shrink-0" style="background:var(--acc);">Open order</button>' +
    '</div>' +
  '</div>';
}

function renderAwaitingLpos(){
  const pending = (state.lpos || []).filter(l => l.status === 'ISSUED');
  if (pending.length === 0) return '';
  return '<h2 class="text-[14px] font-bold mb-3" style="color:var(--tx);">Awaiting your acceptance</h2>' +
    '<div class="flex flex-col gap-3 mb-8">' + pending.map(l =>
      '<div class="flex items-center justify-between gap-3 rounded-xl border p-4" style="border-color:var(--bd); background:var(--acc-soft2);">' +
        '<div><div class="font-semibold" style="color:var(--tx);">' + esc(l.rfq ? l.rfq.title : 'Purchase order') + '</div>' +
        '<div class="mono mt-0.5 text-[12px]" style="color:var(--tx3);">' + fmt(l.totalAmount) + '</div></div>' +
        actionBtn('Accept order', "acceptLpo('" + l.id + "')", state.ordersBusyId === l.id) +
      '</div>').join('') + '</div>';
}

function renderOrdersList(isSupplier, limit){
  let orders = state.orders || [];
  if (limit) orders = orders.slice(0, limit);
  if (orders.length === 0) return emptyState('No orders yet', isSupplier ? 'Accepted purchase orders will appear here.' : 'Orders are created once you award a supplier.');
  return '<div class="flex flex-col gap-3">' + orders.map(o => lpoTrackerRow(o, !isSupplier)).join('') + '</div>';
}

function actionBtn(label, onclick, busy){
  return '<button onclick="' + (busy ? '' : onclick) + '" class="rounded-lg px-3 py-1.5 font-bold text-white" style="background:var(--acc); opacity:' + (busy?'0.6':'1') + ';">' + (busy ? 'Working…' : label) + '</button>';
}

// ---------- Buyer: Network (browse suppliers / catalog) ----------

function renderNetwork(){
  const items = state.catalog || [];
  return '<div class="eyebrow mb-1.5">SUPPLIER NETWORK</div>' +
  '<h1 class="mb-5 text-[22px] font-extrabold" style="color:var(--tx);">Browse suppliers</h1>' +
  (items.length === 0 ? emptyState('No catalog items yet', 'Suppliers will list products here as they join.') :
    '<div class="grid grid-cols-2 gap-3 sm:grid-cols-3">' + items.map(p =>
      '<div class="rounded-xl border p-3.5" style="border-color:var(--bd); background:var(--panel);">' +
        (p.imageUrl ? '<img src="' + p.imageUrl + '" onclick="openLightbox(' + jsAttr(p.imageUrl) + ')" class="mb-2.5 h-24 w-full rounded-lg object-cover border" style="border-color:var(--bd); cursor:zoom-in;" />' : '') +
        '<div class="flex items-center gap-2 mb-2">' + avatarHtml(p.supplierCompany ? p.supplierCompany.name : '?', 28) +
        '<div class="min-w-0"><div class="text-[11px] font-semibold truncate" style="color:var(--tx3);">' + esc(p.supplierCompany ? p.supplierCompany.name : '') + '</div></div></div>' +
        '<div class="text-[13px] font-semibold" style="color:var(--tx);">' + esc(p.name) + '</div>' +
        '<div class="mono mt-1.5 text-[12px] font-semibold" style="color:var(--tx2);">' + fmt(p.price) + ' / ' + esc(p.unit||'pcs') + '</div>' +
        '<button onclick="openPostRfq(' + jsAttr(p.name) + ')" class="mt-2.5 w-full rounded-lg px-2.5 py-1.5 text-[11px] font-bold text-white" style="background:var(--acc);">Request quote</button>' +
      '</div>'
    ).join('') + '</div>');
}

// ---------- Supplier: Hub (overview) ----------

function renderSupplierHub(){
  const rfqs = state.rfqs || [];
  const myCatalog = state.myCatalog || [];
  const activeOrders = (state.orders || []).filter(o => o.status !== 'COMPLETED').length;
  return '<div class="eyebrow mb-2">ZONE A · COMMAND HEADER</div>' +
  '<h1 class="text-[26px] font-extrabold mb-2" style="color:var(--tx); letter-spacing:-0.01em;">' + t('dashTitleSupplier') + '</h1>' +
  '<p class="mb-6 text-[13.5px] max-w-[560px]" style="color:var(--tx3);">' + t('dashSubSupplier') + '</p>' +
  statsBar([[t('statOpenRequests'), rfqs.length], [t('statCatalogItems'), myCatalog.length], [t('statActiveOrders'), activeOrders]]) +
  '<div class="flex items-center justify-between mb-4"><h2 class="text-[15px] font-bold" style="color:var(--tx);">' + t('opportunityFeed') + '</h2><button onclick="setSection(\'rfqs\')" class="text-[12px] font-semibold" style="color:var(--acc);">' + t('viewAll') + '</button></div>' +
  (rfqs.length === 0 ? emptyState('No open requests right now', 'Check back soon — new RFQs appear here as buyers post them.') :
    '<div class="flex flex-col gap-3 mb-4">' + rfqs.slice(0,3).map(opportunityCard).join('') + '</div>') +
  '<div class="flex items-center justify-between mb-4 mt-8"><h2 class="text-[15px] font-bold" style="color:var(--tx);">' + t('ordersInProgress') + '</h2><button onclick="setSection(\'lpos\')" class="text-[12px] font-semibold" style="color:var(--acc);">' + t('viewAll') + '</button></div>' +
  renderOrdersList(true, 3);
}

function opportunityCard(r){
  const tl = timeLeftLabel(r.deadline);
  const quoted = state.quotedIds.has(r.id);
  return '<div class="rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="flex flex-wrap items-center gap-4">' +
      avatarHtml(r.buyerCompany ? r.buyerCompany.name : r.title, 40) +
      '<div class="flex-1 min-w-[200px]">' +
        '<div class="font-bold text-[14.5px]" style="color:var(--tx);">' + esc(r.title) + '</div>' +
        '<div class="mono text-[11.5px] mt-0.5" style="color:var(--tx4);">RFQ-' + esc(String(r.id).slice(-4).toUpperCase()) + ' &middot; Verified buyer &middot; ' + esc(r.category || 'General') + '</div>' +
      '</div>' +
      '<div><div class="eyebrow" style="color:var(--tx4);">QUANTITY</div><div class="mono text-[13px] font-bold" style="color:var(--tx);">' + esc(r.quantity||'—') + ' ' + esc(r.unit||'') + '</div></div>' +

// ---------- Order detail ----------

function renderOrderDetail(){
  if (state.orderDetailLoading) return '<div class="py-16 text-center text-[13px]" style="color:var(--tx4);">Loading…</div>';
  const d = state.orderDetail;
  if (!d || !d.order) return emptyState('Order not found', 'Go back and try again.');
  const order = d.order, rfq = d.rfq;
  const lpo = order.lpo || {};
  const delivery = order.delivery || {};
  const invoice = order.invoice || {};
  const isSupplier = state.company && state.company.type === 'SUPPLIER';
  const idx = orderStageIndex(order);

  let deliveryAction = '';
  if (isSupplier) {
    if (delivery.status === 'PENDING') deliveryAction = actionBtn('Mark dispatched', "updateDelivery('" + order.id + "','DISPATCHED')", state.ordersBusyId === order.id);
    else if (delivery.status === 'DISPATCHED') deliveryAction = actionBtn('Mark delivered', "updateDelivery('" + order.id + "','DELIVERED')", state.ordersBusyId === order.id);
  }
  let payAction = '';
  if (!isSupplier && invoice.id && (invoice.status === 'ISSUED' || invoice.status === 'PARTIALLY_PAID')) {
    payAction = actionBtn('Pay ' + fmt(invoice.amount), "payInvoice('" + invoice.id + "'," + Number(invoice.amount) + ")", state.ordersBusyId === invoice.id);
  }

  return '<button onclick="closeOrderDetail()" class="mb-4 text-[12px] font-semibold" style="color:var(--tx4);">&larr; Back to LPO management</button>' +
  '<div class="eyebrow mb-1.5">ORDER · ' + esc(order.status) + '</div>' +
  '<h1 class="mb-4 text-[22px] font-extrabold" style="color:var(--tx);">' + esc(rfq ? rfq.title : 'Order') + '</h1>' +
  '<div class="rounded-xl border p-4 mb-6" style="border-color:var(--bd); background:var(--panel);">' +
    stageTrackerHtml(idx) +
    '<div class="mt-2 flex items-center justify-between">' +
      '<div class="text-[12.5px] font-semibold" style="color:var(--tx3);">' + STAGES[idx-1] + ' &middot; Stage ' + idx + ' / 6</div>' +
      '<div class="flex gap-2">' + deliveryAction + payAction + '</div>' +
    '</div>' +
  '</div>' +
  '<div class="grid gap-4 sm:grid-cols-2">' +
    detailCard('Request', [
      ['Quantity', rfq ? (rfq.quantity || '—') + ' ' + (rfq.unit || '') : '—'],
      ['Needed by', rfq && rfq.deadline ? new Date(rfq.deadline).toLocaleDateString() : '—'],
      ['Description', rfq ? rfq.description : '—']
    ]) +
    detailCard('Purchase order', [
      ['Amount', fmt(lpo.totalAmount)],
      ['Terms', lpo.terms || '—'],
      ['Status', lpo.status || '—']
    ]) +
    detailCard('Delivery', [
      ['Status', delivery.status || '—'],
      ['Tracking', delivery.trackingInfo || '—'],
      ['Dispatched', delivery.dispatchedAt ? new Date(delivery.dispatchedAt).toLocaleString() : '—'],
      ['Delivered', delivery.deliveredAt ? new Date(delivery.deliveredAt).toLocaleString() : '—']
    ]) +
    detailCard('Invoice', [
      ['Amount', invoice.amount ? fmt(invoice.amount) : '—'],
      ['Status', invoice.status || '—'],
      ['Payments', (invoice.payments||[]).length ? invoice.payments.map(p => fmt(p.amount) + ' · ' + p.status).join(', ') : '—']
    ]) +
  '</div>' +
  renderChatPanel();
}

function renderChatPanel(){
  const msgs = state.chatMessages || [];
  const myCompanyId = state.company ? state.company.id : null;
  return '<div class="mt-6 rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="mb-3 text-[13px] font-bold" style="color:var(--tx);">Messages</div>' +
    '<div class="mb-3 flex max-h-[280px] flex-col gap-2 overflow-y-auto bx-scroll pr-1">' +
    (msgs.length === 0 ? '<div class="py-6 text-center text-[12px]" style="color:var(--tx4);">No messages yet — say hello.</div>' :
      msgs.map(m => {
        const mine = m.senderCompanyId === myCompanyId;
        return '<div class="flex ' + (mine ? 'justify-end' : 'justify-start') + '">' +
          '<div class="max-w-[75%] rounded-xl px-3 py-2 text-[13px]" style="' + (mine ? 'background:var(--acc); color:white;' : 'background:var(--inset); color:var(--tx2);') + '">' +
            (!mine ? '<div class="mb-0.5 text-[10px] font-semibold opacity-70">' + esc(m.senderCompany ? m.senderCompany.name : '') + '</div>' : '') +
            esc(m.body) +
          '</div></div>';
      }).join('')) +
    '</div>' +
    '<div class="flex gap-2">' +
      '<input data-chat="draft" type="text" value="' + esc(state.chatDraft) + '" placeholder="Type a message…" class="flex-1 rounded-lg border px-3 py-2 text-sm outline-none" style="border-color:var(--bd); background:var(--inset); color:var(--tx);" />' +
      '<button onclick="sendChatMessage()" ' + (state.chatBusy?'disabled':'') + ' class="rounded-lg px-4 py-2 text-[12px] font-bold text-white" style="background:var(--acc); opacity:' + (state.chatBusy?'0.6':'1') + ';">Send</button>' +
    '</div>' +
  '</div>';
}

function detailCard(title, rows){

    '<div class="mb-3 text-[13px] font-bold" style="color:var(--tx);">' + title + '</div>' +

          '</div>').join('')) +

function verificationBadge(){
  const st = state.company ? state.company.verificationStatus : null;
  if (!st) return '';
  const styles = {
    PENDING: 'background:var(--warn-soft); color:var(--warn);',
    IN_REVIEW: 'background:var(--info-soft); color:var(--info);',
    VERIFIED: 'background:var(--ok-soft); color:var(--ok);',
    REJECTED: 'background:var(--bad-soft); color:var(--bad);'
  };
  const labels = { PENDING:'Not verified', IN_REVIEW:'In review', VERIFIED:'Verified', REJECTED:'Rejected' };
  return '<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="' + (styles[st]||'') + '">' + (labels[st]||st) + '</span>';
}

function verificationBanner(){
  const st = state.company ? state.company.verificationStatus : null;
  if (!st || st === 'VERIFIED' || st === 'IN_REVIEW') return '';
  return '<div class="mb-6 flex items-center justify-between gap-3 rounded-xl border p-4" style="border-color:var(--bd); background:var(--acc-soft2);">' +
    '<div class="text-[13px] font-semibold" style="color:var(--tx);">' + (st === 'REJECTED' ? 'Your verification was rejected — submit a new document.' : 'Verify your company via Sijillat to build trust with counterparties.') + '</div>' +
    '<button onclick="openVerifyModal()" class="rounded-lg px-3.5 py-2 text-[12px] font-bold text-white shrink-0" style="background:var(--acc);">Submit document</button>' +
  '</div>';
}

      '<button onclick="logout()" class="rounded-lg px-3 py-1.5 text-[12px] font-semibold border" style="border-color:var(--bd2); color:var(--tx3);">' + t('signOut') + '</button>' +
    '</div></div></header>';

  '<div class="flex flex-wrap gap-2 mb-5">' + filters.map(f =>

  ).join('') + '</div>' +
  (list.length === 0 ? emptyState('No companies here', 'Nothing matches this filter yet.') :
    '<div class="flex flex-col gap-3">' + list.map(c =>
      '<div class="flex items-center justify-between gap-3 rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
        '<div class="flex items-center gap-3">' + avatarHtml(c.name, 36) +
        '<div><div class="font-semibold" style="color:var(--tx);">' + esc(c.name) + '</div>' +
        '<div class="mono mt-0.5 text-[12px]" style="color:var(--tx3);">' + esc(c.type) + ' &middot; CR: ' + esc(c.registrationNumber || '—') + ' &middot; ' + (c.documents ? c.documents.length : 0) + ' document(s) &middot; ' + esc(c.user ? c.user.email : '') + '</div></div></div>' +
        '<div class="flex items-center gap-2 shrink-0">' +
          '<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="' + ({PENDING:'background:var(--warn-soft); color:var(--warn);', IN_REVIEW:'background:var(--info-soft); color:var(--info);', VERIFIED:'background:var(--ok-soft); color:var(--ok);', REJECTED:'background:var(--bad-soft); color:var(--bad);'}[c.verificationStatus]||'') + '">' + c.verificationStatus + '</span>' +
          (c.verificationStatus !== 'VERIFIED' ? actionBtn('Verify', "setCompanyVerification('" + c.id + "','VERIFIED')", state.adminBusyId===c.id) : '') +
          (c.verificationStatus !== 'REJECTED' ? '<button onclick="setCompanyVerification(\'' + c.id + '\',\'REJECTED\')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold border" style="border-color:var(--bd2); color:var(--tx3);">Reject</button>' : '') +
          '<button onclick="openResetModal(\'' + c.id + '\')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold border" style="border-color:var(--bd2); color:var(--tx3);">Reset password</button>' +

  return '<div>' + header + '<div class="mx-auto max-w-[1220px] px-5 py-8">' + body + '</div></div>' + renderResetModal() + renderDeleteModal() + toastHtml();

function renderResetModal(){
  if (!state.showResetModal) return '';
  const c = (state.adminCompanies || []).find(x => x.id === state.showResetModal);
  return '<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">' +
    '<div class="bx-rise w-full max-w-sm rounded-2xl border p-6 shadow-2xl" style="border-color:var(--bd); background:var(--panel);">' +
      '<div class="flex items-center justify-between"><h3 class="text-lg font-bold" style="color:var(--tx);">Reset password</h3>' +
      '<button onclick="closeResetModal()" class="text-[13px] font-semibold" style="color:var(--tx4);">Close</button></div>' +
      (!state.resetResult ?
        '<p class="mt-4 text-[13px]" style="color:var(--tx3);">This generates a new temporary password for <b style="color:var(--tx);">' + esc(c ? c.name : '') + '</b>. Their old password will stop working immediately.</p>' +
        '<button onclick="confirmResetPassword()" ' + (state.resetBusy?'disabled':'') + ' class="mt-5 w-full rounded-xl px-4 py-3 text-sm font-bold text-white" style="background:var(--acc); opacity:' + (state.resetBusy?'0.6':'1') + ';">' + (state.resetBusy ? 'Generating…' : 'Generate new password') + '</button>'
        :
        '<p class="mt-4 text-[13px]" style="color:var(--tx3);">Share this temporary password with the company directly (phone, WhatsApp). It will not be shown again.</p>' +
        '<div class="mono mt-3 rounded-lg border p-3 text-center text-[16px] font-bold" style="border-color:var(--bd); background:var(--inset); color:var(--tx);">' + esc(state.resetResult) + '</div>'
      ) +
    '</div></div>';
}

function renderDeleteModal(){
  if (!state.showDeleteModal) return '';
  return '<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">' +
    '<div class="bx-rise w-full max-w-sm rounded-2xl border p-6 shadow-2xl" style="border-color:var(--bd); background:var(--panel);">' +
      '<div class="flex items-center justify-between"><h3 class="text-lg font-bold" style="color:var(--bad);">Delete company</h3>' +
      '<button onclick="closeDeleteModal()" class="text-[13px] font-semibold" style="color:var(--tx4);">Close</button></div>' +
      '<p class="mt-4 text-[13px]" style="color:var(--tx3);">Are you sure you want to permanently delete <b style="color:var(--tx);">' + esc(state.deleteCompanyName) + '</b>? This will remove the company, its user, RFQs, quotes, orders, and all related data. This cannot be undone.</p>' +
      '<div class="mt-5 flex gap-2">' +
        '<button onclick="closeDeleteModal()" class="flex-1 rounded-xl border px-4 py-2.5 text-sm font-bold" style="border-color:var(--bd2); color:var(--tx);">Cancel</button>' +
        '<button onclick="confirmDeleteCompany()" ' + (state.deleteBusy?'disabled':'') + ' class="flex-1 rounded-xl px-4 py-2.5 text-sm font-bold text-white" style="background:var(--bad); opacity:' + (state.deleteBusy?'0.6':'1') + ';">' + (state.deleteBusy ? 'Deleting…' : 'Yes, delete') + '</button>' +
      '</div>' +
    '</div></div>';
}

function emptyState(title, body){
  return '<div class="rounded-xl border border-dashed p-10 text-center" style="border-color:var(--bd2);">' +
    '<div class="font-semibold" style="color:var(--tx);">' + title + '</div>' +
    '<div class="mt-1 text-[13px]" style="color:var(--tx4);">' + body + '</div></div>';
}

// ---------- Modals (post RFQ, compare, submit quote, catalog add, verify doc) ----------

function renderModals(){
  let html = '';
  if (state.showPostRfq) {
    const r = state.newRfq;
    html += modalWrap('Post an RFQ', 'closePostRfq()',
      field('title','What do you need', r.title, 'e.g. 200 office chairs') +
      '<label class="flex flex-col gap-1.5"><span class="text-[11px] font-semibold uppercase tracking-[0.08em]" style="color:var(--tx4);">Category</span>' +
      '<select data-select="category" class="w-full rounded-lg border px-3 py-2.5 text-sm outline-none" style="border-color:var(--bd); background:var(--inset); color:var(--tx);">' +
        CATEGORIES.map(c => '<option value="' + esc(c) + '"' + (r.category===c?' selected':'') + '>' + c + '</option>').join('') +
      '</select></label>' +
      field('quantity','Quantity', r.quantity, 'e.g. 200') +
      field('unit','Unit', r.unit, 'pcs') +
      field('budget','Budget (BHD) — suppliers pay 5% of this to bid', r.budget, 'e.g. 500') +
      '<label class="flex flex-col gap-1.5"><span class="text-[11px] font-semibold uppercase tracking-[0.08em]" style="color:var(--tx4);">Needed by</span>' +
      '<input data-field="deadline" type="date" value="' + esc(r.deadline) + '" class="w-full rounded-lg border px-3 py-2.5 text-sm outline-none" style="border-color:var(--bd); background:var(--inset); color:var(--tx);" /></label>',
      'submitNewRfq()', state.postBusy ? 'Posting…' : 'Post RFQ to suppliers', state.postBusy);
  }
  if (state.compareRfqId) {
    const q = state.compareQuotes;
    html += '<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">' +
      '<div class="bx-rise w-full max-w-lg rounded-2xl border p-6 shadow-2xl" style="border-color:var(--bd); background:var(--panel);">' +
        '<div class="flex items-center justify-between"><h3 class="text-lg font-bold" style="color:var(--tx);">Quotes</h3>' +
        '<button onclick="closeCompare()" class="text-[13px] font-semibold" style="color:var(--tx4);">Close</button></div>' +
        '<div class="mt-4 flex flex-col gap-2.5 bx-scroll max-h-[340px] overflow-y-auto pr-1">' +
        (state.compareLoading ? '<div class="text-[13px] py-6 text-center" style="color:var(--tx4);">Loading…</div>' :
          q.length === 0 ? '<div class="rounded-xl border border-dashed p-6 text-center text-[13px]" style="border-color:var(--bd2); color:var(--tx4);">No quotes yet.</div>' :
          q.map(x => '<div class="flex items-center justify-between gap-3 rounded-xl border p-3.5" style="border-color:var(--bd); background:var(--inset);">' +
            '<div class="flex items-center gap-2.5">' + avatarHtml(x.supplierCompany ? x.supplierCompany.name : '?', 32) +
            '<div><div class="text-sm font-semibold" style="color:var(--tx);">' + esc(x.supplierCompany ? x.supplierCompany.name : '') + '</div>' +
            '<div class="mono mt-0.5 text-[12px]" style="color:var(--tx3);">' + fmt(x.price) + ' &middot; ' + x.deliveryTimeDays + 'd</div></div></div>' +
            (x.status === 'AWARDED'
              ? '<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="background:var(--ok-soft); color:var(--ok);">Awarded</span>'
              : x.status === 'REJECTED'
                ? '<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="background:var(--bad-soft); color:var(--bad);">Rejected</span>'
                : '<button onclick="acceptQuote(\'' + x.id + '\')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold text-white" style="background:var(--acc);">Award</button>')
          + '</div>').join('')
        ) +
        '</div></div></div>';
  }
  if (state.submitQuoteRfqId) {
    const f = state.quoteForm;
    const rfqForQuote = (state.rfqs || []).find(r => r.id === state.submitQuoteRfqId);
    const hasBudget = rfqForQuote && rfqForQuote.budget;
    const fee = hasBudget ? Number(rfqForQuote.budget) * 0.05 : null;
    html += modalWrap('Submit quote', 'closeSubmitQuote()',
      (hasBudget
        ? '<div class="rounded-lg px-3 py-2.5 text-[12.5px]" style="background:var(--acc-soft2); color:var(--tx2);">Submitting a quote costs <b class="mono">' + fee.toFixed(3) + ' BHD</b> (5% of this RFQ\'s ' + fmt(rfqForQuote.budget) + ' budget), deducted from your wallet.</div>'
        : '<div class="rounded-lg px-3 py-2.5 text-[12.5px]" style="background:var(--bad-soft); color:var(--bad);">This RFQ has no budget set by the buyer, so a bid fee can\'t be calculated — you won\'t be able to submit a quote on it.</div>') +
      field('price','Unit price (BHD)', f.price, '5.800') +
      field('days','Delivery (days)', f.days, '2'),
      'submitQuote()', state.quoteBusy ? 'Submitting…' : 'Submit quote', state.quoteBusy || !hasBudget);
  }
  if (state.showCatalogAdd) {
    const p = state.newProduct;
    html += modalWrap('Add catalog item', 'closeCatalogAdd()',
      '<label class="flex flex-col gap-1.5"><span class="text-[11px] font-semibold uppercase tracking-[0.08em]" style="color:var(--tx4);">Product photo (optional)</span>' +
      (p.imageUrl
        ? '<div class="flex items-center gap-3"><img src="' + p.imageUrl + '" onclick="openLightbox(' + jsAttr(p.imageUrl) + ')" class="h-16 w-16 rounded-lg object-cover border" style="border-color:var(--bd); cursor:zoom-in;" /><div class="flex-1 min-w-0"><div class="text-[12px] font-semibold truncate" style="color:var(--tx);">' + esc(state.catalogPhotoName) + '</div><button onclick="removeCatalogPhoto()" class="text-[11px] font-semibold" style="color:var(--tx4);">Remove photo</button></div></div>'
        : '<input data-catalog-photo type="file" accept="image/*" class="w-full rounded-lg border px-3 py-2.5 text-sm outline-none" style="border-color:var(--bd); background:var(--inset); color:var(--tx);" />') +
      (state.catalogPhotoBusy ? '<span class="text-[12px]" style="color:var(--tx4);">Reading photo…</span>' : '') +
      '</label>' +
      field('name','Item name', p.name, 'e.g. A4 Paper Box') +
      '<label class="flex flex-col gap-1.5"><span class="text-[11px] font-semibold uppercase tracking-[0.08em]" style="color:var(--tx4);">Unit</span>' +
      '<select data-select="unit" class="w-full rounded-lg border px-3 py-2.5 text-sm outline-none" style="border-color:var(--bd); background:var(--inset); color:var(--tx);">' +
        ['kg','pcs','box','carton','litre','ton'].map(u => '<option value="' + u + '"' + (p.unit===u?' selected':'') + '>' + u + '</option>').join('') +
      '</select></label>' +
      field('price','Price per unit (BHD)', p.price, '3.500'),
      'addProduct()', 'Add item', false);
  }
  if (state.showVerifyModal) {
    const v = state.verifyForm;
    html += modalWrap('Submit verification document', 'closeVerifyModal()',
      '<label class="flex flex-col gap-1.5"><span class="text-[11px] font-semibold uppercase tracking-[0.08em]" style="color:var(--tx4);">Document type</span>' +
      '<select data-select="docType" class="w-full rounded-lg border px-3 py-2.5 text-sm outline-none" style="border-color:var(--bd); background:var(--inset); color:var(--tx);">' +
        '<option value="TRADE_LICENSE"' + (v.docType==='TRADE_LICENSE'?' selected':'') + '>Trade license</option>' +
        '<option value="CR_CERTIFICATE"' + (v.docType==='CR_CERTIFICATE'?' selected':'') + '>Commercial registration</option>' +
        '<option value="OTHER"' + (v.docType==='OTHER'?' selected':'') + '>Other</option>' +
      '</select></label>' +
      '<label class="flex flex-col gap-1.5"><span class="text-[11px] font-semibold uppercase tracking-[0.08em]" style="color:var(--tx4);">File (PDF or image, max 2MB)</span>' +
      '<input data-verify-file type="file" accept="application/pdf,image/*" class="w-full rounded-lg border px-3 py-2.5 text-sm outline-none" style="border-color:var(--bd); background:var(--inset); color:var(--tx);" />' +
      (state.verifyFileBusy ? '<span class="text-[12px]" style="color:var(--tx4);">Reading file…</span>' : '') +
      (v.fileUrl && state.verifyFileName ? '<span class="text-[12px] font-semibold" style="color:var(--acc);">✓ ' + esc(state.verifyFileName) + ' ready to submit</span>' : '') +
      '</label>',
      'submitVerifyDoc()', state.verifyBusy ? 'Submitting…' : 'Submit for review', state.verifyBusy || state.verifyFileBusy || !v.fileUrl);
  }
  return html;
}

function modalWrap(title, onClose, fieldsHtml, onSubmit, submitLabel, busy){
  return '<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">' +
    '<div class="bx-rise w-full max-w-sm rounded-2xl border p-6 shadow-2xl" style="border-color:var(--bd); background:var(--panel);">' +
      '<div class="flex items-center justify-between"><h3 class="text-lg font-bold" style="color:var(--tx);">' + title + '</h3>' +
      '<button onclick="' + onClose + '" class="text-[13px] font-semibold" style="color:var(--tx4);">Close</button></div>' +
      '<div class="mt-4 flex flex-col gap-4">' + fieldsHtml + '</div>' +
      '<button onclick="' + onSubmit + '" ' + (busy?'disabled':'') + ' class="mt-6 w-full rounded-xl px-4 py-3 text-sm font-bold text-white" style="background:var(--acc); opacity:' + (busy?'0.6':'1') + ';">' + submitLabel + '</button>' +
    '</div></div>';
}

function bindEvents(){
  document.querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener('input', (e) => {
      const f = el.getAttribute('data-field');
      if (state.view === 'auth') { if (f === 'consent') state.authForm.consent = e.target.checked; else state.authForm[f] = e.target.value; }
      else if (state.showPostRfq && ['title','quantity','unit','deadline','budget'].includes(f)) state.newRfq[f] = e.target.value;
      else if (state.submitQuoteRfqId && ['price','days'].includes(f)) state.quoteForm[f] = e.target.value;
      else if (state.showCatalogAdd && ['name','price'].includes(f)) state.newProduct[f] = e.target.value;
      else if (state.showVerifyModal && f === 'fileUrl') state.verifyForm.fileUrl = e.target.value;
    });
  });
  document.querySelectorAll('[data-profile]').forEach(el => {
    el.addEventListener('input', (e) => { state.profileForm[el.getAttribute('data-profile')] = e.target.value; });
  });
  document.querySelectorAll('[data-select]').forEach(el => {
    el.addEventListener('change', (e) => {
      const f = el.getAttribute('data-select');
      if (state.showVerifyModal && f === 'docType') state.verifyForm.docType = e.target.value;
      else if (state.showPostRfq && f === 'category') state.newRfq.category = e.target.value;
      else if (state.showCatalogAdd && f === 'unit') state.newProduct.unit = e.target.value;
    });
  });
  const catalogPhotoInput = document.querySelector('[data-catalog-photo]');
  if (catalogPhotoInput) catalogPhotoInput.addEventListener('change', onCatalogPhotoChange);
  document.querySelectorAll('[data-chat]').forEach(el => {
    el.addEventListener('input', (e) => { state.chatDraft = e.target.value; });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !state.chatBusy) sendChatMessage(); });
  });
  document.querySelectorAll('[data-changepw]').forEach(el => {
    el.addEventListener('input', (e) => { state.changePwForm[el.getAttribute('data-changepw')] = e.target.value; });
  });
  const fileInput = document.querySelector('[data-verify-file]');
  if (fileInput) fileInput.addEventListener('change', onVerifyFileChange);
}

async function onVerifyFileChange(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast('File must be under 2MB.'); e.target.value = ''; return; }
  setState({ verifyFileBusy: true });
  const reader = new FileReader();
  reader.onload = () => {
    state.verifyForm.fileUrl = reader.result;
    setState({ verifyFileName: file.name, verifyFileBusy: false });
  };
  reader.onerror = () => { setState({ verifyFileBusy: false }); showToast('Could not read file.'); };
  reader.readAsDataURL(file);
}

// ---------- Init ----------
initTheme();
initLang();
loadSession();
render();
if (state.token) { if (state.view === 'admin') refreshAdminCompanies(); else refreshAll(); }

// Tick countdown timers every second WITHOUT re-rendering the whole page (avoids flicker):
// only the text/color of elements carrying a deadline is updated in place.
function tickCountdowns(){
  document.querySelectorAll('[data-deadline]').forEach(el => {
    const tl = timeLeftLabel(el.getAttribute('data-deadline'));
    el.textContent = tl.label;
    el.style.color = tl.urgent ? 'var(--acc)' : (el.getAttribute('data-basecolor') || '');
  });
}
setInterval(tickCountdowns, 1000);

// Keep RFQs / orders / notifications / chat fresh without requiring a relogin
setInterval(() => {
  if (!state.token) return;
  if (state.view === 'buyer' || state.view === 'supplier') {
    refreshRfqs();
    refreshOrders();
    refreshLpos();
    refreshNotifications();
    if (state.section === 'orderDetail' && state.selectedOrderId) refreshChat(state.selectedOrderId);
  } else if (state.view === 'admin') {
    refreshAdminCompanies();
  }
}, 8000);

document.addEventListener('visibilitychange', () => {
  if (document.hidden || !state.token) return;
  if (state.view === 'buyer' || state.view === 'supplier') refreshAll();
  else if (state.view === 'admin') refreshAdminCompanies();
});
</script>
