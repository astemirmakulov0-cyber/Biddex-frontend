<!DOCTYPE html>

<meta charset="utf-8">
<script>
/* Runs before any CSS is parsed: the first paint is already in the right theme and role accent (no flash), and
   theme-color matches the page background. Theme: saved choice, else the OS setting. Role: from the saved session
   (signed-out screens use the buyer accent); index.html keeps data-role in sync afterwards. */
(function () {
  var d = document.documentElement, th = null, role = 'buyer', stored = false;
  try { th = localStorage.getItem('biddex_theme'); } catch (e) {}
  if (th === 'dark' || th === 'light') stored = true;
  else th = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  d.setAttribute('data-theme', th);
  try { var ses = JSON.parse(localStorage.getItem('biddex_session') || 'null'); if (ses && ses.company && ses.company.type === 'SUPPLIER') role = 'supplier'; } catch (e) {}
  d.setAttribute('data-role', role);
  var m = document.createElement('meta'); m.name = 'theme-color'; m.content = th === 'dark' ? '#141311' : '#FAF7F2'; document.head.appendChild(m);
  if (!stored && window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)'), follow = function (e) {
      var sv = null; try { sv = localStorage.getItem('biddex_theme'); } catch (x) {}
      if (sv === 'dark' || sv === 'light') return;
      d.setAttribute('data-theme', e.matches ? 'dark' : 'light'); m.setAttribute('content', e.matches ? '#141311' : '#FAF7F2');
    };
    if (mq.addEventListener) mq.addEventListener('change', follow); else if (mq.addListener) mq.addListener(follow);
  }
})();
</script>

<style>
  /* Brand "Mix 1": warm light by default, dark on request. The accent follows the role: <html data-role="buyer|supplier">
     switches only --acc / --acc-soft / --acc-ink / --on-acc (admin and signed-out screens use the buyer accent). */
  :root {
    color-scheme:light;
    --bg:#FAF7F2; --panel:#FFFFFF; --tx:#1B1A17; --tx2:#6B665E; --line:#ECE6DC;
    --danger:#B42318; --danger-soft:#FDECEA;
    --pend:#8A4A0B; --pend-soft:#FCEFD9;               /* waiting / awarded pills, both roles */
    --acc:#0F766E; --acc-soft:#E3F2EF; --acc-ink:#0B5A54; --on-acc:#FFFFFF; --logo-base:#1B1A17;
    /* names used throughout the markup, mapped onto the tokens above */
    --bd:var(--line); --bd2:#DDD5C7;
    --tx3:var(--tx2); --tx4:var(--tx2);
    --inset:#F6F2EA; --sunken:#F0EADF;
    --acc-soft2:color-mix(in srgb, var(--acc-soft) 55%, transparent);
    --ok:var(--acc-ink); --ok-soft:var(--acc-soft);
    --warn:var(--pend); --warn-soft:var(--pend-soft);
    --info:var(--acc-ink); --info-soft:var(--acc-soft);
    --bad:var(--danger); --bad-soft:var(--danger-soft);
  }
  :root[data-role="supplier"] { --acc:#B45309; --acc-soft:#FCEFD9; --acc-ink:#8A4A0B; }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#141311; --panel:#1D1B18; --tx:#F3EFE8; --tx2:#A59E92; --line:#2E2A25;
    --danger:#F97066; --danger-soft:#3A1A17;
    --pend:#F6C98A; --pend-soft:#3A2A14;
    --acc:#34B3A2; --acc-soft:#16312D; --acc-ink:#8FE0D3; --on-acc:#0B1F1C;
    --bd2:#3D3730; --inset:#181614; --sunken:#26221E; --logo-base:#FAF7F2;
  }
  :root[data-theme="dark"][data-role="supplier"] { --acc:#F0A24A; --acc-soft:#3A2A14; --acc-ink:#F6C98A; --on-acc:#2A1805; }
  body { margin:0; font-family:"Readex Pro", system-ui, sans-serif; background:var(--bg); color:var(--tx2); -webkit-font-smoothing:antialiased; }
  a { color:var(--acc); text-decoration:none; }
  /* Headings and big numbers: Bricolage Grotesque (Latin only; Arabic falls through to Readex Pro). Everything else Readex Pro.
     .mono keeps its name but is now just tabular figures; a real monospace is only for ids (.bx-id, e.g. RFQ-5E68). */
  h1, h2, h3, .font-extrabold, .bx-display { font-family:"Bricolage Grotesque", "Readex Pro", system-ui, sans-serif; letter-spacing:-0.02em; }
  .mono { font-family:inherit; font-variant-numeric:tabular-nums; letter-spacing:0; }
  .bx-id { font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:.94em; letter-spacing:0; }
  input, select, textarea { font-family:inherit; }
  /* iOS Safari zooms the page in on focus if the focused field renders below 16px — regardless of what
     any individual field's own text-sm/text-[12px] class says. Scoped to mobile so desktop keeps the
     smaller, denser sizes those classes were chosen for. */
  @media (max-width: 639px) {
    /* !important: a plain tag selector is weaker than any of the text-sm/text-[12px]/etc. utility
       classes these fields carry, which would otherwise win regardless of source order. */
    input, select, textarea { font-size: 16px !important; }
  }
  @keyframes bxRise { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:translateY(0);} }
  .bx-rise { animation:bxRise .25s cubic-bezier(.22,1,.36,1) both; }
  .bx-scroll::-webkit-scrollbar { width:8px; height:8px; }
  .bx-scroll::-webkit-scrollbar-thumb { background:var(--sunken); border-radius:99px; }
  /* Faint left/right fade on a horizontally scrollable strip (e.g. the mobile nav tabs), hinting there's
     more to scroll to; the fade is drawn with the strip's own background so it works in both themes and
     naturally sits flush against a scrolled-to edge (background-attachment:local scrolls with the content,
     the two darker accent slivers stay fixed to the viewport edges). No JS: pure background-layer trick. */
  .bx-edge-fade {
    background-image:
      linear-gradient(to right, var(--panel) 0, rgba(0,0,0,0) 28px),
      linear-gradient(to left, var(--panel) 0, rgba(0,0,0,0) 28px),
      linear-gradient(to right, rgba(0,0,0,.16) 0, rgba(0,0,0,0) 10px),
      linear-gradient(to left, rgba(0,0,0,.16) 0, rgba(0,0,0,0) 10px);
    background-repeat: no-repeat;
    background-size: 28px 100%, 28px 100%, 10px 100%, 10px 100%;
    background-position: left, right, left, right;
    background-attachment: local, local, scroll, scroll;
  }
  /* Modals: box never taller than the viewport, scrolls inside; page behind stays put while one is open. */
  .bx-overlay { overscroll-behavior:contain; }
  .bx-modal { max-height:90vh; max-height:90dvh; overflow-y:auto; overscroll-behavior:contain; }
  /* Every modal's primary action button is its last child (see modalWrap() and the bulk import/photo
     footers) — extra bottom padding, on top of the p-6 utility, keeps it clear of a phone's home-indicator
     gesture bar. The doubled selector only raises specificity so this beats .p-6 regardless of which
     Tailwind puts later in the cascade; it is not scoping anything narrower. */
  .bx-modal.bx-modal { padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); }
  body:has(.bx-overlay) { overflow:hidden; }
  ::-webkit-scrollbar { width:10px; }
  /* RTL: Arabic must not be letter-spaced (it breaks the joined letters); physical alignments flip */
  html[dir=rtl] .eyebrow, html[dir=rtl] [class*="tracking-"], html[dir=rtl] table.dtable th { letter-spacing:0; text-transform:none; }
  html[dir=rtl] table.dtable th, html[dir=rtl] .text-left { text-align:right; }
  html[dir=rtl] .text-right { text-align:left; }
  html[dir=rtl] h1, html[dir=rtl] h2, html[dir=rtl] h3, html[dir=rtl] .font-extrabold, html[dir=rtl] .bx-display { letter-spacing:0; }
  html[dir=rtl] [data-dropdown=headerMenu] > div { right:auto !important; left:0 !important; }
  @media (min-width:640px) { html[dir=rtl] [data-dropdown=notif] > div { right:auto !important; left:0 !important; } }
  /* Touch: no 300ms delay/double-tap zoom on controls, no grey flash on tap, brand-coloured checkboxes.
     The pressed-state scale is for real touch screens only (pointer:coarse), so desktop mice see no change. */
  body { -webkit-tap-highlight-color: transparent; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  a, button, input, select, textarea, label, summary, [onclick] { touch-action: manipulation; }
  input[type=checkbox], input[type=radio] { accent-color: var(--acc); }
  @media (pointer: coarse) {
    button, .chip, .bx-tap, [data-navtab] { transition: transform .12s ease; }
    button:not(:disabled):active, .chip:active, .bx-tap:active, [data-navtab]:active { transform: scale(0.97); }
  }
  /* Phone-width labels: no all-caps (Tailwind's uppercase utility); text written in capitals stays as written */
  @media (max-width: 767px) { .uppercase { text-transform: none !important; } }
  /* Primary form buttons span the width on phones */
  @media (max-width: 639px) { .bx-btn-block { width: 100%; } }
  /* Password fields: the show/hide button sits at the end of the field (right in LTR, left in RTL) */
  .bx-pw { position: relative; display: block; width: 100%; }
  .bx-pw.bx-pw > input { padding-inline-end: 44px; }
  .bx-pw-eye { position: absolute; inset-inline-end: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--tx4); cursor: pointer; border-radius: 8px; }
  .bx-pw-eye:hover, .bx-pw-eye:focus-visible { color: var(--acc); outline: none; }
  /* Phone navigation (<768px): bottom tab bar + "More" sheet replace the top tabs */
  .bx-bottomnav { position: fixed; inset-inline: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--panel); border-top: 1px solid var(--bd); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bx-bottomnav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; padding: 6px 2px; font-size: 10.5px; font-weight: 600; color: var(--tx4); background: none; border: 0; min-width: 0; }
  .bx-bottomnav button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bx-bottomnav button[aria-current=page] { color: var(--acc); }
  @media (min-width: 768px) { .bx-bottomnav, .bx-more { display: none !important; } }
  @media (max-width: 767px) {
    .bx-page { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
    body:has(.bx-bottomnav) .bx-toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  }
  .bx-more-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; padding: 0 14px; border: 0; border-radius: 12px; background: none; color: var(--tx2); font-size: 15px; font-weight: 600; text-align: start; }
  .bx-more-row:active { background: var(--sunken); }
  .bx-chev { flex-shrink: 0; color: var(--tx4); }
  html[dir=rtl] .bx-chev { transform: scaleX(-1); }
  /* Components (brand Mix 1) */
  /* cards: --panel, 1px --line, 18px */
  .rounded-xl[style*="background:var(--panel)"], .rounded-2xl[style*="background:var(--panel)"], .bx-modal { border-radius:18px; }
  /* buttons: 16px (12px for small inline actions); primary actions are at least 48px tall, all filled ones on phones / touch */
  button.rounded-xl, a.rounded-xl { border-radius:16px; }
  button.rounded-lg, a.rounded-lg { border-radius:12px; }
  button.w-full, button.py-3, a.py-3, button.py-2.5[style*="background:var(--acc)"] { min-height:48px; }
  @media (max-width: 639px), (pointer: coarse) { button[style*="background:var(--acc)"], a[style*="background:var(--acc)"] { min-height:48px; } }
  /* text on an accent fill: white in the light theme, dark ink in the dark theme (set per role in the tokens) */
  [style*="background:var(--acc)"], [style*="background: var(--acc)"] { color:var(--on-acc) !important; }
  button:disabled { cursor:not-allowed; }
  /* active bottom-nav tab: accent on accent-soft (the supplier's light-theme accent is too dim on its soft fill: use the ink) */
  .bx-bottomnav button { border-radius:16px; }
  .bx-bottomnav button[aria-current=page] { background:var(--acc-soft); }
  :root:not([data-theme="dark"])[data-role="supplier"] .bx-bottomnav button[aria-current=page] { color:var(--acc-ink); }
  .bx-tapcard { cursor: pointer; }
  @keyframes bxFlash { 0%, 60% { box-shadow: 0 0 0 3px var(--acc); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .bx-flash { animation: bxFlash 2.4s ease both; }
  @media (prefers-reduced-motion: reduce) { .bx-flash { animation: none; outline: 2px solid var(--acc); } }
  .bx-tapcard:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  /* Phones (<640px): dialogs become bottom sheets that slide up in 200ms; the "More" sheet uses the same motion.
     Desktop keeps the centred dialog. Pure CSS: the markup of every modal is unchanged. */
  @keyframes bxFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bxSheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .bx-sheet { animation: bxSheet .2s cubic-bezier(.22, 1, .36, 1) both; }
  @media (max-width: 639px) {
    .bx-overlay { align-items: flex-end !important; padding: 0 !important; animation: bxFade .2s ease both; }
    .bx-overlay > .bx-modal { max-width: none !important; width: 100%; border-radius: 16px 16px 0 0 !important; border-bottom-width: 0; max-height: 88vh; max-height: 88dvh; animation: bxSheet .2s cubic-bezier(.22, 1, .36, 1) both; }
  }
  @media (prefers-reduced-motion: reduce) { .bx-sheet, .bx-overlay, .bx-overlay > .bx-modal { animation: none !important; } }
  .bx-rolechip { display:inline-block; background:var(--acc-soft); color:var(--acc-ink); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; line-height:1.4; white-space:nowrap; }
  .eyebrow { font-family:inherit; font-size:11px; font-weight:600; letter-spacing:0.08em; color:var(--acc); }
  /* caption directly above a small metric value: 4px, unless the value already carries its own mt-* (spacing scale, PROJECT_CONTEXT 6.7) */
  .eyebrow + .mono:not([class*="mt-"]) { margin-top:4px; }
  .stage-seg { height:6px; border-radius:99px; background:var(--sunken); flex:1; overflow:hidden; }
  .stage-seg > span { display:block; height:100%; background:var(--acc); }
  .stage-seg.done > span { background:var(--ok); width:100%; }
  .stage-seg.current > span { background:var(--acc); width:100%; }
  table.dtable { width:100%; border-collapse:collapse; font-size:13px; }
  table.dtable th { text-align:left; font-size:11px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--tx4); padding:10px 12px; border-bottom:1px solid var(--bd); white-space:nowrap; }
  table.dtable td { padding:12px; border-bottom:1px solid var(--bd); vertical-align:middle; }
  table.dtable tr:last-child td { border-bottom:none; }
  /* "?" term hints (see hint() in the script): the ::after enlarges the tap target to ~32px without growing the icon */
  .bx-hint { display:inline-grid; place-items:center; width:18px; height:18px; margin-inline-start:6px; padding:0; border-radius:999px; border:1px solid var(--bd2); background:var(--panel); color:var(--tx3); font-size:11px; font-weight:700; line-height:1; cursor:help; vertical-align:middle; position:relative; text-transform:none; letter-spacing:0; flex-shrink:0; }
  .bx-hint::after { content:''; position:absolute; inset:-7px; }
  .bx-hint:hover, .bx-hint:focus-visible { border-color:var(--acc); color:var(--acc); outline:none; }
  .bx-hint-pop { position:fixed; z-index:90; width:max-content; max-width:min(260px, calc(100vw - 16px)); padding:10px 12px; border-radius:10px; font-size:12.5px; font-weight:500; line-height:1.45; text-transform:none; letter-spacing:0; background:var(--tx); color:var(--bg); box-shadow:0 8px 24px rgba(0,0,0,0.25); pointer-events:none; }
  .chip { border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600; border:1px solid var(--bd); color:var(--tx3); background:var(--panel); cursor:pointer; white-space:nowrap; }
  .chip.active { background:var(--tx); color:var(--panel); border-color:var(--tx); }
  .avatar2 { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-weight:700; font-size:13px; flex-shrink:0; }

  /* ---- spending report: only the report prints (Print / Save as PDF) ---- */
  .bx-printonly { display: none; }
  @media print {
    :root, :root[data-theme=dark] { --bg:#fff; --panel:#fff; --inset:#fff; --tx:#1B1A17; --tx2:#444; --tx3:#555; --tx4:#666; --line:#d8d3ca; --bd:#d8d3ca; --acc:#0F766E; --acc-soft:#E3F2EF; --acc-ink:#0B5A54; --bad:#B42318; --pend:#8A4A0B; --pend-soft:#FCEFD9; }
    html, body, #app { background: #fff !important; }
    .bx-noprint, .bx-bottomnav, .bx-more, .bx-overlay { display: none !important; }
    .bx-printonly { display: block; color: #1B1A17; }
    .bx-page { max-width: none !important; padding: 0 !important; }
    .bx-spend-panel, .bx-spend-row, .bx-chart { break-inside: avoid; }
    .bx-chart { overflow: visible !important; }
  }
</style>

<script>
const API = window.BIDDEX_API; // config.js: production API on the real domains, the local backend on localhost
// RFQ categories — the same lists as the server (src/utils/categories.js): RFQs can only be posted in an active
// category; the others are shown as "Coming soon" and can't be chosen.
const ACTIVE_CATEGORIES = ['Restaurants & Cafés'];
const COMING_SOON_CATEGORIES = ['Beauty & Salons','Construction','Generators & Machinery','Rental Cars','Office & Facilities','General'];
const CATEGORIES = ACTIVE_CATEGORIES.concat(COMING_SOON_CATEGORIES);
// RFQs saved before the rename

const unitLabel = (u) => (state.lang === 'ar' && UNIT_AR[u]) || u;
const categoryOptionLabel = (c) => (state.lang === 'ar' && CATEGORY_AR[c]) || c;
const categoryLabel = (c) => c === 'Restaurant Groceries' ? 'Restaurants & Cafés' : (c || '—');
const categoryDisplay = (c) => categoryOptionLabel(categoryLabel(c));
// Catalog units — the same fixed list the server accepts (src/controllers/catalog.controller.js CATALOG_UNITS)
const CATALOG_UNITS = ['kg', 'pcs', 'box', 'carton', 'litre', 'ton'];
// Brand pairs only (accent of the current role, waiting-amber, neutral); they follow the theme.
const AVATAR_PALETTE = [
  {bg:'var(--acc-soft)', fg:'var(--acc-ink)'}, {bg:'var(--pend-soft)', fg:'var(--pend)'}, {bg:'var(--line)', fg:'var(--tx2)'}
];

// ---------- i18n (English / Arabic — covers navigation, headers and primary actions;
// live marketplace data such as RFQ titles is created by users and stays as entered) ----------
const I18N = {

    reverifyConfirm:'Your company is verified. Changing its name or CR number removes the verification until an admin checks it again; meanwhile you cannot post RFQs or submit quotes. Continue?',

function t(key){ return (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key; }
// t() with {name} placeholders filled from vars (never build sentences by concatenation: word order differs in Arabic)
function tpl(key, vars){ return t(key).replace(/\{(\w+)\}/g, (m, k) => vars && vars[k] != null ? vars[k] : m); }
// Numbers stay Latin in Arabic (as in the wallet); dates use ar-BH with Latin digits, English keeps the browser default
const dateLocale = () => state.lang === 'ar' ? 'ar-BH-u-nu-latn' : undefined;
function fmtDateTime(d){ return new Date(d).toLocaleString(dateLocale()); }
function fmtDate(d){ return new Date(d).toLocaleDateString(dateLocale()); }
function fmtNum(n, digits){ return (Number(n) || 0).toFixed(digits == null ? 3 : digits); }
// Amount with the currency label: '12.000 BHD' / '12.000 د.ب'
function bhdMoney(n){ return fmtNum(n, 3) + ' ' + t('bhd'); }

function initTheme(){
  try {
    const th = localStorage.getItem('biddex_theme');
    if (th === 'dark' || th === 'light') { document.documentElement.setAttribute('data-theme', th); applyThemeColor(th === 'dark'); }
  } catch(e) {}
}
function applyThemeColor(dark){
  document.querySelectorAll('meta[name=theme-color]').forEach(m => m.setAttribute('content', dark ? '#141311' : '#FAF7F2'));
}
function isDarkNow(){
  const cur = document.documentElement.getAttribute('data-theme');
  return cur === 'dark' || (!cur && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function toggleTheme(){
  const next = isDarkNow() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('biddex_theme', next); } catch(e) {}
  applyThemeColor(next === 'dark');
  render();
}
function themeToggleBtn(){
  return '<button onclick="toggleTheme()" class="rounded-lg border px-2.5 py-1.5 text-[13px]" style="border-color:var(--bd2); color:var(--tx2);" title="' + t('themeToggleTitle') + '">' + (isDarkNow() ? '☀️' : '🌙') + '</button>';
}

function initLang(){
  try {
    const l = localStorage.getItem('biddex_lang');
    if (l === 'ar' || l === 'en') applyLangAttrs(l);
  } catch(e) {}
  // Links from the landing carry ?lang=ar|en (the two sites are different origins, so localStorage cannot be
  // shared). Only those two values are accepted; the parameter wins over the saved choice, is saved as the
  // user's choice, and is removed from the address so it does not linger in bookmarks or history.
  try {
    const q = new URLSearchParams(location.search);
    if (q.has('lang')) {
      const p = q.get('lang');
      if (p === 'ar' || p === 'en') {
        applyLangAttrs(p);
        try { localStorage.setItem('biddex_lang', p); } catch(e) {}
      }
      q.delete('lang');
      const rest = q.toString();
      history.replaceState(history.state, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
    }
  } catch(e) {}
}
function applyLangAttrs(l){
  state.lang = l;
  document.documentElement.setAttribute('lang', l);
  document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
}
function toggleLang(){
  applyLangAttrs(state.lang === 'ar' ? 'en' : 'ar');
  try { localStorage.setItem('biddex_lang', state.lang); } catch(e) {}
  render();
}
function langToggleBtn(){
  return '<button onclick="toggleLang()" class="rounded-lg border px-2.5 py-1.5 text-[12px] font-bold" style="border-color:var(--bd2); color:var(--tx2);">' + (state.lang === 'ar' ? 'EN' : 'العربية') + '</button>';
}

async function api(path, opts={}) {
  const isForm = typeof FormData !== 'undefined' && opts.body instanceof FormData;
  const headers = { ...(isForm ? {} : { 'Content-Type':'application/json' }), ...(opts.headers||{}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  let res;
  try { res = await fetch(API + path, { ...opts, headers }); }
  catch (netErr) {
    // offline, DNS, CORS or the server not answering: fetch rejects without a status
    const err = new Error(t('networkError')); err.status = 0; throw err;
  }
  let data = null, raw = '';
  try { raw = await res.text(); data = JSON.parse(raw); } catch(e) {}
  if (!res.ok) {
    // a JSON { error }, else a short plain-text body (no HTML pages), else the generic wording
    const plain = !data && raw && raw.length <= 200 && raw.indexOf('<') === -1 ? raw.trim() : '';
    const err = new Error((data && data.error) || plain || tpl('requestFailed', { status: res.status }));
    err.status = res.status;
    err.data = data;
    // A 401 from the auth middleware mid-session means the token expired or the account was deactivated:
    // end the session instead of leaving every panel silently empty. (Other 401s, e.g. a wrong current
    // password on the change-password form, must not log the user out.)
    const SESSION_ERRORS = ['Invalid or expired token', 'Account deactivated', 'Missing or invalid Authorization header', 'You are no longer a member of this company'];
    if (res.status === 401 && state.token && SESSION_ERRORS.includes(err.message)) {
      logout();
      showToast(t(err.message === 'Account deactivated' ? 'accountDeactivated' : err.message === 'You are no longer a member of this company' ? 'noLongerMember' : 'sessionExpired'));
    }
    throw err;
  }
  return data;
}

function timeLeft(dateStr){
  if (!dateStr) return null;
  const end = new Date(dateStr).getTime();
  const diff = end - Date.now();
  return diff;
}
function timeLeftLabel(dateStr){
  const diff = timeLeft(dateStr);
  if (diff == null) return { label:'—', urgent:false, past:false };
  if (diff <= 0) return { label:t('stClosed'), urgent:false, past:true };
  const s = Math.floor(diff/1000);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60;
  const urgent = diff < 24*3600*1000;
  let label;
  if (d > 0) label = [tpl('timeD',{n:d}), tpl('timeH',{n:h}), tpl('timeM',{n:m})].join(' ');
  else if (urgent) label = [tpl('timeH',{n:String(h).padStart(2,'0')}), tpl('timeM',{n:String(m).padStart(2,'0')}), tpl('timeS',{n:String(sec).padStart(2,'0')})].join(' ');
  else label = [tpl('timeH',{n:h}), tpl('timeM',{n:m})].join(' ');
  return { label, urgent, past:false };
}

// ---------- Background refresh errors ----------
// Polling refreshes used to swallow errors, so panels silently froze. Now each failing source is recorded
// and one quiet banner is shown (no toast every 30s); a source's next successful refresh clears it.

function syncOk(source){

}
function syncFailed(source, e){
  if (e && e.status === 401) return;
  const msg = (e && e.message) || 'Unknown error';
  if (state.syncErrors[source] !== msg) setState({ syncErrors: { ...state.syncErrors, [source]: msg } });
}

// ---------- New version check ----------
// The app is one page that stays open for hours; after a release an open tab keeps running the old code (an
// admin tab opened before the documents moved to the bucket still expected data: URLs and refused to show
// them). Every 5 minutes, and when the tab comes back, compare index.html with what it was when this page
// started checking, and offer a reload. no-cache: the browser revalidates (a cheap 304 while unchanged).
let appHtmlHash = null;
async function checkForNewVersion(){
  try {
    const res = await fetch(location.pathname, { cache: 'no-cache' });
    if (!res.ok) return;
    const text = await res.text();
    let h = 0;
    for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0;
    if (appHtmlHash === null) appHtmlHash = h;
    else if (h !== appHtmlHash && !state.newVersionAvailable) setState({ newVersionAvailable: true });
  } catch(e) {} // offline etc.: try again next time
}

// who I am and what I may do: once after the page opens (an old stored session has no list) and then every 5 minutes
let lastMeAt = 0;
async function refreshMe(){
  if (!state.token || !state.user || state.user.role === 'ADMIN') return;
  if (Array.isArray(state.user.permissions) && Date.now() - lastMeAt < 5 * 60 * 1000) return;
  try {
    const me = await api('/api/auth/me');
    lastMeAt = Date.now();
    if (!me || !state.user) return;
    setIfChanged('user', { ...state.user, fullName: me.fullName || null, memberRole: me.memberRole || null, permissions: Array.isArray(me.permissions) ? me.permissions : undefined });
    saveSession();
  } catch(e) { /* keep what is known */ }
}

function copyToClipboard(text){
  const done = () => showToast('Copied');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => showToast('Copy failed: select the text and copy it'));
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e) { showToast('Copy failed'); } ta.remove(); }
}

// details as short "key: value" pairs; the company name and the admin are columns of their own
function auditDetailsText(d){
  const skip = { companyName: 1, adminEmail: 1, otherCompanyId: 1, otherCompanyName: 1 };
  const parts = Object.keys(d || {}).filter(k => !skip[k] && d[k] !== null && d[k] !== '').map(k => {
    let v = d[k];
    if (typeof v === 'object') v = JSON.stringify(v);
    v = String(v);
    return k + ': ' + (v.length > 160 ? v.slice(0, 160) + '…' : v);
  });
  if (d && d.otherCompanyName) parts.unshift('with ' + d.otherCompanyName);
  return parts.join(' · ');
}

async function resolveDispute(action){
  const comment = state.resolveComment.trim();
  if (!comment) { showToast('Add a comment for both parties.'); return; }
  if (action === 'CANCEL' && !confirm('Cancel this order? Pending payments will be rejected. Both parties will be notified.')) return;
  setState({ resolveBusy:true });
  try {
    await api('/api/admin/orders/' + state.adminDisputeId + '/resolve-dispute', { method:'POST', body: JSON.stringify({ action, comment }) });
    showToast(action === 'CANCEL' ? 'Order cancelled.' : 'Order resumed.');
    setState({ resolveBusy:false, adminDisputeId:null, adminDisputeChat:[], resolveComment:'' });
    refreshAdminDisputes();
  } catch(e) { setState({ resolveBusy:false }); showToast(e.message); refreshAdminDisputes(); }
}

const DOC_KIND_KEYS = { DELIVERY_NOTE:'dkDeliveryNote', INVOICE:'dkInvoice', OTHER:'dkOther', QUOTE_ATTACHMENT:'dkQuoteAttachment' };
const docKindLabel = (k) => DOC_KIND_KEYS[k] ? t(DOC_KIND_KEYS[k]) : (k || '');
const DOC_TYPE_RE = /^(application\/pdf|image\/(jpeg|png|webp))$/;
const DOC_EXT_RE = /\.(pdf|jpe?g|png|webp)$/i;
// the same checks the server makes, so a wrong file is refused before uploading it
function docFileProblem(file){
  if (file.size > DOC_MAX_BYTES) return t('fileTooBig').replace('{name}', file.name);
  if (!DOC_EXT_RE.test(file.name) && !DOC_TYPE_RE.test(file.type)) return t('fileBadType').replace('{name}', file.name);
  return '';
}
const DOC_MAX_BYTES = 10 * 1024 * 1024;

async function refreshOrderDocs(orderId){
  if (!state.token) return;
  try {
    const data = await api('/api/orders/' + orderId + '/documents');
    // the order / dispute on screen may have changed while this was loading
    if (state.selectedOrderId === orderId || state.adminDisputeId === orderId || state.adminOrderId === orderId) setIfChanged('orderDocs', data);
    syncOk('docs');
  } catch(e) { syncFailed('docs', e); }
}
function setDocKind(e){ state.docKind = e.target.value; }

async function onDocFileChange(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  const orderId = state.selectedOrderId;
  if (!file || !orderId) return;
  const problem = docFileProblem(file);
  if (problem) { showToast(problem); return; }
  const form = new FormData();
  form.append('kind', state.docKind);
  form.append('file', file, file.name);
  setState({ docUploading: true });
  try {
    await api('/api/orders/' + orderId + '/documents', { method:'POST', body: form });
    showToast(tpl('toastDocUploaded', { kind: docKindLabel(state.docKind) }));
  } catch(err) { showToast(err.message); }
  setState({ docUploading: false });
  refreshOrderDocs(orderId);
}

// The API returns a 120-second link that downloads the file as an attachment
async function openDownload(path, busyId){

    document.body.appendChild(a); a.click(); a.remove();
  } catch(e) { showToast(e.message); }
  setState({ docBusyId: null });
}

function downloadAttachment(id){ return openDownload('/api/quote-attachments/' + id + '/download', id); }

async function deleteDoc(docId){

function fmtBytes(n){ return n >= 1024 * 1024 ? tpl('sizeMb', { n: (n / 1024 / 1024).toFixed(1) }) : tpl('sizeKb', { n: Math.max(1, Math.round(n / 1024)) }); }

const MAX_QUOTE_FILES = 5;

// submit-quote dialog: files are uploaded right after the quote is created
function onQuoteFilesChange(e){
  const picked = [...(e.target.files || [])];
  e.target.value = '';
  const problems = picked.map(docFileProblem).filter(Boolean);
  const ok = picked.filter(f => !docFileProblem(f));
  const room = MAX_QUOTE_FILES - state.quoteFiles.length;
  if (ok.length > room) problems.push(t('bidMaxFiles').replace('{n}', MAX_QUOTE_FILES));
  setState({ quoteFiles: [...state.quoteFiles, ...ok.slice(0, Math.max(0, room))] });
  if (problems.length) showToast(problems[0]);
}
function removeQuoteFile(i){ setState({ quoteFiles: state.quoteFiles.filter((_, j) => j !== i) }); }

// uploads one file to a quote; returns '' or the error message
async function uploadQuoteFile(quoteId, file){
  const form = new FormData();
  form.append('file', file, file.name);
  try { await api('/api/quotes/' + quoteId + '/attachments', { method:'POST', body: form }); return ''; }
  catch(e) { return file.name + ': ' + e.message; }
}

// the supplier's own quote on an RFQ, and whether its files may still change (as the server decides)
function ownQuoteOf(rfq){ return rfq && (rfq.quotes || []).find(q => q.status !== 'WITHDRAWN'); }
function attachmentsEditable(rfq, quote){
  return !!quote && quote.status === 'SUBMITTED' && rfq.status === 'PUBLISHED' && !(rfq.deadline && new Date(rfq.deadline) <= new Date());
}

async function openAttachments(rfqId){
  const rfq = (state.rfqs || []).find(r => r.id === rfqId);

  refreshAttachments();
}
function closeAttachments(){ setState({ attQuoteId: null, attRfqId: null, attList: [] }); refreshRfqs(); }
async function refreshAttachments(){
  const id = state.attQuoteId;
  if (!id) return;
  try {
    const data = await api('/api/quotes/' + id + '/attachments');
    if (state.attQuoteId === id) setState({ attList: data });
  } catch(e) { showToast(e.message); }
}
async function onAttFileChange(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file || !state.attQuoteId) return;
  const problem = docFileProblem(file);
  if (problem) { showToast(problem); return; }
  setState({ attUploading: true });

}

// Confirmed / pending / still-open amounts of an invoice, summed in fils (1 BHD = 1000 fils, as stored)
// to avoid float drift
function invoiceTotals(invoice){
  const fils = v => Math.round(Number(v || 0) * 1000);
  const sum = st => (invoice.payments || []).filter(p => p.status === st).reduce((a, p) => a + fils(p.amount), 0);
  const paid = sum('COMPLETED'), pending = sum('PENDING');
  return { paid: paid / 1000, pending: pending / 1000, outstanding: Math.max(0, fils(invoice.amount) - paid - pending) / 1000 };
}

// A date picked as the RFQ deadline means "open until the end of that day in Bahrain" (UTC+3, no DST);
// a bare "YYYY-MM-DD" would otherwise be parsed as midnight UTC and close the RFQ that morning.
function bahrainEndOfDay(dateStr){ return dateStr ? dateStr + 'T23:59:59+03:00' : dateStr; }
function bahrainToday(){ return new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10); }

function bahrainDateOf(iso){ return iso ? new Date(new Date(iso).getTime() + 3 * 3600e3).toISOString().slice(0, 10) : ''; }

// Buyer may edit an RFQ only while it is DRAFT/PUBLISHED and nobody has quoted (the server enforces this too)
// (a person who may not publish edits drafts only)
function canEditRfq(r){ return (r.status === 'DRAFT' || (r.status === 'PUBLISHED' && can('rfq.publish'))) && !(r._count && r._count.quotes > 0); }
function canCancelRfq(r){ return can('rfq.cancel') && ['DRAFT','PUBLISHED','QUOTING_CLOSED'].includes(r.status); }

// The buyer's category for a new RFQ: the one of their latest RFQ (companies have no category of their own),
// else the platform default
function defaultRfqCategory(){
  const last = (state.rfqs || []).map(r => categoryLabel(r.category)).find(c => ACTIVE_CATEGORIES.includes(c));
  return last || ACTIVE_CATEGORIES[0];
}
// today + n days in Bahrain time, as YYYY-MM-DD
function addDaysBahrain(n){ return new Date(Date.now() + 3 * 3600e3 + n * 86400e3).toISOString().slice(0, 10); }

// ---------- RFQ: "What do you need" doubles as the catalog search ----------
// Suggestions live outside `state` and are painted with a targeted DOM update (like updateQuoteTotal()),
// never via setState/render — the field would otherwise lose focus on every keystroke or every time
// results arrive mid-typing (the whole #app subtree is replaced on every render()).
let productSearchResults = [];
let productSearchedFor = null; // the query productSearchResults answers (so "no matches" isn't shown before a search ran)
let productSearchTimer = null;

function paintProductArea(loading){
  const box = document.getElementById('rfq-product-area');
  if (box) box.innerHTML = renderRfqProductArea(loading);
}

// Typing in the title field: it's the RFQ title, and (until a product is picked) the catalog search query.
// Editing the text unlinks a previously picked product — the words no longer describe it.
function onRfqTitleInput(e){
  const r = state.newRfq;
  r.title = e.target.value;
  if (r.productId) { r.productId = null; r.productImageUrl = null; }
  paintProductArea(r.title.trim().length >= 2);
  clearTimeout(productSearchTimer);
  productSearchTimer = setTimeout(searchProducts, 300);
}

async function searchProducts(){
  const q = (state.newRfq.title || '').trim();
  if (q.length < 2) { productSearchResults = []; productSearchedFor = null; paintProductArea(); return; }
  let results;
  try { results = await api('/api/catalog/search?q=' + encodeURIComponent(q)); } catch (e) { results = []; }
  if ((state.newRfq.title || '').trim() !== q || state.newRfq.productId) return; // typed on, or picked one, meanwhile
  productSearchResults = results;
  productSearchedFor = q;
  paintProductArea();
}

// Under the title field: the picked product, or the suggestions for what is typed
function renderRfqProductArea(loading){
  const r = state.newRfq;
  if (r.productId) {
    return '<div class="flex items-center gap-2.5 rounded-lg border p-2" style="border-color:var(--bd); background:var(--inset);">' +
      (r.productImageUrl ? '<img src="' + esc(r.productImageUrl) + '" class="h-10 w-10 shrink-0 rounded-lg object-cover border" style="border-color:var(--bd);" />' : '') +
      '<div class="min-w-0 flex-1"><div class="truncate text-[12.5px] font-semibold" style="color:var(--tx);">' + esc(r.title) + '</div>' +
        ((r.brand || r.unit) ? '<div class="truncate text-[11px]" style="color:var(--tx4);">' + esc([r.brand, unitLabel(r.unit)].filter(Boolean).join(' · ')) + '</div>' : '') + '</div>' +
      '<button type="button" onclick="clearProduct()" class="shrink-0 text-[11px] font-semibold" style="color:var(--acc);">' + t('rfqChange') + '</button>' +
    '</div>';
  }
  const q = (r.title || '').trim();
  if (q.length < 2) return '';
  if (loading) return '<div class="text-[12px]" style="color:var(--tx4);">' + t('rfqSearching') + '</div>';
  if (productSearchedFor !== q) return '';
  if (!productSearchResults.length) return '<div class="text-[12px]" style="color:var(--tx4);">' + t('rfqNoMatches') + '</div>';
  return '<div class="bx-scroll flex max-h-52 flex-col gap-1.5 overflow-y-auto">' + productSearchResults.map(it =>
    '<button type="button" onclick="pickProduct(' + jsAttr(it.id) + ')" class="flex items-center gap-2.5 rounded-lg border p-2 text-start" style="border-color:var(--bd); background:var(--panel);">' +
      (it.imageUrl ? '<img src="' + esc(it.imageUrl) + '" class="h-10 w-10 shrink-0 rounded object-cover" />' : '<div class="h-10 w-10 shrink-0 rounded" style="background:var(--sunken);"></div>') +
      '<div class="min-w-0 flex-1"><div class="truncate text-[12.5px] font-semibold" style="color:var(--tx);">' + esc(it.name) + '</div>' +
      '<div class="truncate text-[11px]" style="color:var(--tx4);">' + esc([it.brand, unitLabel(it.unit), it.category].filter(Boolean).join(' · ') || ' ') + '</div></div>' +
    '</button>'
  ).join('') + '</div>';
}

async function submitNewRfq(){
  const r = state.newRfq;
  if (!(r.title || '').trim() || !r.quantity || !r.deadline) { showToast(t('rfqFillFields')); return; }
  // quantity is a whole number (quotes are priced per unit: total = unit price × quantity)
  if (!Number.isInteger(Number(r.quantity)) || Number(r.quantity) < 1) { showToast(t('rfqQtyWhole')); return; }
  // the budget is optional while bidding is free; once suppliers pay a % of it to quote it is required (the server enforces this too)
  const hasBudget = String(r.budget || '').trim() !== '';
  let budget = null;
  if (bidFeePercent() > 0 && !hasBudget) { setState({ rfqMore: true }); showToast(t('rfqBudgetRequired')); return; }
  if (hasBudget) {
    budget = parseMoneyInput(r.budget);
    if (budget == null) { setState({ rfqMore: true }); showToast(t('rfqBudgetNumber')); return; }
    if (budget <= 0) { setState({ rfqMore: true }); showToast(t('rfqBudgetPositive')); return; }
  }
  const editId = state.editRfqId;
  const fields = {
    title: r.title,
    description: r.title + ' — ' + r.quantity + ' ' + r.unit,
    category: ACTIVE_CATEGORIES.includes(r.category) ? r.category : ACTIVE_CATEGORIES[0],
    quantity: Number(r.quantity) || undefined,
    unit: r.unit,
    budget,
    specifications: (r.specifications || '').trim(),
    deadline: bahrainEndOfDay(r.deadline),
    brand: (r.brand || '').trim(),
    exactBrandOnly: !!r.exactBrandOnly,
    productId: r.productId, // undefined (untouched), null (cleared) or an id — JSON.stringify drops undefined
  };
  if (fields.specifications.length > MAX_SPECIFICATIONS) { showToast(t('rfqSpecsMax').replace('{max}', MAX_SPECIFICATIONS)); return; }
  setState({ postBusy:true });
  try {
    const publishes = can('rfq.publish');
    const editedDraft = editId && ((state.rfqs || []).find(x => x.id === editId) || {}).status === 'DRAFT';
    // a draft (made by someone who may not publish) goes live when a manager or owner saves it
    if (editId) await api('/api/rfqs/' + editId, { method:'PATCH', body: JSON.stringify(editedDraft && publishes ? { ...fields, status: 'PUBLISHED' } : fields) });
    else await api('/api/rfqs', { method:'POST', body: JSON.stringify({ ...fields, publish: publishes }) });
    setState({ showPostRfq:false, editRfqId:null, postBusy:false });
    showToast(t(editId ? (editedDraft && publishes ? 'rfqPosted' : 'rfqUpdated') : (publishes ? 'rfqPosted' : 'rfqDraftSaved')));
    refreshRfqs();
  } catch(e) {
    setState({ postBusy:false });
    if (editId && e.status === 409) { setState({ showPostRfq:false, editRfqId:null }); showToast(t('rfqLocked')); refreshRfqs(); }
    else showToast(e.message);
  }
}

// #/rfq/<id> — buyer: the bids (comparison) when there are any; supplier: the bid form while bidding is open,
// otherwise the card with their own bid / the "bidding closed" note. Not this user's or not existing: "not found".
async function openRfqLink(rfqId){
  let rfq;
  try { rfq = await api('/api/rfqs/' + encodeURIComponent(rfqId)); }
  catch(e) { if (e.status === 400 || e.status === 403 || e.status === 404) setState({ notFound:'rfq' }); else showToast(e.message); return; }
  if (!isDashboardView()) return; // signed out while the request was in flight
  if (!(state.rfqs || []).some(r => r.id === rfq.id)) state.rfqs = [rfq].concat(state.rfqs || []);
  const supplier = state.view === 'supplier';
  setSection('rfqs');
  if (!supplier) { if ((rfq.quotes || []).length) openCompare(rfq.id); return; }
  const own = (rfq.quotes || []).find(q => q.status !== 'WITHDRAWN');
  if (rfq.status === 'PUBLISHED' && !own && new Date(rfq.deadline) > new Date()) { openSubmitQuote(rfq.id); return; }
  setTimeout(() => {
    const el = document.querySelector('[data-rfq="' + String(rfq.id).replace(/["\\]/g, '') + '"]');
    if (el) { el.scrollIntoView({ block:'center' }); el.classList.add('bx-flash'); }
  }, 60);
}

function quoteTotalHtml(rawPrice, rfq){

    (over ? '<div class="mt-1 text-[12px]" style="color:var(--warn);">' + t('bidOverBudget').replace('{budget}', bhdMoney(rfq.budget)) + '</div>' : '');
}

async function submitQuote(){
  const f = state.quoteForm;
  const days = parseInt(f.days, 10);
  if (!f.price || !days) return;
  const price = parseMoneyInput(f.price);
  if (price == null || price <= 0) { showToast(t('rfqBudgetNumber')); return; }
  const paymentTerms = f.paymentTerms === '' ? 30 : parseInt(f.paymentTerms, 10);
  if (!Number.isInteger(paymentTerms) || paymentTerms < 0 || paymentTerms > 120) { showToast(t('bidTermsError')); return; }
  const rfqId = state.submitQuoteRfqId;
  setState({ quoteBusy:true });
  try {
    const quote = await api('/api/rfqs/' + rfqId + '/quotes', { method:'POST', body: JSON.stringify({
      unitPrice: price, currency:'BHD', deliveryTimeDays: days, paymentTermsDays: paymentTerms
    })});
    // the quote exists (and is paid for) now; attach the picked files one by one
    const files = state.quoteFiles;
    const errors = [];
    for (let i = 0; i < files.length; i++) {
      setState({ quoteUploadNote: t('bidUploading').replace('{i}', i + 1).replace('{n}', files.length) });
      const err = await uploadQuoteFile(quote.id, files[i]);
      if (err) errors.push(err);
    }
    // show "Quoted" right away; the server copy arrives with the next refreshRfqs()
    setState({ submitQuoteRfqId:null, quoteBusy:false, quoteFiles: [], quoteUploadNote: '', rfqs: (state.rfqs || []).map(r => r.id === rfqId ? { ...r, quotes: [{ ...quote, _count: { attachments: files.length - errors.length } }] } : r) });
    showToast(errors.length
      ? t('bidFilesFailed').replace('{n}', errors.length).replace('{err}', errors[0])
      : files.length ? t('bidSubmittedFiles').replace('{n}', files.length) : t('bidSubmitted'));
    refreshWallet(); refreshRfqs();
  } catch(e) {
    if (e.status === 409) {
      // already quoted (e.g. from another tab) — nothing was charged; resync so the card shows "Quoted"
      setState({ submitQuoteRfqId:null, quoteBusy:false });
      showToast(t('quoteAlreadySubmitted'));
      refreshRfqs();
    } else { setState({ quoteBusy:false }); showToast(e.message); }
  }
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error(t('imgReadFail')));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error(t('fileReadFail')));
    reader.readAsDataURL(file);
  });
}

// ---------- Catalog: bulk Excel/CSV import ----------
// SheetJS (pinned version) is loaded lazily from a CDN, only once, only when this flow is actually used.
const SHEETJS_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
let sheetJsPromise = null;
function loadSheetJS(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (sheetJsPromise) return sheetJsPromise;
  sheetJsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = SHEETJS_URL;
    s.onload = () => resolve(window.XLSX);
    s.onerror = () => { sheetJsPromise = null; reject(new Error(t('sheetJsFail'))); };
    document.head.appendChild(s);
  });
  return sheetJsPromise;
}

// name+brand+unit, normalized, for duplicate detection (both within the file and against the existing catalog)
const dupKey = (row) => [row.name, row.brand, row.unit].map((v) => String(v || '').trim().toLowerCase()).join('|');

async function onBulkImportFileChange(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  setState({ bulkImportBusy:true });
  try {
    const XLSX = await loadSheetJS();
    const buf = await file.arrayBuffer();
    const book = XLSX.read(buf, { type:'array' });
    const sheet = book.Sheets[book.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(sheet, { defval:'' });
    // header matching is case/space-insensitive, so "Item Name" or "UNIT" still line up
    const norm = (s) => String(s).trim().toLowerCase().replace(/[\s_]+/g, '');
    const pick = (obj, ...names) => { for (const k of Object.keys(obj)) { if (names.includes(norm(k))) return obj[k]; } return ''; };
    const existingKeys = new Set((state.myCatalog || []).map(dupKey));
    const seenInFile = new Set();
    const rows = raw.map((r) => {
      const row = {
        name: String(pick(r, 'name', 'itemname', 'productname')).trim(),
        brand: String(pick(r, 'brand')).trim(),
        unit: String(pick(r, 'unit', 'packing', 'packsize')).trim(),
        category: String(pick(r, 'category')).trim(),
        description: String(pick(r, 'description', 'desc')).trim(),
        price: String(pick(r, 'price')).trim(),
      };
      let error = '';
      if (!row.name) error = t('biErrName');
      else if (row.name.length > 200) error = t('biErrNameLong');
      else if (!row.unit) error = t('biErrUnit');
      else if (!CATALOG_UNITS.includes(row.unit.toLowerCase())) error = tpl('biErrUnitUnknown', { unit: row.unit, units: CATALOG_UNITS.join(', ') });
      else if (!row.price) error = t('biErrPrice');
      else if (parseMoneyInput(row.price) == null) error = t('biErrPriceBad');
      const key = dupKey(row);
      const dupCatalog = !error && existingKeys.has(key);
      const dupFile = !error && seenInFile.has(key);
      if (row.name) seenInFile.add(key);
      return { ...row, _error: error, _dupCatalog: dupCatalog, _dupFile: dupFile, _skip: !error && (dupCatalog || dupFile) };
    });
    setState({ bulkImportRows: rows, bulkImportStep:'preview', bulkImportBusy:false, bulkImportFileName: file.name });
  } catch (e) { setState({ bulkImportBusy:false }); showToast(e.message || t('fileReadFail')); }
}

function toggleBulkImportRowSkip(i){
  const rows = state.bulkImportRows.slice();
  rows[i] = { ...rows[i], _skip: !rows[i]._skip };

async function submitBulkImport(){
  const items = state.bulkImportRows
    .filter((r) => !r._error && !r._skip)
    .map((r) => ({ name: r.name, brand: r.brand || undefined, unit: r.unit || undefined, category: r.category || undefined, description: r.description || undefined, price: r.price || undefined }));

// Strips the extension and normalizes a filename so "Mozzarella-Almarai_1kg.jpg" can match "Mozzarella Almarai 1kg"
const normalizeForMatch = (s) => String(s || '').toLowerCase().replace(/\.[a-z0-9]+$/i, '').replace(/[-_.]+/g, ' ').replace(/\s+/g, ' ').trim();

function bestCatalogMatch(fileName){
  const target = normalizeForMatch(fileName);
  if (!target) return null;
  const items = state.myCatalog || [];
  // exact normalized match first, then "file name contains item name" as a looser fallback
  let hit = items.find((it) => normalizeForMatch(it.name) === target);
  if (!hit) hit = items.find((it) => it.name && target.includes(normalizeForMatch(it.name)));
  return hit ? hit.id : null;
}

async function onBulkPhotoFilesChange(e){
  const picked = Array.from(e.target.files || []);
  e.target.value = '';
  if (!picked.length) return;
  setState({ bulkPhotoBusy:true });
  const entries = [];
  for (const file of picked) {
    if (file.size > 8 * 1024 * 1024) { entries.push({ name:file.name, error:t('bpOver8') }); continue; }
    try {
      const dataUrl = await resizeImageFile(file, 1024, 0.82);
      entries.push({ name: file.name, dataUrl, matchedItemId: bestCatalogMatch(file.name) });
    } catch (err) { entries.push({ name: file.name, error: err.message }); }
  }
  setState({ bulkPhotoFiles: state.bulkPhotoFiles.concat(entries), bulkPhotoBusy:false });
}

function setBulkPhotoMatch(i, itemId){
  const files = state.bulkPhotoFiles.slice();
  files[i] = { ...files[i], matchedItemId: itemId || null };

async function submitBulkPhotos(){
  const matched = state.bulkPhotoFiles.filter((f) => f.dataUrl && f.matchedItemId);
  if (!matched.length) { showToast(t('toastBpNone')); return; }

    catch (e) { failed++; }
  }
  setState({ showBulkPhoto:false, bulkPhotoBusy:false });
  showToast(failed ? tpl('toastBpFail', { ok, failed }) : tpl('toastBpDone', { ok }));
  refreshMyCatalog();
}

// ---------- Order pipeline stage helper (6-stage tracker) ----------

const STAGES = ['LPO issued','Accepted','Shipped','Received','Payment confirmed','Completed'];

function orderStageIndex(o){
  const delivery = o.delivery || {}, invoice = o.invoice || {};
  if (o.status === 'COMPLETED') return 6;
  // the invoice is paid only after the buyer confirms receipt
  if (o.receivedAt) return invoice.status === 'PAID' ? 5 : 4;
  if (['DISPATCHED', 'IN_TRANSIT', 'DELIVERED', 'FAILED'].includes(delivery.status)) return 3;
  return 2; // accepted, delivery pending
}
const ORDER_STATUS_LABELS = { CONFIRMED:'Confirmed', IN_PROGRESS:'In progress', SHIPPED:'Shipped', DELIVERED:'Delivered', COMPLETED:'Completed', DISPUTED:'Disputed', CANCELLED:'Cancelled' }; // English, admin screens
// User-facing (translated) labels for statuses the server sends as enums; unknown values are shown as they are
const ORDER_STATUS_KEYS = { CONFIRMED:'osConfirmed', IN_PROGRESS:'osInProgress', SHIPPED:'osShipped', DELIVERED:'osDelivered', COMPLETED:'osCompleted', DISPUTED:'osDisputed', CANCELLED:'osCancelled' };
const DELIVERY_STATUS_KEYS = { PENDING:'dsPending', DISPATCHED:'dsDispatched', IN_TRANSIT:'dsInTransit', DELIVERED:'dsDelivered', FAILED:'dsFailed' };
const INVOICE_STATUS_KEYS = { ISSUED:'isIssued', PARTIALLY_PAID:'isPartiallyPaid', PAID:'isPaid', OVERDUE:'isOverdue', CANCELLED:'isCancelled' };
const LPO_STATUS_KEYS = { ISSUED:'lsIssued', ACCEPTED:'lsAccepted', DECLINED:'lsDeclined' };
const enumLabel = (map, v) => (v && map[v]) ? t(map[v]) : (v || '—');
const orderStatusLabel = (v) => enumLabel(ORDER_STATUS_KEYS, v);
const stageName = (i) => t('stage' + (i + 1));

// Completed and cancelled orders are history, everything else is live
function isOrderClosed(o){ return o.status === 'COMPLETED' || o.status === 'CANCELLED'; }

// Progress bar + caption for an order. A finished order shows all six segments done (green) instead of
// the last one in the "current step" accent colour; a cancelled one shows an empty grey bar.
function orderProgressHtml(o, captionClass){
  const cap = (text, color) => '<div class="' + captionClass + '" style="color:' + color + ';">' + text + '</div>';
  if (o.status === 'COMPLETED') return stageTrackerHtml(STAGES.length + 1) + cap(esc(t('stagesDone')).replace(' · ', ' &middot; '), 'var(--ok)');
  if (o.status === 'CANCELLED') return stageTrackerHtml(0) + cap(t('osCancelled'), 'var(--bad)');
  const idx = orderStageIndex(o);
  const base = stageName(idx-1) + ' &middot; ' + tpl('stageOf', { n: idx });
  if (o.status === 'DISPUTED') return stageTrackerHtml(idx) + cap(tpl('disputedPrefix', { rest: base }).replace(' · ', ' &middot; '), 'var(--warn)');
  return stageTrackerHtml(idx) + cap(base, 'var(--tx3)');
}

function stageTrackerHtml(currentIndex){
  return '<div class="flex items-center gap-1.5">' + STAGES.map((s,i) => {
    const n = i+1;
    const cls = n < currentIndex ? 'done' : (n === currentIndex ? 'current' : '');
    return '<div class="stage-seg ' + cls + '"><span></span></div>';
  }).join('') + '</div>';
}

// Orders still in flight: LPOs awaiting the supplier's acceptance (no Order row exists yet)
// plus orders that aren't finished. Shared by both hubs and the LPO page so the numbers agree.
function activeOrderCount(){
  const pendingLpos = (state.lpos || []).filter(l => l.status === 'ISSUED').length;
  const openOrders = (state.orders || []).filter(o => o.status !== 'COMPLETED' && o.status !== 'CANCELLED').length;
  return pendingLpos + openOrders;
}

function statsBar(pairs){
  return '<div class="mb-6 grid grid-cols-2 sm:grid-cols-' + pairs.length + ' gap-3">' + pairs.map(([label,val,sub]) =>

      '<div class="eyebrow" style="color:var(--tx4);">' + label + '</div>' +

      (sub ? '<div class="mt-0.5 text-[11.5px]" style="color:var(--tx4);">' + sub + '</div>' : '') +
    '</div>'
  ).join('') + '</div>';
}

// ---------- Buyer: Hub (overview) ----------

// Things the buyer has to act on, counted from data the app already holds; empty when there is nothing
function buyerAttentionItems(){
  const rfqs = state.rfqs || [], orders = state.orders || [];
  const pending = orders.filter(o => o.invoice && o.invoice.id && ['ISSUED', 'PARTIALLY_PAID', 'OVERDUE'].includes(o.invoice.status) && o.status !== 'CANCELLED');
  return [
    ['attnOverdue', pending.filter(o => o.invoice.status === 'OVERDUE').length, "setSection('lpos')", true],
    ['attnReceipts', orders.filter(o => ['SHIPPED', 'DELIVERED'].includes(o.status) && !o.receivedAt).length, "setSection('lpos')", false],
    ['attnQuotes', rfqs.filter(r => ['PUBLISHED', 'QUOTING_CLOSED'].includes(r.status) && rfqBidCount(r) > 0).length, "setSection('rfqs')", false],
    ['attnPay', pending.filter(o => o.receivedAt && invoiceTotals(o.invoice).outstanding > 0 && o.invoice.status !== 'OVERDUE').length, "setSection('lpos')", false],
    ['attnLowStock', (state.stock || []).filter(isLowStock).length, "setSection('stock')", false]
  ].filter(x => x[1] > 0);
}
function attentionBlock(){
  const items = buyerAttentionItems();
  if (!items.length) return '';
  return '<div class="mb-6 rounded-xl border p-3.5" style="border-color:var(--bd); background:var(--panel);">' +
    '<div class="mb-1.5 px-1 text-[13px] font-bold" style="color:var(--tx);">' + t('attnTitle') + '</div>' +
    items.map(([key, n, go, urgent]) => '<button type="button" onclick="' + go + '" class="bx-tap flex w-full min-h-[44px] items-center justify-between gap-3 rounded-lg px-1 text-start text-[13px]" style="color:var(--tx2);">' +
      '<span class="min-w-0">' + t(key) + '</span>' +
      '<span class="flex shrink-0 items-center gap-2"><span class="mono rounded-full px-2.5 py-0.5 text-[12px] font-bold" style="' + (urgent ? 'background:var(--bad-soft); color:var(--bad);' : 'background:var(--acc-soft); color:var(--acc);') + '">' + n + '</span>' + CHEVRON + '</span></button>').join('') +
  '</div>';
}

function renderBuyerHub(){
  const rfqs = state.rfqs || [];
  const active = rfqs.filter(r => r.status === 'PUBLISHED').length;
  const totalQuotes = rfqs.reduce((a,r) => a + (r._count ? r._count.quotes : 0), 0);
  const awarded = rfqs.filter(r => r.status === 'AWARDED').length;
  const openOrders = activeOrderCount();

  return onboardingCard() +
  '<div class="flex flex-wrap items-start justify-between gap-4 mb-6">' +
    '<div><h1 class="text-[26px] font-extrabold" style="color:var(--tx); letter-spacing:-0.01em;"><span class="hidden md:inline">' + t('dashTitleBuyer') + '</span><span class="md:hidden">' + t('dashTitleBuyerShort') + '</span></h1>' +
    '<p class="mt-1 hidden md:block text-[13.5px] max-w-[520px]" style="color:var(--tx3);">' + t('dashSubBuyer') + '</p></div>' +
    '<button onclick="openPostRfq()" class="w-full md:w-auto rounded-xl px-4 py-3 md:py-2.5 text-[14px] md:text-[13px] font-bold text-white shrink-0" style="background:var(--acc);">' + t('createRfq') + '</button>' +
  '</div>' + attentionBlock() +
  statsBar([[t('statActiveRfqs'), active], [t('statTotalQuotes'), totalQuotes], [t('statAwarded'), awarded], [t('statOpenOrders'), openOrders]]) +
  '<div class="flex items-center justify-between mb-4"><h2 class="text-[15px] font-bold" style="color:var(--tx);">' + t('recentRfqs') + hint('rfq') + '</h2><button onclick="setSection(\'rfqs\')" class="text-[12px] font-semibold" style="color:var(--acc);">' + t('viewAll') + '</button></div>' +

// Table on sm: and up; a stack of cards below 640px (a 6-column table has no good way to shrink —
// see the mobile audit notes). Both read from the same per-row `actions`/`tl` so they never drift apart.
const rfqBidCount = (r) => (r._count ? r._count.quotes : 0);
// What tapping a phone card does: compare the bids if there are any, otherwise edit if that is still possible.
// null = nothing to open, so the card is not styled or behaves as tappable.
function rfqCardTap(r){
  if (rfqBidCount(r) > 0) return "openCompare('" + r.id + "')";
  if (canEditRfq(r)) return "openEditRfq('" + r.id + "')";
  return null;
}
const CHEVRON = '<svg class="bx-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

function rfqTable(rfqs){
  const rows = rfqs.map(r => ({ r, tl: timeLeftLabel(r.deadline), actions:
    (canEditRfq(r) ? '<button onclick="event.stopPropagation(); openEditRfq(\'' + r.id + '\')" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bd2); color:var(--tx2);">' + t('btnEdit') + '</button>' : '') +
    (r.status === 'PUBLISHED' && can('rfq.publish') ? '<button onclick="event.stopPropagation(); openCloseBidding(\'' + r.id + '\')" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bd2); color:var(--tx2);">' + t('btnCloseBidding') + '</button>' : '') +
    (canCancelRfq(r) ? '<button onclick="event.stopPropagation(); openCancelRfq(\'' + r.id + '\')" class="rounded-lg border px-3 py-1.5 text-[12px] font-bold" style="border-color:var(--bd2); color:var(--bad);">' + t('btnCancel') + '</button>' : '') +
    (rfqBidCount(r) > 0 && r.status !== 'CANCELLED' ? '<button onclick="event.stopPropagation(); openCompare(\'' + r.id + '\')" class="rounded-lg px-3 py-1.5 text-[12px] font-bold text-white" style="background:var(--acc);">' + t('btnCompare') + '</button>' : '')
  }));

  const table = '<div class="hidden sm:block overflow-x-auto rounded-xl border" style="border-color:var(--bd);"><table class="dtable" style="background:var(--panel);">' +
    '<thead><tr><th>' + esc(t('thRfqTitleId')) + '</th><th>' + t('thCategory') + '</th><th>' + t('thBids') + '</th><th>' + t('thClosingIn') + '</th><th>' + t('thStatus') + '</th><th></th></tr></thead><tbody>' +
    rows.map(({r,tl,actions}) => '<tr>' +
      '<td><div class="flex items-center gap-2.5">' + rfqThumb(r, 30) + '<div><div class="font-semibold" style="color:var(--tx);">' + esc(r.title) + '</div><div class="text-[11px]" style="color:var(--tx4);"><span class="bx-id">RFQ-' + esc(String(r.id).slice(-4).toUpperCase()) + '</span></div></div></div></td>' +
      '<td style="color:var(--tx3);">' + esc(categoryDisplay(r.category)) + '</td>' +
      '<td><span class="mono font-semibold" style="color:var(--tx);">' + (r._count ? r._count.quotes : 0) + '</span></td>' +
      '<td class="mono" data-deadline="' + esc(r.deadline) + '" data-basecolor="var(--tx3)" style="color:' + (tl.urgent?'var(--acc)':'var(--tx3)') + ';">' + tl.label + '</td>' +
      '<td>' + statusPill(r.status) + '</td>' +
      '<td class="text-right"><div class="flex items-center justify-end gap-2">' + actions + '</div></td>' +
    '</tr>').join('') +
  '</tbody></table></div>';

  const cards = '<div class="sm:hidden flex flex-col gap-3">' +
    rows.map(({r,tl,actions}) => { const tap = rfqCardTap(r); const oneCategory = ACTIVE_CATEGORIES.length === 1;
      return '<div class="rounded-xl border p-3.5' + (tap ? ' bx-tap bx-tapcard' : '') + '" style="border-color:var(--bd); background:var(--panel);"' + (tap ? ' role="button" tabindex="0" onclick="' + tap + '"' : '') + '>' +
        '<div class="flex items-start gap-2.5">' + rfqThumb(r, 32) +
          '<div class="min-w-0 flex-1"><div class="font-semibold" style="color:var(--tx);">' + esc(r.title) + '</div>' +
          '<div class="text-[11px]" style="color:var(--tx4);"><span class="bx-id">RFQ-' + esc(String(r.id).slice(-4).toUpperCase()) + '</span></div></div>' +
          '<div class="shrink-0">' + statusPill(r.status) + '</div>' + (tap ? CHEVRON : '') +
        '</div>' +
        '<div class="mt-3 grid ' + (oneCategory ? 'grid-cols-2' : 'grid-cols-3') + ' gap-2 text-[12px]">' +
          (oneCategory ? '' : '<div><div class="eyebrow" style="font-size:9.5px; color:var(--tx4);">' + t('mobCategory') + '</div><div class="mt-1" style="color:var(--tx3);">' + esc(categoryDisplay(r.category)) + '</div></div>') +
          '<div><div class="eyebrow" style="font-size:9.5px; color:var(--tx4);">' + t('mobBids') + '</div><div class="mono mt-1 font-semibold" style="color:var(--tx);">' + (r._count ? r._count.quotes : 0) + '</div></div>' +
          '<div><div class="eyebrow" style="font-size:9.5px; color:var(--tx4);">' + t('mobClosing') + '</div><div class="mono mt-1" data-deadline="' + esc(r.deadline) + '" data-basecolor="var(--tx3)" style="color:' + (tl.urgent?'var(--acc)':'var(--tx3)') + ';">' + tl.label + '</div></div>' +
        '</div>' +
        (actions ? '<div class="mt-3 flex flex-wrap gap-2">' + actions + '</div>' : '') +
      '</div>'; }
    ).join('') +
  '</div>';

  return table + cards;
}

function statusPill(status){
  const map = {
    PUBLISHED: ['background:var(--info-soft); color:var(--info);',t('stLive')],
    DRAFT: ['background:var(--line); color:var(--tx2);',t('stDraft')],
    AWARDED: ['background:var(--pend-soft); color:var(--pend);',t('stAwarded')],
    QUOTING_CLOSED: ['background:var(--line); color:var(--tx2);',t('stClosed')],
    CANCELLED: ['background:var(--bad-soft); color:var(--bad);',t('stCancelled')]
  };
  const [style,label] = map[status] || ['background:var(--line); color:var(--tx2);', status];
  return '<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold" style="' + style + '">' + label + '</span>';
}

function renderBuyerRfqsPage(){
  const rfqs = state.rfqs || [];

    '<div><div class="eyebrow mb-1.5">' + t('rfqsAllRequests') + '</div><h1 class="text-[22px] font-extrabold" style="color:var(--tx);">' + t('rfqsPageTitle') + hint('rfq') + '</h1></div>' +

  '</div>' +

// ---------- LPO Management (shared buyer/supplier, 6-stage tracker) ----------

function renderLpoManagement(isBuyer){
  const pending = (state.lpos || []).filter(l => l.status === 'ISSUED');
  const orders = state.orders || [];
  const liveOrders = orders.filter(o => !isOrderClosed(o));
  const closedOrders = orders.filter(isOrderClosed);
  const liveCount = activeOrderCount(); // = pending LPOs + live orders, i.e. exactly what the Live section lists
  return '<div class="eyebrow mb-1.5">' + t('lpoEyebrow') + '</div>' +
  '<h1 class="text-[24px] font-extrabold mb-2" style="color:var(--tx); letter-spacing:-0.01em;">' + t('lpoTitle') + hint('lpo') + '</h1>' +
  '<p class="mb-5 text-[13.5px] max-w-[620px]" style="color:var(--tx3);">' + t('lpoSubtitle') + '</p>' +
  '<div class="inline-block mb-6 rounded-lg border px-3.5 py-2 mono text-[12px]" style="border-color:var(--bd); background:var(--inset); color:var(--tx3);">' + tpl('lpoLiveCount', { n: liveCount }) + '</div>' +
  '<div class="mb-6 flex flex-wrap gap-2">' + STAGES.map((s,i) => '<span class="chip" style="cursor:default;">' + (i+1) + ' &nbsp;' + stageName(i) + '</span>').join('') + '</div>' +
  (isBuyer ? renderBuyerPendingLpos() : renderAwaitingLpos()) +
  (liveOrders.length === 0 && pending.length === 0
    ? emptyState(t(orders.length ? 'lpoNoLive' : 'lpoNoOrders'),
        t(orders.length ? 'lpoFinishedBelow' : (isBuyer ? 'lpoBuyerEmpty' : 'lpoSupplierEmpty')))
    : (liveOrders.length ? '<h2 class="text-[14px] font-bold mb-3" style="color:var(--tx);">' + t('lpoLiveOrders') + '</h2><div class="flex flex-col gap-3">' + liveOrders.map(o => lpoTrackerRow(o, isBuyer)).join('') + '</div>' : '')) +
  renderClosedOrders(closedOrders, isBuyer);
}

// Buyer's read-only view of awarded LPOs the supplier hasn't accepted yet (they count as live)
function renderBuyerPendingLpos(){
  const pending = (state.lpos || []).filter(l => l.status === 'ISSUED');
  if (pending.length === 0) return '';
  return '<h2 class="text-[14px] font-bold mb-3" style="color:var(--tx);">' + t('lpoAwaitingSupplier') + '</h2>' +
    '<div class="flex flex-col gap-3 mb-8">' + pending.map(l =>
      '<div class="flex items-center justify-between gap-3 rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);">' +
        '<div><div class="font-semibold" style="color:var(--tx);">' + esc(l.rfq ? l.rfq.title : t('lpoPurchaseOrder')) + '</div>' +
        '<div class="mono mt-0.5 text-[12px]" style="color:var(--tx3);">' + fmt(l.totalAmount) + '</div></div>' +
        '<span class="rounded-full px-2.5 py-1 text-[11px] font-semibold shrink-0" style="background:var(--warn-soft); color:var(--warn);">' + t('lpoWaitingSupplier') + '</span>' +
      '</div>').join('') + '</div>';
}

// Completed and cancelled orders: collapsed history below the live pipeline
function toggleClosedOrders(){ setState({ showClosedOrders: !state.showClosedOrders }); }
function renderClosedOrders(closed, isBuyer){
  if (closed.length === 0) return '';
  return '<div class="mt-8">' +
    '<button onclick="toggleClosedOrders()" class="mb-3 flex items-center gap-2 text-[14px] font-bold" style="color:var(--tx);">' +
      '<span style="display:inline-block; width:12px; color:var(--tx4);">' + (state.showClosedOrders ? '&#9662;' : '&#9656;') + '</span>' +
      t('lpoClosedGroup') + ' <span class="mono text-[12px] font-semibold rounded-full px-2 py-0.5" style="background:var(--line); color:var(--tx2);">' + closed.length + '</span>' +
    '</button>' +

function lpoTrackerRow(o, isBuyer){

  const idLabel = 'LPO-' + esc(String(o.lpo ? o.lpo.id : o.id).slice(-4).toUpperCase());
  const counterpartyCompany = isBuyer ? (o.lpo && o.lpo.supplierCompany) : (o.lpo && o.lpo.buyerCompany);
  return '<div class="rounded-xl border p-4" style="border-color:var(--bd); background:var(--panel);' + (isOrderClosed(o) ? ' opacity:0.85;' : '') + '">' +

        '<div class="text-[11.5px] mt-0.5" style="color:var(--tx4);"><span class="bx-id">' + idLabel + '</span>' + (counterpartyCompany ? ' · ' + companyLabel(counterpartyCompany) : '') + '</div></div>' +

      (isBuyer && o.status === 'COMPLETED' ? '<button onclick="reorderFromOrder(\'' + o.id + '\')" class="rounded-lg border px-3.5 py-2 text-[12px] font-bold shrink-0" style="border-color:var(--bd2); color:var(--tx2);">' + t('reorder') + '</button>' : '') +
      '<button onclick="openOrderDetail(\'' + o.id + '\')" class="rounded-lg px-3.5 py-2 text-[12px] font-bold text-white shrink-0" style="background:var(--acc);">' + t('lpoOpenOrder') + '</button>' +
    '</div>' +
  '</div>';
}

function renderAwaitingLpos(){
  const pending = (state.lpos || []).filter(l => l.status === 'ISSUED');
  if (pending.length === 0) return '';
  return '<h2 class="text-[14px] font-bold mb-3" style="color:var(--tx);">' + t('lpoAwaitingYou') + '</h2>' +

          actionBtn(t('lpoAccept'), "acceptLpo('" + l.id + "')", state.ordersBusyId === l.id) +
        '</div>' +
      '</div>').join('') + '</div>';
}

// Hub widgets: live orders only (finished ones live under LPO management -> Completed)
function renderOrdersList(isSupplier, limit){
  const all = state.orders || [];
  let orders = all.filter(o => !isOrderClosed(o));
  if (limit) orders = orders.slice(0, limit);
  if (orders.length === 0) {
    return all.length
      ? emptyState(t('lpoNoneInProgress'), t('lpoCompletedUnder'))
      : emptyState(t('lpoNoOrders'), t(isSupplier ? 'lpoSupplierEmpty' : 'lpoBuyerEmpty'));
  }
  return '<div class="flex flex-col gap-3">' + orders.map(o => lpoTrackerRow(o, !isSupplier)).join('') + '</div>';
}

    SHORTLISTED: [t('oppShortlisted'), 'background:var(--info-soft); color:var(--info);'],
    REJECTED: [t('oppNotSelected'), 'background:var(--bad-soft); color:var(--bad);'],

      (quoted

function fmtQty(n){
  const num = Number(n) || 0;
  return Number.isInteger(num) ? String(num) : num.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
}
function isLowStock(item){ return Number(item.threshold) > 0 && Number(item.quantity) <= Number(item.threshold); }

// ---------- Buyer: spending and price history (#/spending) ----------
// Numbers come from GET /api/analytics/spending and /api/analytics/items[/detail] (buyer only, own data only).
// Spending = the invoice amount of orders whose receipt the buyer confirmed in the period (Bahrain days).
// BEGIN ANALYTICS HELPERS (pure functions: test/analytics.test.js loads this block on its own)
const SPEND_BAHRAIN_OFFSET_MS = 3 * 60 * 60 * 1000;
function spendToday(){ return new Date(Date.now() + SPEND_BAHRAIN_OFFSET_MS).toISOString().slice(0, 10); }
// the period of a quick button, ending today
function spendPreset(preset, today){
  const [y, m] = today.split('-').map(Number);
  const iso = (yy, mm, dd) => new Date(Date.UTC(yy, mm - 1, dd)).toISOString().slice(0, 10);
  if (preset === 'month') return { from: iso(y, m, 1), to: today };
  if (preset === '3m') return { from: iso(y, m - 2, 1), to: today };
  if (preset === 'year') return { from: iso(y, 1, 1), to: today };
  return { from: iso(y, m - 11, 1), to: today };
}
// the same rules as the server, so a bad period is explained here and never reaches it; returns an I18N key or null
function spendRangeError(from, to){
  const ok = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(new Date(s + 'T00:00:00Z').getTime()) && new Date(s + 'T00:00:00Z').toISOString().slice(0, 10) === s;
  if (!ok(from) || !ok(to)) return 'spBadDate';
  if (from > to) return 'spBadRange';
  const [y, m, d] = to.split('-').map(Number);
  if (from < new Date(Date.UTC(y - 5, m - 1, d)).toISOString().slice(0, 10)) return 'spTooLong';
  return null;
}
// One CSV cell. Text that could be run as a formula by a spreadsheet (starts with = + - @ or a tab / return) gets a
// leading apostrophe; real numbers (amounts, prices, quantity) stay plain numbers. Quoted when it holds , ; " or a line break.
function csvCell(v, isNumber){
  if (v == null || v === '') return '';
  let s = String(v);
  if (isNumber && /^-?\d+(\.\d+)?$/.test(s)) return s;
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",;\r\n]|^\s|\s$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
// lines: the `lines` of the spending answer; tr(key): the translated header; invLabel(status): invoice status text
function buildSpendingCsv(lines, tr, invLabel){
  const cols = [
    ['receivedDay', 'csvDate'], ['lpo', 'csvLpo'], ['supplier', 'csvSupplier'], ['title', 'csvItem'], ['category', 'csvCategory'], ['quantity', 'csvQty', 1],
    ['unit', 'csvUnit'], ['unitPrice', 'csvUnitPrice', 1], ['total', 'csvTotal', 1], ['paid', 'csvPaid', 1], ['invoice', 'csvInvoice'],
  ];
  const rows = [cols.map(c => csvCell(tr(c[1]))).join(',')];
  for (const l of lines) {
    const v = { ...l, lpo: 'LPO-' + String(l.lpoId || '').slice(-4).toUpperCase(), invoice: l.invoiceStatus ? invLabel(l.invoiceStatus) : '' };
    rows.push(cols.map(c => csvCell(v[c[0]], !!c[2])).join(','));
  }
  return '﻿' + rows.join('\r\n') + '\r\n';
}
// 'YYYY-MM' -> "Oct 26" / "أكتوبر 26"
function spendMonthLabel(month, locale){
  const [y, m] = month.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString(locale, { month: 'short', year: '2-digit', timeZone: 'UTC' });
}
function spendDayLabel(day, locale){ return new Date(day + 'T12:00:00Z').toLocaleDateString(locale, { timeZone: 'UTC' }); }
// bars of the monthly total: [{ x, y, w, h, month, value }] in a box of width W and height H (value strings like "12.500")
function spendBars(months, W, H){
  const max = Math.max(0, ...months.map(m => Number(m.received)));
  const step = W / Math.max(1, months.length), bw = Math.min(34, step * 0.64);
  return months.map((m, i) => {
    const h = max > 0 ? Math.round((Number(m.received) / max) * H * 10) / 10 : 0;
    return { x: Math.round((i * step + (step - bw) / 2) * 10) / 10, y: Math.round((H - h) * 10) / 10, w: Math.round(bw * 10) / 10, h, month: m.month, value: m.received };
  });
}
// the key of an item = the server's itemKey: same name + same unit, capitals and extra spaces ignored
function spendItemKey(title, unit){
  const part = (x) => String(x == null ? '' : x).normalize('NFKC').trim().replace(/\s+/g, ' ').toLowerCase();
  return part(title) + '|' + part(unit);
}
// from the detail of an item: what was paid the last time, on another request than `exceptRfqId`, or null
function lastPaidOf(detail, exceptRfqId){
  for (const r of (detail && detail.rfqs) || []) {
    if (r.rfqId === exceptRfqId || r.chosenUnitPrice == null) continue;
    const b = r.bids.find(x => x.chosen);
    if (b) return { unitPrice: r.chosenUnitPrice, supplier: b.supplier, day: r.day, unit: r.unit };
  }
  return null;
}

function spendInit(){
  if (!state.spendRange) state.spendRange = spendPreset('12m', spendToday());

let spendReq = 0, priceReq = 0;
async function loadSpending(){
  const r = state.spendRange, bad = spendRangeError(r.from, r.to);
  if (bad) { showToast(t(bad)); return; }
  const mine = ++spendReq;
  setState({ spendLoading: true, spendError: false });
  try {
    const d = await api('/api/analytics/spending?from=' + r.from + '&to=' + r.to);
    if (mine === spendReq) setState({ spendData: d, spendLoading: false });
  } catch(e) { if (mine === spendReq) { setState({ spendLoading: false, spendError: true }); showToast(e.message); } }
}

async function loadPriceItems(){
  const mine = ++priceReq;
  setState({ priceLoading: true, spendError: false });
  try {
    const d = await api('/api/analytics/items' + (state.priceSearch ? '?search=' + encodeURIComponent(state.priceSearch) : ''));
    if (mine === priceReq) setState({ priceItems: d.items, priceLoading: false });

async function openPriceItem(i){

  setState({ priceKeyIdx: i, priceDetail: null });

  } catch(e) { showToast(e.message); setState({ priceKeyIdx: null }); }
}
function closePriceItem(){ setState({ priceKeyIdx: null, priceDetail: null }); }
function downloadSpendingCsv(){
  const d = state.spendData;
  if (!d || !d.lines.length) return;
  const csv = buildSpendingCsv(d.lines, t, (s) => enumLabel(INVOICE_STATUS_KEYS, s));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'biddex-spending-' + d.period.from + '_' + d.period.to + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
